# Nginx delante de PHP-FPM (servicio `app`). Sirve SOLO el backend Laravel:
# la API (/api/v1/...), /up y los archivos de backend/public.
#
# Las SPA (frontend/apps/admin y frontend/apps/portal) NO se sirven aquí:
# en desarrollo corren con Vite (:3000 y :3001). docs/00 §12 prevé que en
# producción este Nginx sirva también sus builds; queda pendiente montar los
# dist/ y definir los subdominios (D-19).
server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;
    client_max_body_size 20m;

    # Cabeceras de seguridad requeridas por docs/00 y docs/10
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Solo el front controller de Laravel se ejecuta con PHP.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Cualquier otro .php en public/ no se ejecuta.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
