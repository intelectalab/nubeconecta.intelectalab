# Entorno de desarrollo de hub. Variables: copiar infra/.env.example a infra/.env
# (Docker Compose lo lee desde este directorio). Los valores por defecto
# ${VAR:-valor} son SOLO de desarrollo; en staging/producción se definen en infra/.env.

x-laravel-env: &laravel-env
  # Tienen prioridad sobre backend/.env dentro de los contenedores.
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-hub}
  DB_USERNAME: ${DB_USERNAME:-hub_owner}
  DB_PASSWORD: ${DB_PASSWORD:-hub_secret_password}
  HUB_SCHEMA_PATH: /var/www/database/schema.sql
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  # Correo de desarrollo: Mailpit captura todo (bandeja en http://localhost:8025); nada sale a Internet.
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_FROM_ADDRESS: no-reply@alojamientoplus.test
  MAIL_FROM_NAME: AlojamientoPlus
  HUB_PORTAL_URL: ${HUB_PORTAL_URL:-http://localhost:3001}
  # The portal SPA runs on Vite :3001; Sanctum must classify its origin as stateful.
  SANCTUM_STATEFUL_DOMAINS: localhost,localhost:3000,localhost:3001,localhost:8080,127.0.0.1,127.0.0.1:3000,127.0.0.1:3001,127.0.0.1:8080,::1

services:
  # Base de datos relacional canónica (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: hub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hub}
      POSTGRES_USER: ${DB_USERNAME:-hub_owner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hub_secret_password}
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_recovery_data:/var/lib/postgresql/data
      # Carga el esquema canónico SOLO en el primer arranque del volumen. La
      # migración base de Laravel (0000_00_00_000000_load_canonical_schema)
      # hace lo mismo si falta y se salta si ya está: ambos caminos conviven.
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hub_net

  # Motor de colas, caché, sesiones y limitador de tasa
  redis:
    image: redis:7-alpine
    container_name: hub_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hub_net

  # Backend PHP 8.3 / PHP-FPM
  app:
    build: &php-build
      context: ..
      dockerfile: infra/docker/php/Dockerfile
      args:
        INSTALL_PHPREDIS: ${INSTALL_PHPREDIS:-0}
    image: hub-php:dev
    container_name: hub_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment: *laravel-env
    volumes:
      - ../backend:/var/www/html
      - laravel_vendor:/var/www/html/vendor
      - ../database:/var/www/database:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hub_net

  # Nginx: sirve solo el backend Laravel (API y backend/public).
  # Las SPA corren con Vite en desarrollo (ver docker/nginx/default.conf).
  web:
    image: nginx:alpine
    container_name: hub_web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ../backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - hub_net

  # Bandeja de correo de desarrollo (SMTP 1025 interno, interfaz web en el host).
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: hub_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks:
      - hub_net

  # Horizon (colas de config/horizon.php)
  worker:
    build: *php-build
    image: hub-php:dev
    container_name: hub_worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "horizon"]
    environment: *laravel-env
    volumes:
      - ../backend:/var/www/html
      - laravel_vendor:/var/www/html/vendor
      - ../database:/var/www/database:ro
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hub_net

  # Scheduler (ejecuta las tareas programadas cada minuto)
  scheduler:
    build: *php-build
    image: hub-php:dev
    container_name: hub_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    environment: *laravel-env
    volumes:
      - ../backend:/var/www/html
      - laravel_vendor:/var/www/html/vendor
      - ../database:/var/www/database:ro
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - hub_net

  # ========================================================
  # Web pública: WordPress (instalación simple) + plugin Hub Connector.
  # docs prevé WordPress Multisite (T-31), pero este servicio NO lo configura:
  # estructura y hosting de la red pendientes (D-29). La red Multisite se
  # habilita después desde WordPress (Herramientas > Configuración de la red).
  # ========================================================
  wordpress_db:
    image: mariadb:10.11
    container_name: hub_wp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WP_DB_NAME:-wordpress}
      MYSQL_USER: ${WP_DB_USER:-wp_user}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD:-wp_password}
      MYSQL_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:-wp_root_password}
    volumes:
      - wordpress_db_recovery_data:/var/lib/mysql
    networks:
      - hub_net

  wordpress:
    image: wordpress:php8.2-apache
    container_name: hub_wordpress
    restart: unless-stopped
    ports:
      - "${WP_PORT:-8000}:80"
    environment:
      WORDPRESS_DB_HOST: wordpress_db:3306
      WORDPRESS_DB_USER: ${WP_DB_USER:-wp_user}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wp_password}
      WORDPRESS_DB_NAME: ${WP_DB_NAME:-wordpress}
      WORDPRESS_CONFIG_EXTRA: "define( 'WP_ENVIRONMENT_TYPE', 'local' ); define( 'FS_METHOD', 'direct' );"
      HUB_PORTAL_URL: ${HUB_PORTAL_URL:-http://localhost:3001}   # botón «Portal del cliente» de la web
    volumes:
      - wordpress_data:/var/www/html
      - ./docker/wordpress/wordpress-rewrites.conf:/etc/apache2/conf-enabled/zz-wordpress-rewrites.conf:ro
      # Monta directamente nuestro plugin Hub Connector para que aparezca en el panel de WP
      - ../plugins/hub-connector:/var/www/html/wp-content/plugins/hub-connector
    depends_on:
      - wordpress_db
    networks:
      - hub_net

volumes:
  # Recovery volume; the original volume is kept untouched.
  postgres_recovery_data:
    name: infra_postgres_data_recovery
  redis_data:
  wordpress_db_recovery_data:
    name: infra_wp_db_data_recovery
  wordpress_data:
  laravel_vendor:
    name: infra_laravel_vendor

networks:
  hub_net:
    driver: bridge
