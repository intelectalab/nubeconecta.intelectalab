services:
  # Base de datos relacional canónica (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: hub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hub}
      POSTGRES_USER: ${DB_USERNAME:-hub_owner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hub_secret_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Al inicializar por primera vez, carga automáticamente el esquema de 203 tablas
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hub_owner} -d ${DB_DATABASE:-hub}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hub_net

  # Motor de colas, caché y limitador de tasa
  redis:
    image: redis:7-alpine
    container_name: hub_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hub_net

  # Backend PHP 8.3 / PHP-FPM
  app:
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
    container_name: hub_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hub_net

  # Servidor web Nginx (API + estáticos SPA)
  web:
    image: nginx:alpine
    container_name: hub_web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ../backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - hub_net

  # Horizon (Gestión y procesamiento de colas asíncronas)
  worker:
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
    container_name: hub_worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "horizon"]
    volumes:
      - ../backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hub_net

  # Scheduler (Planificador de tareas cron cada minuto)
  scheduler:
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
    container_name: hub_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"]
    volumes:
      - ../backend:/var/www/html
    depends_on:
      - app
    networks:
      - hub_net

volumes:
  postgres_data:
  redis_data:

networks:
  hub_net:
    driver: bridge
