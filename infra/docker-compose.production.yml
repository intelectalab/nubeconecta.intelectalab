services:
  postgres:
    image: postgres:16-alpine
    container_name: hub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE to the existing Hub DB}
      POSTGRES_USER: ${DB_OWNER_USERNAME:?Set DB_OWNER_USERNAME to the existing Postgres volume owner}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password]
    ports: !override []
    volumes:
      - postgres_recovery_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: hub-redis:${HUB_RELEASE:-prod-local}
    container_name: hub_redis
    build:
      context: ..
      dockerfile: infra/docker/redis.Dockerfile
    restart: unless-stopped
    ports: !override []
    entrypoint: ["/usr/local/bin/hub-redis-entrypoint", "/run/secrets/redis_password"]
    command: []
    volumes: !override []
    secrets: [redis_password]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app: &php-service
    image: hub-php:${HUB_RELEASE:-prod-local}
    container_name: hub_app
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
      target: runtime
      args:
        INSTALL_PHPREDIS: "0"
    restart: unless-stopped
    environment: &php-env
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${HUB_API_URL:?Set HUB_API_URL}
      APP_KEY_FILE: /run/secrets/laravel_app_key
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE}
      DB_OWNER_USERNAME: ${DB_OWNER_USERNAME:?Set DB_OWNER_USERNAME}
      DB_OWNER_PASSWORD_FILE: /run/secrets/db_owner_password
      DB_USERNAME: ${HUB_DB_APP_USERNAME:-hub_app_login}
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      HUB_DB_APP_USERNAME: ${HUB_DB_APP_USERNAME:-hub_app_login}
      HUB_DB_APP_PASSWORD_FILE: /run/secrets/db_app_password
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      HUB_SCHEMA_PATH: /var/www/database/schema.sql
      HUB_VAULT_KEY_FILE: /run/secrets/hub_vault_key
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?Set SANCTUM_STATEFUL_DOMAINS}
      SESSION_SECURE_COOKIE: "true"
    secrets: &php-secrets
      - laravel_app_key
      - db_owner_password
      - db_app_password
      - redis_password
      - hub_vault_key
    volumes: !override
      - laravel_storage:/var/www/html/storage
    expose: ["9000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *php-service
    container_name: hub_worker
    command: ["php", "artisan", "horizon"]
    environment: *php-env
    secrets: *php-secrets
    volumes: !override
      - laravel_storage:/var/www/html/storage
    healthcheck:
      disable: true

  scheduler:
    <<: *php-service
    container_name: hub_scheduler
    command: ["php", "artisan", "schedule:work"]
    environment: *php-env
    secrets: *php-secrets
    volumes: !override
      - laravel_storage:/var/www/html/storage
    healthcheck:
      disable: true

  web:
    image: hub-nginx:${HUB_RELEASE:-prod-local}
    container_name: hub_web
    build:
      context: ..
      dockerfile: infra/docker/nginx/Dockerfile
    restart: unless-stopped
    ports: !override []
    expose: ["80"]
    volumes: !override []
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  wordpress_db:
    image: mariadb:10.11
    container_name: hub_wp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${WP_DB_NAME:?Set WP_DB_NAME}
      MYSQL_USER: ${WP_DB_USER:?Set WP_DB_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/wp_db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/wp_db_root_password
    secrets: [wp_db_password, wp_db_root_password]
    volumes: !override
      - wordpress_db_recovery_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  wordpress-plugin-init:
    image: hub-wordpress:${HUB_RELEASE:-prod-local}
    container_name: hub_wordpress_plugin_init
    build:
      context: ..
      dockerfile: infra/docker/wordpress.Dockerfile
      args:
        INSTALL_HUB_CONNECTOR: "1"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'if [ ! -f /plugin/.hub-plugin-version ] || [ "$$(cat /plugin/.hub-plugin-version)" != "$${HUB_RELEASE:-prod-local}" ]; then find /plugin -mindepth 1 -maxdepth 1 -exec rm -rf {} +; cp -a /usr/src/wordpress/wp-content/plugins/hub-connector/. /plugin/; echo "$${HUB_RELEASE:-prod-local}" > /plugin/.hub-plugin-version; fi'
    restart: "no"
    environment:
      HUB_RELEASE: ${HUB_RELEASE:-prod-local}
    volumes:
      - wordpress_connector_plugin:/plugin

  wordpress:
    image: hub-wordpress:${HUB_RELEASE:-prod-local}
    container_name: hub_wordpress
    build:
      context: ..
      dockerfile: infra/docker/wordpress.Dockerfile
      args:
        INSTALL_HUB_CONNECTOR: "1"
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: wordpress_db:3306
      WORDPRESS_DB_USER: ${WP_DB_USER:?Set WP_DB_USER}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/wp_db_password
      WORDPRESS_DB_NAME: ${WP_DB_NAME:?Set WP_DB_NAME}
      WORDPRESS_CONFIG_EXTRA: "define( 'WP_ENVIRONMENT_TYPE', 'production' ); define( 'FS_METHOD', 'direct' );"
    secrets: [wp_db_password]
    ports: !override []
    expose: ["80"]
    volumes: !override
      - wordpress_data:/var/www/html
      - wordpress_uploads:/var/www/html/wp-content/uploads
      - wordpress_connector_plugin:/var/www/html/wp-content/plugins/hub-connector:ro
    depends_on:
      wordpress_db:
        condition: service_healthy
      wordpress-plugin-init:
        condition: service_completed_successfully

  proxy:
    image: ${HUB_PROXY_IMAGE:-caddy:2-alpine}
    container_name: hub_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:?Set HUB_DOMAIN}
      WP_DOMAIN: ${WP_DOMAIN:?Set WP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      wordpress:
        condition: service_started
    networks:
      - hub_net

volumes:
  laravel_storage:
  wordpress_uploads:
  wordpress_data:
  wordpress_connector_plugin:
  wordpress_db_recovery_data:
    name: infra_wp_db_data_recovery
  postgres_recovery_data:
    name: infra_postgres_data_recovery
  redis_data:
  caddy_data:
  caddy_config:

secrets:
  db_owner_password:
    file: ${SECRETS_DIR:-./secrets}/db_owner_password.txt
  db_app_password:
    file: ${SECRETS_DIR:-./secrets}/db_app_password.txt
  wp_db_password:
    file: ${SECRETS_DIR:-./secrets}/wp_db_password.txt
  wp_db_root_password:
    file: ${SECRETS_DIR:-./secrets}/wp_db_root_password.txt
  redis_password:
    file: ${SECRETS_DIR:-./secrets}/redis_password.txt
  laravel_app_key:
    file: ${SECRETS_DIR:-./secrets}/laravel_app_key.txt
  hub_vault_key:
    file: ${SECRETS_DIR:-./secrets}/hub_vault_key.txt
