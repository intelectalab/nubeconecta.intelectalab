    if($('.pop.open')){const b=$('#popUser').classList.contains('open')?'#btnUser':'#btnNotif';closePops();$(b).focus();return}
    if($('#app').classList.contains('drawer')){setDrawer(false);$('#btnMenu').focus();return}
  }
  if(e.key==='Tab'&&($('#modalRoot').classList.contains('open')||sheetOpen())){
    const R=$('#modalRoot').classList.contains('open')?'#modal':'#sheet';
    const f=$$(`${R} a[href],${R} button:not([disabled]),${R} input:not([disabled]),${R} select,${R} textarea,${R} [tabindex="0"]`).filter(x=>x.offsetParent!==null);
    if(f.length){const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}

  if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&e.target.getAttribute&&e.target.getAttribute('role')==='tab'){

});

   <label class="field">Moneda<select class="select" data-on="cur">${curOpts()}</select></label>
   <label class="field">Categoría<select class="select" data-h="kF" data-k="kCat">${[['','Todas'],['hosting','Hosting'],['vps','VPS'],['correo','Correo'],['dominios','Dominios'],['ssl','SSL'],['web','Páginas y tiendas'],['otros','Otros']].map(([a,b])=>`<option value="${a}"${S.kCat===a?' selected':''}>${b}</option>`).join('')}</select></label>
   <label class="field">Responsable<select class="select" data-h="kF" data-k="kResp"><option value="">Todos</option>${resp.map(x=>`<option${S.kResp===x?' selected':''}>${x}</option>`).join('')}</select></label>
  </div></section>
  <section class="card" style="margin-bottom:16px"><div class="statline kd-stats">
   <div><small>${kPerLabel()}</small><b class="kd-big">${kFmt(k,v)}</b></div>
   <div><small>${S.kCmp==='anual'?'Año anterior':'Periodo anterior'}</small><b>${kFmt(k,p)}</b></div>
   <div><small>Variación</small><b class="kc-d ${dl.cls}">${dl.txt}</b></div>
   <div><small>Meta</small><b>${kFmt(k,g)}</b></div><div><small>Estado</small><b>${chip(stt,sc)}</b></div>
   <div><small>Registros</small><b>${NF0.format(all.length)} <span class="sub">${esc(sp.e)}</span></b></div>
   ${filt?`<div class="kd-fv"><small>Valor con su filtro</small><b>${fv==null?'—':kFmt(k,fv)}</b></div>`:''}
  </div><div class="kd-recon ${ok?'ok':'warn'}">${ic(ok?'check':'info','sm')}<span>${ok?`El total del listado (${kdMeasLbl(k)}) coincide con el indicador.`:'El listado no coincide con el indicador; revise la fórmula.'}${sp.note?' '+esc(sp.note):''}${sp.nobrand&&S.brand!=='all'?' Este indicador es de infraestructura compartida: no se separa por marca.':''}</span></div></section>
  <div class="kcharts kd-charts">
   <section class="card kwide"><div class="card-h"><h2 class="sec">Evolución · 12 periodos</h2><span class="sub">valor del indicador, periodo de comparación y meta</span></div><div class="card-b"><div class="kchart" id="kdEvo"></div></div></section>
   ${dc?`<section class="card"><div class="card-h"><h2 class="sec">Por ${esc(dc.l.toLowerCase())}</h2><span class="sub">${filt?'según su filtro':'todas las filas'} · clic para filtrar</span></div><div class="card-b"><div class="kchart" id="kdDim"></div><div class="kd-chips">${kdGroup(k,rows,dc).slice(0,12).map(x=>`<button class="btn sm${F.dim===x.id?' primary':''}" data-act="kdPickDim" data-v="${esc(x.id)}" aria-pressed="${F.dim===x.id}">${esc(x.n)} · ${kFmt(k,x.v,true)}</button>`).join('')}</div></div></section>`:''}
   ${(()=>{const c2=scol||xc||(dc&&dc.t!=='brand'&&!sp.nobrand?cBr:null);return c2?`<section class="card"><div class="card-h"><h2 class="sec">Por ${esc(c2.l.toLowerCase())}</h2><span class="sub">${filt?'según su filtro':'todas las filas'}</span></div><div class="card-b"><div class="kchart" id="kdX" data-col="${c2.k}"></div></div></section>`:''})()}
  </div>
  <section class="card" style="margin-top:16px"><div class="card-h"><h2 class="sec">Registros del indicador</h2><span class="sub">${esc(sp.e)} · ${kPerLabel()}${S.brand==='all'?'':' · '+BR[S.brand].n}</span></div>
   <div class="toolbar"><label class="input-ic"><span class="sr-only">Buscar en los registros</span>${ic('search')}<input class="input" type="search" placeholder="Buscar en ${esc(sp.e)}…" value="${esc(F.q)}" data-h="kdQ"></label>
    ${dc?`<select class="select" data-h="kdSel" data-k="dim" aria-label="${esc(dc.l)}"><option value="">${esc(dc.l)}: todos</option>${opts(dc,F.dim)}</select>`:''}
    ${xc?`<select class="select" data-h="kdSel" data-k="x2" aria-label="${esc(xc.l)}"><option value="">${esc(xc.l)}: todos</option>${opts(xc,F.x2)}</select>`:''}
    ${scol?`<select class="select" data-h="kdSel" data-k="st" aria-label="${esc(scol.l)}"><option value="">${esc(scol.l)}: todos</option>${opts(scol,F.st)}</select>`:''}
    ${filt?`<button class="btn ghost sm" data-act="kdClear">${ic('x','sm')}Limpiar filtros</button>`:''}
    <span class="count">${plural(rows.length,'registro','registros')}</span></div>
   ${rows.length?`<div class="tw"><table class="t kd-t"><thead><tr>${sp.cols.map(th).join('')}</tr></thead><tbody>${page.map(r=>`<tr>${sp.cols.map(c=>`<td class="${kdNum(c)?'r':''}">${kdCell(c,r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody>${foot()}</table></div>${pager(F.pg,rows.length,PER,'kdPg')}`
   :emptyState(all.length?'Sin registros con estos filtros':'Sin registros en el periodo',all.length?'Cambie o limpie los filtros de la tabla.':'Pruebe otro periodo o marca.',filt?`<button class="btn" data-act="kdClear">Limpiar filtros</button>`:'')}
  </section>
  ${others.length?`<section class="kd-more" aria-label="Otros indicadores del grupo"><h2 class="sec" style="margin:18px 0 10px">Otros indicadores de ${esc(gname)}</h2><div class="kgrid">${others.map(x=>kCard(x)).join('')}</div></section>`:''}`;
}
function kdDraw(){const k=KBY[S.kId];if(!k||!KDS[k.id]||!$('#kdEvo'))return;const sp=KDS[k.id],g=kGoal(k),L=kLabels();
  drawSpec($('#kdEvo'),{type:'line',labels:L,fmt:v2=>kFmt(k,v2,true),ml:72,title:'Evolución de '+k.n,series:[{n:k.n,v:kSpark(k)},{n:S.kCmp==='anual'?'Año anterior':'Periodo anterior',v:kSpark(k,kCmpOff()),dash:true,c:'var(--faint)'},{n:'Meta',v:L.map(()=>g),dash:true,c:'var(--c4)'}],h:240});
  const rows=kdFiltered(k,kdRows(k)),dc=sp.cols.find(c=>c.dim);
  const hb=(el,col)=>{const it=kdGroup(k,rows,col).slice(0,10).map((x,i)=>({n:x.n,v:Math.max(0,x.v),c:CC[i%CC.length]}));if(!it.length){el.innerHTML=`<p class="sub" style="margin:8px 0">Sin datos para graficar.</p>`;return}drawSpec(el,{type:'hbar',fmt:v2=>kFmt(k,v2,true),items:it,h:Math.max(110,it.length*32+12),title:k.n+' por '+col.l,max:sp.m.t==='share'||k.unit==='pct'?100:undefined})};
  if(dc&&$('#kdDim'))hb($('#kdDim'),dc);const xe=$('#kdX');if(xe){const c2=sp.cols.find(c=>c.k===xe.dataset.col)||cBr;hb(xe,c2)}}
VIEWS.kpid=vKpiDet;AFTER.kpid=kdDraw;
ACT2.kOpen=el=>{const id=el.dataset.id;if(S.kId!==id){S.kId=id;kdReset()}location.hash='kpi/'+id};
H.kdGo=(el,e)=>{if(e.type!=='change')return;S.kId=el.value;kdReset();location.hash='kpi/'+el.value};
H.kdQ=(el,e)=>{if(e.type!=='input')return;S.kd.q=el.value;S.kd.pg=0;clearTimeout(H._kdT);H._kdT=setTimeout(()=>{const pos=el.selectionStart;refresh();const n=$('[data-h="kdQ"]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},180)};
H.kdSel=(el,e)=>{if(e.type!=='change')return;S.kd[el.dataset.k]=el.value;S.kd.pg=0;refresh();const n=$(`[data-h="kdSel"][data-k="${el.dataset.k}"]`);n&&n.focus()};
ACT2.kdPickDim=el=>{S.kd.dim=S.kd.dim===el.dataset.v?'':el.dataset.v;S.kd.pg=0;refresh();const b=$(`[data-act="kdPickDim"][data-v="${CSS.escape(el.dataset.v)}"]`);b&&b.focus()};
ACT2.kdClear=()=>{const s=S.kd.sort,d=S.kd.dir;kdReset();S.kd.sort=s;S.kd.dir=d;refresh();const n=$('[data-h="kdQ"]');n&&n.focus()};
ACT2.kdSort=el=>{const c=el.dataset.c;if(S.kd.sort===c)S.kd.dir*=-1;else{S.kd.sort=c;S.kd.dir=-1}S.kd.pg=0;refresh();const b=$(`[data-act="kdSort"][data-c="${c}"]`);b&&b.focus()};
ACT2.kdPg=el=>{S.kd.pg=Math.max(0,S.kd.pg+(+el.dataset.d));refresh();const t=$('.kd-t');t&&t.scrollIntoView({block:'nearest'})};
ACT2.kdCsv=()=>{const k=KBY[S.kId],sp=KDS[k.id],rows=kdFiltered(k,kdRows(k));const q=s=>{s=String(s??'');return /[",;\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};
  const cur=S.cur==='orig'?'PEN':S.cur;const head=sp.cols.map(c=>c.t==='money'?`${c.l} (${cur})`:c.l);const csv='﻿'+[head,...rows.map(r=>sp.cols.map(c=>kdTxt(c,r[c.k])))].map(l=>l.map(q).join(',')).join('\r\n');
  const name=`indicador-${k.id}_${S.kPer}_${S.brand}_${iso(TODAY)}.csv`;toast('Exportación en cola',`${name} · ${NF0.format(rows.length)} filas · ${Math.round(csv.length/1024)} KB (simulado: el sistema la envía por enlace firmado)`,'info')};

window.addEventListener('hashchange',onRoute);

/* ================= Inicio ================= */
const th=lsGet('ap.theme');if(th==='dark'||th==='light')document.documentElement.setAttribute('data-theme',th);
if(lsGet('ap.collapsed')==='1')$('#app').classList.add('collapsed');
window.matchMedia('(prefers-color-scheme: dark)').addEventListener&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',renderTop);
{const pc=lsGet('ap.panelColor');if(pc&&hexOk(pc)){applyPanelColor(pc);APP.ap['Panel interno'].primary=pc}}
renderTop();onRoute();
})();
</script>
