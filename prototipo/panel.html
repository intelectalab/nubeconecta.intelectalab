<title>Panel AlojamientoPlus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f8; --surface:#ffffff; --surface-2:#f6f8fc; --surface-3:#e9eef7; --hover:#eef3fd;
  --border:#d9e0ec; --border-strong:#b8c3d6; --text:#0f1b2e; --text-2:#33425c; --muted:#5d6b84; --faint:#8a96ab;
  --brand:#0a3fc4; --brand-hover:#0834a3; --brand-ink:#ffffff; --brand-soft:#e3ebfd; --brand-text:#0a3fc4; --brand-line:#9db6f2;
  --topbar:#0a3fc4; --topbar-2:#0835aa; --topbar-ink:#ffffff; --topbar-muted:#c9d8ff; --topbar-field:#0632a0;
  --ok:#4c8a26; --ok-strong:#5f9a32; --ok-bg:#e8f3df; --ok-text:#3b6e1c;
  --warn:#f2b71a; --warn-bg:#fdf3d6; --warn-text:#7a5500;
  --high:#d9700b; --high-bg:#fdebd9; --high-text:#9a4b00;
  --danger:#c62a2a; --danger-bg:#fbe5e5; --danger-text:#a11d1d;
  --info:#0a3fc4; --info-bg:#e3ebfd; --info-text:#0a3fc4;
  --neutral-bg:#eceff5; --neutral-text:#4b5870;
  --chart-bar:#a9c0f5; --chart-line:#0a3fc4; --c1:#0a3fc4; --c2:#4c8a26; --c3:#c99300; --c4:#d9700b; --c5:#0f8b8d; --heat:#0a3fc4; --chart-grid:#e3e8f1; --chart-axis:#5d6b84;
  --scrim:rgba(10,20,40,.45); --shadow:0 1px 2px rgba(15,27,46,.06),0 1px 1px rgba(15,27,46,.04);
  --shadow-pop:0 12px 32px rgba(15,27,46,.18),0 2px 6px rgba(15,27,46,.08);
  --focus:#f2b71a; --skel:#e4e9f2; --skel-2:#f1f4f9;
  --f-head:"Poppins","Nunito","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --sidew:248px; --toph:56px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a101c; --surface:#111a2a; --surface-2:#152035; --surface-3:#1b2840; --hover:#1a2741;
    --border:#243350; --border-strong:#36486b; --text:#e7edf8; --text-2:#c3cee2; --muted:#93a2bd; --faint:#6d7c97;
    --brand:#4d82ff; --brand-hover:#6a96ff; --brand-ink:#ffffff; --brand-soft:#16264a; --brand-text:#8fb0ff; --brand-line:#3a5ca8;
    --topbar:#08298a; --topbar-2:#0a2f9c; --topbar-ink:#ffffff; --topbar-muted:#b4c7f7; --topbar-field:#061f6b;
    --ok:#7cc04b; --ok-strong:#6fae3e; --ok-bg:#1a2d17; --ok-text:#9bd471;
    --warn:#f2b71a; --warn-bg:#33290d; --warn-text:#f5c94e;
    --high:#ff9a3d; --high-bg:#3a2311; --high-text:#ffb26b;
    --danger:#ff6464; --danger-bg:#3b1618; --danger-text:#ff8f8f;
    --info:#6f9bff; --info-bg:#16264a; --info-text:#9dbaff;
    --neutral-bg:#1d2a42; --neutral-text:#b3bfd4;
    --chart-bar:#2f4f9a; --chart-line:#8fb0ff; --c1:#6f9bff; --c2:#7cc04b; --c3:#f2b71a; --c4:#ff9a3d; --c5:#3cc7c9; --heat:#6f9bff; --chart-grid:#22314c; --chart-axis:#93a2bd;
    --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
    --shadow-pop:0 16px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
    --skel:#1b2840; --skel-2:#223250;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a101c; --surface:#111a2a; --surface-2:#152035; --surface-3:#1b2840; --hover:#1a2741;
  --border:#243350; --border-strong:#36486b; --text:#e7edf8; --text-2:#c3cee2; --muted:#93a2bd; --faint:#6d7c97;
  --brand:#4d82ff; --brand-hover:#6a96ff; --brand-ink:#ffffff; --brand-soft:#16264a; --brand-text:#8fb0ff; --brand-line:#3a5ca8;
  --topbar:#08298a; --topbar-2:#0a2f9c; --topbar-ink:#ffffff; --topbar-muted:#b4c7f7; --topbar-field:#061f6b;
  --ok:#7cc04b; --ok-strong:#6fae3e; --ok-bg:#1a2d17; --ok-text:#9bd471;
  --warn:#f2b71a; --warn-bg:#33290d; --warn-text:#f5c94e;
  --high:#ff9a3d; --high-bg:#3a2311; --high-text:#ffb26b;
  --danger:#ff6464; --danger-bg:#3b1618; --danger-text:#ff8f8f;
  --info:#6f9bff; --info-bg:#16264a; --info-text:#9dbaff;
  --neutral-bg:#1d2a42; --neutral-text:#b3bfd4;
  --chart-bar:#2f4f9a; --chart-line:#8fb0ff; --c1:#6f9bff; --c2:#7cc04b; --c3:#f2b71a; --c4:#ff9a3d; --c5:#3cc7c9; --heat:#6f9bff; --chart-grid:#22314c; --chart-axis:#93a2bd;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-pop:0 16px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  --skel:#1b2840; --skel-2:#223250;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-text)}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;letter-spacing:-.01em}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:15px;height:15px}.i.lg{width:22px;height:22px}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--surface);color:var(--text);padding:8px 12px;border-radius:6px}
.skip:focus{top:8px}
h1[tabindex="-1"]:focus{outline:none}

/* ===== Shell ===== */
.app{display:grid;height:100%;grid-template-columns:var(--sidew) minmax(0,1fr);grid-template-rows:calc(var(--toph) + env(safe-area-inset-top)) minmax(0,1fr);grid-template-areas:"top top" "side main";transition:grid-template-columns .2s ease}
.app.collapsed{--sidew:68px}
.topbar{grid-area:top;background:var(--topbar);color:var(--topbar-ink);display:flex;align-items:center;gap:8px;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));min-width:0;position:relative;z-index:30}
.tb-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:8px;border:0;background:transparent;color:var(--topbar-ink);cursor:pointer;position:relative;flex:none}
.tb-btn:hover{background:var(--topbar-2)}
.tb-btn .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--warn);color:#2b1d00;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--topbar)}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--topbar-ink);flex:none;margin-right:6px}
.logo svg{width:38px;height:30px}
.logo b{font-family:"Poppins","Nunito",sans-serif;font-weight:800;font-size:18px;letter-spacing:-.02em}
.logo b span{color:var(--topbar-muted);font-weight:700}
.demo-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px dashed var(--warn);color:var(--warn);white-space:nowrap;flex:none;background:transparent}
.tb-search{flex:1 1 380px;max-width:440px;min-width:0;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:var(--topbar-field);color:var(--topbar-muted);cursor:pointer;text-align:left;margin-left:8px}
.tb-search:hover{border-color:var(--topbar-muted)}
.tb-search span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
kbd{font-family:var(--f-mono);font-size:11px;padding:1px 5px;border-radius:4px;border:1px solid currentColor;opacity:.8}
.tb-spacer{flex:1}
.tb-select{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--topbar-muted)}
.tb-select select{height:34px;border-radius:7px;border:1px solid transparent;background:var(--topbar-field);color:var(--topbar-ink);padding:0 8px;max-width:170px}
.tb-select select option{background:var(--surface);color:var(--text)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--warn);color:#2b1d00;font-weight:700;font-size:12px;display:grid;place-items:center;font-family:var(--f-head)}
.tb-user{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--topbar-ink);cursor:pointer;padding:3px 6px 3px 3px;border-radius:999px;flex:none}
.tb-user:hover{background:var(--topbar-2)}
.tb-user .who{display:flex;flex-direction:column;line-height:1.15;text-align:left;font-size:12px}
.tb-user .who small{color:var(--topbar-muted);font-size:11px}

.sidebar{grid-area:side;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;padding:10px 10px calc(16px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:2px}
.nav-group{margin-top:10px}
.nav-group:first-of-type{margin-top:2px}
.nav-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;padding:6px 10px}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--text-2);text-decoration:none;font-weight:500;position:relative;white-space:nowrap}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:var(--brand-soft);color:var(--brand-text);font-weight:700}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav-item .cnt{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--neutral-bg);color:var(--neutral-text)}
.nav-item .cnt.hot{background:var(--danger-bg);color:var(--danger-text)}
.nav-foot{margin-top:auto;padding-top:14px}
.collapse-btn{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border:0;background:transparent;color:var(--muted);border-radius:8px;cursor:pointer;white-space:nowrap}
.collapse-btn:hover{background:var(--hover);color:var(--text)}
.app.collapsed .nav-title{font-size:0;padding:0;height:1px;background:var(--border);margin:8px 6px}
.app.collapsed .nav-item span,.app.collapsed .nav-item .cnt,.app.collapsed .collapse-btn span{display:none}
.app.collapsed .nav-item{justify-content:center;padding:9px 0}
.app.collapsed .collapse-btn{justify-content:center;padding:9px 0}
.app.collapsed .collapse-btn .i{transform:scaleX(-1)}
.drawer-ctx{display:none}
.scrim{display:none}

.main{grid-area:main;overflow:auto;min-width:0;padding:20px max(24px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) 24px;scroll-behavior:smooth}
.page{max-width:1480px;margin:0 auto;min-width:0}

@media (max-width:1100px){
  .tb-user .who{display:none}
  .tb-select label{display:none}
}
@media (max-width:900px){
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main"}
  .sidebar{position:fixed;z-index:60;top:0;bottom:0;left:0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow-pop);padding-top:calc(12px + env(safe-area-inset-top))}
  .app.drawer .sidebar{transform:none}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:55}
  .app.collapsed .nav-title{font-size:11px;padding:6px 10px;height:auto;background:none;margin:0}
  .app.collapsed .nav-item span,.app.collapsed .nav-item .cnt{display:inline}
  .app.collapsed .nav-item{justify-content:flex-start;padding:8px 10px}
  .collapse-btn{display:none!important}
  .drawer-ctx{display:grid;gap:8px;padding:4px 4px 10px;border-bottom:1px solid var(--border);margin-bottom:6px}
  .drawer-ctx label{font-size:12px;color:var(--muted);display:grid;gap:4px}
  .tb-select{display:none}
  .tb-search{flex:0 0 38px;width:38px;padding:0;justify-content:center;background:transparent;margin-left:auto}
  .tb-search span,.tb-search kbd{display:none}
  .main{padding:14px max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
}
@media (max-width:520px){
  .logo b{display:none}
  .topbar{gap:2px}
  .tb-btn{width:36px}
}

/* ===== Page head ===== */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--brand-text);text-decoration:underline}
.crumbs .i{width:13px;height:13px;opacity:.6}
.crumbs [aria-current]{color:var(--text-2);font-weight:600}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.phead h1{font-size:24px;font-weight:700;line-height:1.2}
.phead p{margin:4px 0 0;color:var(--muted)}
.phead .acts{display:flex;gap:8px;flex-wrap:wrap}
h2.sec{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}

/* ===== Basic components ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;font-size:13.5px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.success{background:var(--ok-strong);border-color:var(--ok-strong);color:#fff}
.btn.success:hover{filter:brightness(.94)}
.btn.danger{color:var(--danger-text);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand-text)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:6px}
.btn.icon{width:34px;padding:0}
.btn.sm.icon{width:30px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn .spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:500}
.card-b{padding:4px 16px 16px}
.card-f{border-top:1px solid var(--border);padding:10px 16px;display:flex;justify-content:flex-end}
.grid{display:grid;gap:16px;min-width:0}
.g-kpi{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1280px){.g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1100px){.g-2{grid-template-columns:minmax(0,1fr)}.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g-kpi,.g-2e,.g-3{grid-template-columns:minmax(0,1fr)}.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.g-kpi,.g-4{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:16px;min-width:0;align-content:start}

.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px;position:relative}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--f-head);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.01em}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:600;font-family:var(--f-body)}
.kpi .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kpi .twin{display:flex;flex-direction:column;gap:2px}
.kpi a.cover{position:absolute;inset:0;border-radius:10px}
.kpi:has(a.cover):hover{border-color:var(--brand-line)}
.delta-up{color:var(--ok-text);font-weight:700}
.delta-dn{color:var(--danger-text);font-weight:700}

.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral-text);line-height:1}
.chip .i{width:12px;height:12px;stroke-width:2.4}
.chip.ok{background:var(--ok-bg);color:var(--ok-text)}
.chip.warn{background:var(--warn-bg);color:var(--warn-text)}
.chip.high{background:var(--high-bg);color:var(--high-text)}
.chip.danger{background:var(--danger-bg);color:var(--danger-text)}
.chip.info{background:var(--info-bg);color:var(--info-text)}
.chip.outline{background:transparent;border:1px solid var(--border-strong);color:var(--text-2)}
.brand-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
.brand-tag i{width:8px;height:8px;border-radius:2px;display:inline-block}

.field{display:grid;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.input,.select,textarea.input{height:36px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:0 10px;min-width:0;width:100%;font-weight:500;font-size:13.5px}
textarea.input{height:auto;padding:8px 10px;resize:vertical}
.input:focus-visible,.select:focus-visible{outline:2px solid var(--brand);outline-offset:0}
.input-ic{position:relative;min-width:0}
.input-ic .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px}
.input-ic .input{padding-left:34px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.toolbar .input-ic{flex:1 1 220px;max-width:340px}
.toolbar .select{width:auto;flex:0 1 auto;max-width:200px}
.toolbar .count{margin-left:auto;font-size:12.5px;color:var(--muted)}
.check{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--brand)}

.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2);border:0;background:transparent;padding:4px}
.switch .trk{width:36px;height:20px;border-radius:999px;background:var(--border-strong);position:relative;transition:background .15s}
.switch .trk::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked="true"] .trk{background:var(--brand)}
.switch[aria-checked="true"] .trk::after{transform:translateX(16px)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin;min-width:0}
.tab{border:0;background:transparent;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:7px;align-items:center;font-size:13.5px}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--brand-text);border-bottom-color:var(--brand)}
.tab .cnt{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--neutral-bg);color:var(--neutral-text)}
.tab[aria-selected="true"] .cnt{background:var(--brand-soft);color:var(--brand-text)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;padding:2px;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* tables */
.tw{overflow-x:auto;min-width:0;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
.t td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.t tbody tr:hover td{background:var(--hover)}
.t tbody tr:last-child td{border-bottom:0}
.t .r{text-align:right}
.t td.num,.t td.r{font-variant-numeric:tabular-nums;white-space:nowrap}
.t .nw{white-space:nowrap}
.t .strong{font-weight:700;color:var(--text)}
.t .sub{font-size:12px;color:var(--muted)}
.t a.rowlink{color:var(--text);font-weight:700;text-decoration:none}
.t a.rowlink:hover{color:var(--brand-text);text-decoration:underline}
.t tr.done td{opacity:.6}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pager .btns{display:flex;gap:6px}

/* empty / skeleton */
.empty{display:grid;place-items:center;text-align:center;padding:40px 16px;color:var(--muted);gap:8px}
.empty .ring{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--surface-3);color:var(--muted)}
.empty b{color:var(--text);font-size:15px;font-family:var(--f-head)}
.skel{background:linear-gradient(90deg,var(--skel) 0%,var(--skel-2) 50%,var(--skel) 100%);background-size:200% 100%;animation:sh 1.1s linear infinite;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}

/* severity */
.sev{display:inline-grid;place-items:center;width:22px;height:22px;flex:none}
.sev svg{width:20px;height:20px}
.sev.critica{color:var(--danger)}
.sev.alta{color:var(--high)}
.sev.media{color:var(--info)}
.sev.baja{color:var(--faint)}
.att{list-style:none;margin:0;padding:0}
.att li{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-top:1px solid var(--border);position:relative}
.att li::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0}
.att li.critica::before{background:var(--danger)}
.att li.alta::before{background:var(--high)}
.att li.media::before{background:var(--info)}
.att li.baja::before{background:var(--border-strong)}
.att .tx{flex:1;min-width:0}
.att .tx b{display:block;font-weight:700;font-size:13.5px}
.att .tx small{color:var(--muted);font-size:12.5px}
.att .lvl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.att li.critica .lvl{color:var(--danger-text)}.att li.alta .lvl{color:var(--high-text)}.att li.media .lvl{color:var(--info-text)}.att li.baja .lvl{color:var(--muted)}

/* bars */
.cap{display:grid;gap:4px}
.cap-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.cap-top b{font-weight:700}
.bar{height:9px;border-radius:5px;background:var(--surface-3);position:relative;overflow:visible}
.bar > i{display:block;height:100%;border-radius:5px;background:var(--brand)}
.bar > i.l1{background:var(--ok)}
.bar > i.l2{background:var(--warn)}
.bar > i.l3{background:var(--high)}
.bar > i.l4{background:var(--danger)}
.bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--surface);border-left:1px solid var(--border-strong)}
.bar.thin{height:6px}
.sla{display:grid;gap:4px;min-width:120px}
.sla small{font-size:12px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* list rows */
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--border);min-width:0}
.rows li .grow{flex:1;min-width:0}
.rows li .grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows li .grow small{color:var(--muted);font-size:12px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* timeline */
.tl{list-style:none;margin:0;padding:0 0 0 4px;position:relative}
.tl li{position:relative;padding:0 0 14px 26px}
.tl li::before{content:"";position:absolute;left:7px;top:18px;bottom:-2px;width:2px;background:var(--border)}
.tl li:last-child::before{display:none}
.tl .nd{position:absolute;left:0;top:2px;width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface);display:grid;place-items:center}
.tl .nd.done{background:var(--ok);border-color:var(--ok);color:#fff}
.tl .nd.done svg{width:10px;height:10px;stroke-width:3.2}
.tl .nd.now{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.tl .nd.bad{border-color:var(--danger);background:var(--danger-bg)}
.tl .w{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tl .w b{font-size:13px}
.tl .w span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl small{color:var(--muted);font-size:12px;display:block}

/* kanban */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;min-width:0}
.kcol{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;min-height:200px;min-width:0}
.kcol-h{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.kcol-h b{font-family:var(--f-head);font-size:13.5px}
.kcol-h small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kcol-b{padding:8px;display:grid;gap:8px;align-content:start}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;display:grid;gap:6px;text-align:left;cursor:pointer;width:100%;color:var(--text)}
.kcard:hover{border-color:var(--brand-line)}
.kcard .t1{font-weight:700;font-size:13px}
.kcard .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}

/* map */
.mapwrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:18px 18px}
.maphint{display:none}@media (max-width:900px){.maphint{display:block}}
.mapwrap svg{display:block;min-width:820px;width:100%;height:auto}
.mnode rect.box{fill:var(--surface);stroke:var(--border-strong);stroke-width:1.2}
.mnode:hover rect.box,.mnode.sel rect.box{stroke:var(--brand);stroke-width:2}
.mnode{cursor:pointer}
.mnode:focus-visible rect.box{stroke:var(--focus);stroke-width:2.5}
.mnode text{fill:var(--text);font-family:var(--f-body)}
.mnode text.s{fill:var(--muted);font-size:11px}
.mnode text.t{font-weight:700;font-size:12.5px}
.mnode .ic{stroke:var(--brand-text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.medge{fill:none;stroke:var(--brand-line);stroke-width:1.6}
.medge-l{fill:var(--muted);font-size:10.5px;font-family:var(--f-mono)}
.medge-bg{fill:var(--surface-2)}
.mdot.ok{fill:var(--ok)}.mdot.warn{fill:var(--warn)}.mdot.danger{fill:var(--danger)}
.comp{padding:12px 14px;display:grid;gap:6px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
.comp.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.comp-h{display:flex;align-items:center;gap:8px}
.comp-h .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-text);flex:none}
.comp-h b{font-size:13.5px;flex:1;min-width:0}
.comp dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:12.5px}
.comp dt{color:var(--muted)}
.comp dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}

/* client header */
.c360{padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.c360 h1{font-size:22px}
.c360 .meta{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;font-size:12.5px;color:var(--muted);align-items:center}
.c360 .meta span{display:inline-flex;align-items:center;gap:5px}
.c360 .money{display:flex;gap:18px;flex-wrap:wrap}
.c360 .money div{display:grid;gap:2px}
.c360 .money small{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.c360 .money b{font-family:var(--f-head);font-size:19px;font-variant-numeric:tabular-nums}
@media (max-width:760px){.c360{grid-template-columns:minmax(0,1fr)}}

/* popovers, modal, toast, palette */
.pop{position:absolute;top:calc(100% + 6px);right:0;width:min(380px,calc(100vw - 24px));background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-pop);z-index:70;display:none;overflow:hidden}
.pop.open{display:block}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.pop-h b{font-family:var(--f-head);font-size:14px}
.pop-list{max-height:min(60vh,420px);overflow:auto;list-style:none;margin:0;padding:0}
.pop-list li{border-bottom:1px solid var(--border)}
.pop-list button{display:flex;gap:10px;width:100%;text-align:left;padding:11px 14px;border:0;background:transparent;cursor:pointer;color:var(--text)}
.pop-list button:hover{background:var(--hover)}
.pop-list .unread{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:6px;flex:none}
.pop-list .read{width:8px;flex:none}
.pop-list small{display:block;color:var(--muted);font-size:12px}
.anchor{position:relative;flex:none}
.umenu{padding:6px}
.umenu .who{padding:10px 10px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.umenu .who b{display:block}
.umenu .who small{color:var(--muted)}
.umenu .ttl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700;padding:6px 10px}
.umenu button.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:transparent;border-radius:6px;cursor:pointer;color:var(--text);text-align:left}
.umenu button.mi:hover{background:var(--hover)}
.umenu button.mi[aria-checked="true"]{color:var(--brand-text);font-weight:700}
.umenu .rdot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border-strong);flex:none}
.umenu button.mi[aria-checked="true"] .rdot{border:4px solid var(--brand)}

.modal-root{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
.modal-root.open{display:flex}
.modal-scrim{position:absolute;inset:0;background:var(--scrim)}
.modal{position:relative;width:min(560px,100%);max-height:calc(100% - 16px);display:flex;flex-direction:column;background:var(--surface);border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow-pop)}
.modal.wide{width:min(820px,100%)}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.modal-h h2{font-size:17px}
.modal-h p{margin:3px 0 0;color:var(--muted);font-size:13px}
.modal-b{padding:16px 18px;overflow:auto;display:grid;gap:14px}
.modal-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
@media (max-width:520px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.err{color:var(--danger-text);font-size:12px;font-weight:600}

.toasts{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:120;display:grid;gap:8px;width:min(380px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-left:4px solid var(--ok-strong);box-shadow:var(--shadow-pop);animation:tin .2s ease}
.toast.info{border-left-color:var(--brand)}
.toast.warn{border-left-color:var(--warn)}
.toast.err{border-left-color:var(--danger)}
.toast .i{margin-top:1px}
.toast.ok .i{color:var(--ok)}
.toast div{flex:1;min-width:0}
.toast b{display:block;font-size:13.5px}
.toast small{color:var(--muted);font-size:12.5px}
.toast button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px;border-radius:4px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

.pal{width:min(640px,100%);align-self:flex-start;margin-top:8vh}
.pal-in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.pal-in input{flex:1;border:0;background:transparent;font-size:16px;min-width:0;color:var(--text)}
.pal-in input:focus{outline:none}
.pal-res{max-height:min(60vh,460px);overflow:auto;padding:6px}
.pal-g{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700;padding:8px 10px 4px}
.pal-it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer}
.pal-it .grow{flex:1;min-width:0}
.pal-it .grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-it .grow small{color:var(--muted);font-size:12px}
.pal-it[aria-selected="true"]{background:var(--brand-soft);color:var(--brand-text)}
.pal-it[aria-selected="true"] small{color:var(--brand-text)}
.pal-it .ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);flex:none}
.pal-foot{display:flex;gap:14px;flex-wrap:wrap;padding:9px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}

/* misc */
.split{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
.split.side-wide{grid-template-columns:minmax(0,1fr) 360px}
@media (max-width:1360px){.split,.split.side-wide{grid-template-columns:minmax(0,1fr)}}
.statline{display:flex;gap:18px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}
.statline div{display:grid}
.statline small{font-size:11.5px;color:var(--muted);font-weight:600}
.statline b{font-family:var(--f-head);font-size:17px;font-variant-numeric:tabular-nums}
.stackbar{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--surface-3);gap:2px}
.stackbar i{display:block;height:100%}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 72px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.hbar .bar{height:14px}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.seq-row{display:grid;grid-template-columns:78px minmax(140px,1.2fr) minmax(150px,1.3fr) minmax(130px,1fr) 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.seq-row .n{width:100%}
@media (max-width:760px){.seq-row{grid-template-columns:70px minmax(0,1fr) 34px}.seq-row .act,.seq-row .chn{grid-column:1/3}}
.chart-box{width:100%;min-width:0}
.chart-box svg{display:block}
.chart-box text{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.ax{fill:var(--chart-axis);font-size:11px}
.gridl{stroke:var(--chart-grid);stroke-width:1}
.tip{position:fixed;pointer-events:none;z-index:130;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow-pop);display:none;font-variant-numeric:tabular-nums}
.tip b{font-family:var(--f-head)}
.provcard{padding:14px 16px;display:grid;gap:8px}
.provcard .h{display:flex;align-items:center;gap:10px}
.provcard .h .ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2);font-family:var(--f-head);font-weight:700;font-size:12px}
.provcard .h b{flex:1}
.provcard ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:12.5px}
.provcard li{display:flex;justify-content:space-between;gap:8px}
.provcard li span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.note{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border)}
.note.warn{background:var(--warn-bg);color:var(--warn-text);border-color:transparent}
.daychip{min-width:64px;justify-content:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.lines td,.lines th{padding:8px 10px}
.tot{display:grid;justify-content:end;gap:4px;font-size:13px}
.tot div{display:flex;justify-content:space-between;gap:30px}
.tot .g{font-weight:800;font-family:var(--f-head);font-size:15px;border-top:1px solid var(--border);padding-top:6px}
.voucher{border:1px dashed var(--border-strong);border-radius:8px;padding:12px;display:grid;gap:4px;background:var(--surface-2);font-size:12.5px}
.page-enter{animation:fadein .18s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* ===== Ampliación: panel lateral, mini web, editor ===== */
.sheet-root{position:fixed;inset:0;z-index:85;display:none}
.sheet-root.open{display:block}
.sheet{position:absolute;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:sin .2s ease}
@keyframes sin{from{transform:translateX(30px);opacity:0}}
.sheet-b{flex:1;overflow:auto;padding:16px 18px}
.sheet .modal-h{padding-top:calc(16px + env(safe-area-inset-top))}
h3.fs{font-size:13px;font-weight:700;font-family:var(--f-head);margin:6px 0 2px;color:var(--text)}
.hint{font-weight:500;color:var(--faint);font-size:11.5px}
.grid>*,.stack>*,.form-grid>*,.card-b>*,.modal-b>*,.sheet-b>*{min-width:0}
.fset{min-width:0;border:1px solid var(--border);border-radius:8px;padding:8px 12px 10px;display:grid;gap:6px;margin:0}
.fset legend{font-size:12.5px;font-weight:700;color:var(--muted);padding:0 4px}
.mg-live{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:36px}
.rows li.sel{background:var(--brand-soft)}
.rowbtn{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;cursor:pointer;color:var(--text);padding:0;min-width:0}
.rowbtn .grow{min-width:0}
.rowbtn .grow b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowbtn small{color:var(--muted);font-size:12px}
.web-split{display:grid;grid-template-columns:280px minmax(0,1fr);min-width:0}
.web-list{border-right:1px solid var(--border);min-width:0}
.web-ed{min-width:0}
.web-ed-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;padding:16px;min-width:0}
@media (max-width:1250px){.web-ed-in{grid-template-columns:minmax(0,1fr)}}

function onRoute(){
  let r=(location.hash||'#inicio').slice(1);

function toast(t,s,kind){
  kind=kind||'ok';
  const el=document.createElement('div');el.className='toast '+kind;
  el.innerHTML=`${ic(kind==='ok'?'check':kind==='err'?'oct':kind==='warn'?'tri':'info')}<div><b>${esc(t)}</b>${s?`<small>${esc(s)}</small>`:''}</div><button aria-label="Cerrar aviso">${ic('x','sm')}</button>`;
  el.querySelector('button').onclick=()=>el.remove();
  const box=$('#toasts');box.appendChild(el);while(box.children.length>3)box.firstElementChild.remove();
  setTimeout(()=>el.remove(),4200);
}
let modalReturn=null, modalOnKey=null;
function openModal(html,opt){
  opt=opt||{};
  const m=$('#modal');m.className='modal'+(opt.wide?' wide':'')+(opt.cls?' '+opt.cls:'');m.innerHTML=html;
  if(opt.label){m.removeAttribute('aria-labelledby');m.setAttribute('aria-label',opt.label)}else{m.removeAttribute('aria-label');m.setAttribute('aria-labelledby','modalTitle')}
  modalReturn=document.activeElement;
  $('#modalRoot').classList.add('open');$('#modalRoot').setAttribute('aria-hidden','false');
  modalOnKey=opt.onKey||null;
  const f=m.querySelector(opt.focus||'[autofocus],input,select,textarea,button:not([data-act="closeModal"])')||m.querySelector('button');
  setTimeout(()=>f&&f.focus(),10);
}
function closeModal(){
  $('#modalRoot').classList.remove('open');$('#modalRoot').setAttribute('aria-hidden','true');$('#modal').innerHTML='';modalOnKey=null;
  if(modalReturn&&document.contains(modalReturn))modalReturn.focus();
}
const mHead=(t,sub)=>`<div class="modal-h"><div><h2 id="modalTitle">${t}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="btn icon sm ghost" data-act="closeModal" aria-label="Cerrar">${ic('x')}</button></div>`;

function formDlg(o){
  const fields=o.fields.map(f=>{
    const id='f_'+f.id;let inp;
    if(f.type==='select')inp=`<select class="select" id="${id}" name="${f.id}">${f.options.map(op=>{const [v,l]=Array.isArray(op)?op:[op,op];return `<option value="${esc(v)}"${String(f.value)===String(v)?' selected':''}>${esc(l)}</option>`}).join('')}</select>`;
    else if(f.type==='textarea')inp=`<textarea class="input" id="${id}" name="${f.id}" rows="3">${esc(f.value||'')}</textarea>`;
    else inp=`<input class="input" id="${id}" name="${f.id}" type="${f.type||'text'}" value="${esc(f.value??'')}" ${f.min!=null?`min="${f.min}"`:''} ${f.step?`step="${f.step}"`:''} ${f.ph?`placeholder="${esc(f.ph)}"`:''} ${f.req?'required':''}>`;
    return `<label class="field${f.full?' full':''}" for="${id}">${esc(f.label)}${f.req?' *':''}${inp}</label>`;
  }).join('');
  openModal(`${mHead(o.title,o.sub)}<form id="dlgForm" novalidate><div class="modal-b">${o.pre||''}<div class="form-grid">${fields}</div><div class="err" id="dlgErr" role="alert"></div></div><div class="modal-f"><button type="button" class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" type="submit">${o.submit||'Guardar'}</button></div></form>`,{wide:o.wide});
  $('#dlgForm').onsubmit=e=>{
    e.preventDefault();
    const vals={};o.fields.forEach(f=>vals[f.id]=$('#f_'+f.id).value.trim());
    const miss=o.fields.find(f=>f.req&&!vals[f.id]);
    if(miss){$('#dlgErr').textContent=`Complete el campo «${miss.label}».`;$('#f_'+miss.id).focus();return}
    const err=o.validate&&o.validate(vals);
    if(err){$('#dlgErr').textContent=err;return}
    closeModal();o.onSubmit(vals);
  };
}

/* ================= Paleta de comandos ================= */
let palItems=[],palIdx=0;
function openPalette(){
  openModal(`<div class="pal-in">${ic('search')}<input id="palQ" type="text" role="combobox" aria-expanded="true" aria-controls="palRes" aria-autocomplete="list" placeholder="Buscar clientes, dominios, facturas, tickets o pantallas…" autocomplete="off"><kbd>Esc</kbd></div><div class="pal-res" id="palRes" role="listbox" aria-label="Resultados"></div><div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> moverse</span><span><kbd>Enter</kbd> abrir</span><span><kbd>Esc</kbd> cerrar</span></div>`,{cls:'pal',label:'Búsqueda global',focus:'#palQ'});
  const q=$('#palQ');q.oninput=()=>{palIdx=0;palRender(q.value)};
  q.onkeydown=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();palIdx=Math.min(palItems.length-1,palIdx+1);palMark()}
    else if(e.key==='ArrowUp'){e.preventDefault();palIdx=Math.max(0,palIdx-1);palMark()}
    else if(e.key==='Enter'){e.preventDefault();palItems[palIdx]&&palRun(palItems[palIdx])}
  };
  palRender('');
}
function palRender(q){
  const n=norm(q).trim();const groups=[];
  const scr=Object.entries(ROUTES).filter(([k,r])=>!r.hidden&&allowed(k)&&(!n||norm(r.t).includes(n)||norm(r.g).includes(n))).map(([k,r])=>({g:'Pantallas',ic:r.ic,t:r.t,s:r.g,run:()=>go(k)}));
  groups.push(scr.slice(0,n?6:10));
  if(n){
    groups.push(fClients().filter(c=>norm(c.name).includes(n)||norm(c.doc).includes(n)||norm(c.id).includes(n)).slice(0,6).map(c=>({g:'Clientes',ic:'building',t:c.name,s:`${c.id} · ${c.doc} · ${BR[c.brand].n}`,run:()=>openClient(c.id)})));
    groups.push(fDom().filter(d=>d.d.includes(n)).slice(0,5).map(d=>({g:'Dominios',ic:'globe',t:d.d,s:`${CBY[d.cid].name} · vence ${fD(d.real)}`,run:()=>{S.domQ=d.d;S.dom30=false;go('dominios')}})));
    groups.push(fInv().filter(v=>norm(v.num).includes(n)).slice(0,5).map(v=>({g:'Facturas',ic:'file',t:`${v.type} ${v.num}`,s:`${CBY[v.cid].name} · ${money(v.total,v.cur)}`,run:()=>{go('facturas');setTimeout(()=>invDetail(v.id),300)}})));
    groups.push(fTk().filter(t=>norm(t.id).includes(n)||norm(t.sub).includes(n)).slice(0,5).map(t=>({g:'Tickets',ic:'msg',t:`${t.id} · ${t.sub}`,s:`${CBY[t.cid].name} · ${t.status}`,run:()=>{go('tickets');setTimeout(()=>tkDetail(t.id),300)}})));
    groups.push(HPLANS.filter(p=>(S.brand==='all'||p.brand===S.brand)&&norm(p.name+' '+BR[p.brand].n+' '+p.whm).includes(n)).slice(0,4).map(p=>({g:'Catálogo',ic:'tag',t:`${p.name} · ${BR[p.brand].n}`,s:`Hosting · ${moneyRaw(p.p.PEN.m,'PEN')}/mes · ${p.whm}`,run:()=>{S.catTab='hosting';go('catalogo')}})));
    groups.push(TLDS.filter(t=>t.tld.includes(n)).slice(0,3).map(t=>({g:'Catálogo',ic:'globe',t:`Extensión ${t.tld}`,s:`${t.reg} · ${moneyRaw(t.pPEN,'PEN')}`,run:()=>{S.catTab='dominios';go('catalogo')}})));
    groups.push(Object.keys(SCDEF).filter(k=>k.includes(n.replace(/\s/g,'_'))).slice(0,4).map(k=>({g:'Shortcodes',ic:'code',t:'['+k+']',s:SCDEF[k].d,run:()=>{S.wpTab='generador';S.scName=k;go('wp')}})));
    if(allowed('reclamos'))groups.push(fRecl().filter(r=>norm(r.id+' '+r.nombre+' '+r.det).includes(n)).slice(0,4).map(r=>({g:'Reclamos',ic:'book',t:`${r.id} · ${r.tipo}`,s:`${r.nombre} · ${r.st}`,run:()=>{go('reclamos');setTimeout(()=>ACT2.reclDetail({dataset:{id:r.id}}),300)}})));
  }
  palItems=groups.flat();
  const res=$('#palRes');
  if(!palItems.length){res.innerHTML=`<div class="empty"><div class="ring">${ic('search','lg')}</div><b>Sin resultados</b><span>No encontramos «${esc(q)}». Pruebe con un RUC, dominio o número de comprobante.</span></div>`;return}
  let h='',last='',k=0;
  palItems.forEach(it=>{if(it.g!==last){h+=`<div class="pal-g" role="presentation">${it.g}</div>`;last=it.g}h+=`<div class="pal-it" role="option" id="po${k}" data-k="${k}" aria-selected="${k===palIdx}"><span class="ico">${ic(it.ic,'sm')}</span><span class="grow"><b>${esc(it.t)}</b><small>${esc(it.s)}</small></span>${ic('arrow','sm')}</div>`;k++});
  res.innerHTML=h;
  $$('.pal-it',res).forEach(el=>{el.onclick=()=>palRun(palItems[+el.dataset.k]);el.onmousemove=()=>{if(palIdx!==+el.dataset.k){palIdx=+el.dataset.k;palMark()}}});
  palMark();
}
function palMark(){$$('#palRes .pal-it').forEach(el=>el.setAttribute('aria-selected',String(+el.dataset.k===palIdx)));const a=$('#po'+palIdx);if(a){a.scrollIntoView({block:'nearest'});$('#palQ').setAttribute('aria-activedescendant','po'+palIdx)}}

const chip=(t,k,i)=>`<span class="chip ${k||''}">${i?ic(i):''}${esc(t)}</span>`;
const stChip={'Activo':'ok','Moroso':'warn','Suspendido':'danger','Inactivo':'','Cancelado':'','Pagada':'ok','Pendiente':'info','Vencida':'danger','Parcial':'warn','Aplicada':'','Anulada':''};
const sunatChip=s=>chip(s==='Aceptada'?'Aceptada SUNAT':s,s==='Aceptada'?'ok':s==='Pendiente'?'warn':s==='Rechazada'?'danger':'high',s==='Aceptada'?'check':s==='Rechazada'?'x':'clock');
const prioChip=p=>`<span class="chip ${p==='critica'?'danger':p==='alta'?'high':p==='media'?'info':''}" style="padding-left:4px">${sevIcon(p).replace('class="sev','style="width:16px;height:16px" class="sev')}${SEV[p].l}</span>`;
function dayChip(n){
  if(n<0)return `<span class="chip danger daychip">${ic('oct')}Vencido ${-n} d</span>`;
  if(n===0)return `<span class="chip danger daychip">${ic('tri')}Hoy</span>`;
  if(n<=7)return `<span class="chip high daychip">${ic('tri')}${n} d</span>`;
  if(n<=30)return `<span class="chip warn daychip">${ic('clock')}${n} d</span>`;
  return `<span class="chip daychip">${n} d</span>`;

function capBar(p,label,detail){
  const l=p>=95?'l4':p>=85?'l3':p>=70?'l2':'l1';
  return `<div class="cap"><div class="cap-top"><span>${label}</span><span class="num"><b>${p} %</b>${detail?` · <span style="color:var(--muted)">${detail}</span>`:''}</span></div><div class="bar" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}" aria-label="${esc(label)} ${p} %"><i class="${l}" style="width:${Math.min(100,p)}%"></i><span class="tick" style="left:70%"></span><span class="tick" style="left:85%"></span><span class="tick" style="left:95%"></span></div></div>`;
}
function slaBar(t){
  if(t.status==='Resuelto')return `<span class="chip ok">${ic('check')}Cumplido</span>`;
  const left=slaLeft(t),tot=SLA[t.prio].res*60,used=Math.min(100,Math.max(0,(1-left/tot)*100));
  const l=left<0?'l4':left<tot*.25?'l3':left<tot*.5?'l2':'l1';
  const txt=left<0?`Fuera de SLA hace ${fmtMin(-left)}`:`Quedan ${fmtMin(left)}`;
  return `<div class="sla"><div class="bar thin"><i class="${l}" style="width:${left<0?100:used}%"></i></div><small style="color:${left<0?'var(--danger-text)':left<tot*.25?'var(--high-text)':'var(--muted)'};font-weight:${left<tot*.25?700:500}">${txt}</small></div>`;
}
const fmtMin=m=>{m=Math.round(m);if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return h<48?`${h} h${r?' '+r+' min':''}`:`${Math.round(h/24)} días`};
function emptyState(t,s,btn){return `<div class="empty"><div class="ring">${ic('search','lg')}</div><b>${t}</b><span>${s}</span>${btn||''}</div>`}
function pager(page,total,per,act){const pages=Math.max(1,Math.ceil(total/per));return `<div class="pager"><span>Mostrando ${total?page*per+1:0}–${Math.min(total,(page+1)*per)} de ${NF0.format(total)}</span><div class="btns"><button class="btn sm" data-act="${act}" data-d="-1" ${page<=0?'disabled':''} aria-label="Página anterior">${ic('cl','sm')}Anterior</button><button class="btn sm" data-act="${act}" data-d="1" ${page>=pages-1?'disabled':''} aria-label="Página siguiente">Siguiente${ic('cr','sm')}</button></div></div>`}
function sumBy(list,f){const r={PEN:0,USD:0};list.forEach(x=>{const [v,c]=f(x);r[c]+=v});return r}
function dualMoney(r,int,twin){if(S.cur!=='orig'){const t=S.cur==='PEN'?r.PEN+r.USD*TC:r.USD+r.PEN/TC;return `<span class="num">${moneyRaw(t,S.cur,int)}</span>`}
  if(!r.USD)return `<span class="num">${moneyRaw(r.PEN,'PEN',int)}</span>`;if(!r.PEN)return `<span class="num">${moneyRaw(r.USD,'USD',int)}</span>`;
  if(twin)return `<span class="twin"><span class="num">${moneyRaw(r.PEN,'PEN',int)}</span><small class="num">${moneyRaw(r.USD,'USD',int)}</small></span>`;
  return `<span class="num">${moneyRaw(r.PEN,'PEN',int)}</span> <small>+ ${moneyRaw(r.USD,'USD',int)}</small>`}

/* ================= Vista: Inicio ================= */
const BRAND_SHARE={all:1,ap:.56,sc:.24,ha:.12,ns:.08};
const MONTHS=[];for(let k=11;k>=0;k--){const d=new Date(2026,9-k,1);MONTHS.push(d)}
const BILLED=[48200,49650,51800,50240,52900,54100,55380,56900,57420,59650,61280,38900];
const COLL=[46800,48420,49100,49870,51260,52010,54320,55180,55860,57210,58440,24110];
function vInicio(){
  const svc=fSvc(),inv=fInv();
  const mrr=sumBy(svc.filter(s=>s.st==='Activo'),s=>[mrrOf(s),s.cur]);
  const open=inv.filter(v=>v.status==='Pendiente'||v.status==='Vencida');
  const porCobrar=sumBy(open,v=>[saldo(v),v.cur]);
  const vencido=sumBy(open.filter(v=>v.status==='Vencida'),v=>[saldo(v),v.cur]);
  const due30=svc.filter(s=>s.st==='Activo'&&diffD(s.due,TODAY)>=0&&diffD(s.due,TODAY)<=30);
  const dom30=fDom().filter(d=>{const x=diffD(d.real,TODAY);return x>=0&&x<=30});
  const tk=fTk().filter(t=>t.status!=='Resuelto');const out=tk.filter(t=>slaLeft(t)<0);
  const avg=Math.round(NODES.reduce((a,n)=>a+n.p,0)/NODES.length);const hot=NODES.filter(n=>n.p>=85).length;
  const kpi=(lbl,icn,val,meta,r)=>`<div class="card kpi"><span class="lbl">${ic(icn,'sm')}${lbl}</span><div class="val">${val}</div><div class="meta">${meta}</div>${r?`<a class="cover" href="#${r}" aria-label="${lbl}: ver detalle"></a>`:''}</div>`;
  const vencPen=S.cur==='orig'?`${moneyRaw(vencido.PEN,'PEN',1)} + ${moneyRaw(vencido.USD,'USD',1)}`:dualMoney(vencido,1);
  const att=attention();
  return `${crumbs([['Operación','inicio'],['Resumen del día','inicio']])}
  ${phead('Buenos días, Renzo',`${fDL(TODAY)[0].toUpperCase()+fDL(TODAY).slice(1)} · ${S.brand==='all'?'Todas las marcas':BR[S.brand].n} · ${att.length} asuntos requieren atención`,`<button class="btn" data-act="goto" data-r="cobranza">${ic('wallet','sm')}Bandeja de cobranza</button><button class="btn primary" data-act="newClient">${ic('plus','sm')}Nuevo cliente</button>`)}
  <section class="grid g-kpi" aria-label="Indicadores clave">
   ${kpi('Ingresos recurrentes (MRR)','activity',dualMoney(mrr,1,1),`<span class="delta-up">▲ 3.2 %</span> vs. setiembre`,'clientes')}
   ${kpi('Por cobrar','wallet',dualMoney(porCobrar,1,1),`<span class="delta-dn">Vencido: ${vencPen}</span>`,'cobranza')}
   ${kpi('Vencen en 30 días','cal',`${NF0.format(due30.length+dom30.length)} <small>servicios</small>`,`${plural(dom30.length,'dominio','dominios')} · ${plural(due30.length,'suscripción','suscripciones')}`,'dominios')}
   ${kpi('Tickets abiertos','msg',`${tk.length}`,`${out.length?`<span class="delta-dn">${out.length} fuera de SLA</span>`:'Todos dentro de SLA'} · ${tk.filter(t=>t.status==='Nuevo').length} sin asignar`,'tickets')}
   ${kpi('Uso de nodos de hosting','server',`${avg} % <small>promedio</small>`,`${hot?`<span class="delta-dn">${hot} nodos sobre 85 %</span>`:'Sin nodos críticos'} · ${NODES.length} nodos`,'infra')}
  </section>
  <div style="height:16px"></div>

function attention(){

  const sus=fInv().filter(v=>v.status==='Pendiente'&&diffD(v.due,TODAY)===0&&v.type!=='Nota de débito');
  if(sus.length)a.push({sev:'critica',t:`${sus.length} suspensiones programadas para mañana`,s:sus.slice(0,2).map(v=>esc(CBY[v.cid].name)).join(', ')+(sus.length>2?` y ${sus.length-2} más`:''),r:'cobranza',cta:'Revisar'});
  const dx=fDom().filter(d=>{const x=diffD(d.real,TODAY);return x>=0&&x<=7&&!d.auto});
  if(dx.length)a.push({sev:dx.some(d=>diffD(d.real,TODAY)<=3)?'critica':'alta',t:`${dx.length} dominios expiran en ≤ 7 días sin renovación automática`,s:dx.slice(0,2).map(d=>`<span class="mono">${esc(d.d)}</span> (${diffD(d.real,TODAY)} d)`).join(', '),r:'dominios',cta:'Renovar'});
  a.push({sev:'critica',t:'Backup nocturno fallido en BH-RES-01',s:'3 cuentas sin copia del 07/10 · error de cuota en destino S3',r:'infra',cta:'Ver nodo'});
  a.push({sev:'media',t:'Snapshot incompleto en VPS-AP-02',s:'Último snapshot correcto: 06/10 02:10',r:'infra',cta:'Ver nodo'});
  const tk=fTk().filter(t=>t.status!=='Resuelto');const o=tk.filter(t=>slaLeft(t)<0),soon=tk.filter(t=>{const l=slaLeft(t);return l>=0&&l<120});
  if(o.length)a.push({sev:'critica',t:`${o.length} tickets fuera de SLA`,s:o.slice(0,2).map(t=>`${t.id} · ${esc(t.sub)}`).join(' — '),r:'tickets',cta:'Atender'});

  return a.sort((x,y)=>SEV[x.sev].r-SEV[y.sev].r);
}
function renewals(){

function drawChart(){
  const box=$('#chart');if(!box)return;
  const W=Math.max(280,box.clientWidth),H=W<500?220:270,m={l:W<500?44:58,r:10,t:12,b:28};
  const k=BRAND_SHARE[S.brand]*(S.cur==='USD'?1/TC:1);
  const b=BILLED.map(v=>v*k),c=COLL.map(v=>v*k);
  const max=Math.max(...b,...c);const step=Math.pow(10,Math.floor(Math.log10(max/4)));const nice=[1,2,2.5,5,10].map(x=>x*step).find(x=>max/x<=5)||step*10;const ymax=Math.ceil(max/nice)*nice;
  const iw=W-m.l-m.r,ih=H-m.t-m.b,bw=iw/12;
  const y=v=>m.t+ih-(v/ymax)*ih;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for(let v=0;v<=ymax+1e-6;v+=nice){s+=`<line class="gridl" x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${S.cur==='USD'?'US$':'S/'} ${compact(v)}</text>`}
  b.forEach((v,i)=>{const x=m.l+i*bw+bw*.18;s+=`<rect x="${x}" y="${y(v)}" width="${bw*.64}" height="${m.t+ih-y(v)}" rx="3" fill="var(--chart-bar)"/>`});
  s+=`<polyline fill="none" stroke="var(--chart-line)" stroke-width="2.4" stroke-linejoin="round" points="${c.map((v,i)=>`${m.l+i*bw+bw/2},${y(v)}`).join(' ')}"/>`;
  c.forEach((v,i)=>{s+=`<circle cx="${m.l+i*bw+bw/2}" cy="${y(v)}" r="3.5" fill="var(--surface)" stroke="var(--chart-line)" stroke-width="2"/>`});
  MONTHS.forEach((d,i)=>{if(W<500&&i%2)return;s+=`<text class="ax" x="${m.l+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${MES[d.getMonth()]}${d.getMonth()===0||i===0?' '+String(d.getFullYear()).slice(2):''}</text>`});
  MONTHS.forEach((d,i)=>{s+=`<rect class="hit" data-i="${i}" x="${m.l+i*bw}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"/>`});
  s+='</svg>';box.innerHTML=s;
  const tip=$('#tip');
  $$('.hit',box).forEach(r=>{r.onmousemove=e=>{const i=+r.dataset.i;const cur=S.cur==='USD'?'USD':'PEN';tip.innerHTML=`<b>${MESL[MONTHS[i].getMonth()]} ${MONTHS[i].getFullYear()}</b><br>Facturado: ${moneyRaw(b[i],cur)}<br>Cobrado: ${moneyRaw(c[i],cur)}<br>Tasa: ${(c[i]/b[i]*100).toFixed(1)} %`;tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-200)+'px';tip.style.top=(e.clientY+14)+'px'};r.onmouseleave=()=>tip.style.display='none'});
}

function seqFor(inv){
  const paid=inv.status==='Pagada';const cm=commits.find(c=>c.inv===inv.id&&c.st==='Vigente');
  return SEQ.slice().sort((a,b)=>a.off-b.off).map(st=>{const d=addD(inv.due,st.off);let s=diffD(d,TODAY)<0?'done':diffD(d,TODAY)===0?'now':'next';
    if(paid&&s!=='done')s='skip';
    if(cm&&s!=='done'&&/Suspender|baja|débito/.test(st.act))s='hold';
    return {...st,d,s}});
}
function timeline(inv){
  const it=seqFor(inv),cm=commits.find(c=>c.inv===inv.id&&c.st==='Vigente');
  const lbl=o=>o<0?`${-o} días antes`:o===0?'Día del vencimiento':`${o} día${o>1?'s':''} después`;
  return `<ol class="tl">${it.map(x=>`<li><span class="nd ${x.s==='done'?'done':x.s==='now'?'now':/Suspender|baja/.test(x.act)&&x.s!=='skip'&&x.s!=='hold'?'bad':''}">${x.s==='done'?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`:''}</span><div class="w"><b>${esc(x.act)}</b><span>${fD(x.d)}</span></div><small>${lbl(x.off)} · ${esc(x.ch)} · ${x.s==='done'?'Enviado':x.s==='now'?'Programado hoy':x.s==='skip'?'Cancelado (comprobante pagado)':x.s==='hold'?'En pausa por compromiso de pago':'Programado'}</small></li>`).join('')}</ol>${cm?`<div class="note warn">${ic('handshake','sm')}<span>Compromiso de pago vigente hasta el ${fD(cm.date)}. La suspensión y el recargo quedan en pausa.</span></div>`:''}`;
}

   pronto:inv.filter(v=>v.status==='Pendiente'&&diffD(v.due,TODAY)>=0&&diffD(v.due,TODAY)<=30).sort((a,b)=>a.due-b.due),

  };

function mapSvg(p){
  const W=160,H=62,CW=218,RH=96,P=20;
  const maxC=Math.max(...p.nodes.map(n=>n.col)),maxR=Math.max(2,...p.nodes.map(n=>n.row));
  const vw=P*2+maxC*CW+W,vh=P*2+maxR*RH+H;
  const pos=Object.fromEntries(p.nodes.map(n=>[n.k,{x:P+n.col*CW,y:P+n.row*RH,n}]));
  let s=`<svg viewBox="0 0 ${vw} ${vh}" role="group" aria-label="Diagrama de componentes del proyecto ${esc(p.n)}" style="min-width:${Math.min(820,vw)}px;max-width:${vw*1.25}px"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--brand-line)"/></marker></defs>`;
  p.edges.forEach(([a,b,l])=>{const A=pos[a],B=pos[b];if(!A||!B)return;let x1,y1,x2,y2,d;
    if(B.n.col>A.n.col){x1=A.x+W;y1=A.y+H/2;x2=B.x;y2=B.y+H/2;const mx=(x1+x2)/2;d=`M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2-2} ${y2}`}
    else if(B.n.col<A.n.col){x1=A.x;y1=A.y+H/2;x2=B.x+W;y2=B.y+H/2;const mx=(x1+x2)/2;d=`M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2+2} ${y2}`}
    else{x1=A.x+W/2;y1=A.y+(B.y>A.y?H:0);x2=B.x+W/2;y2=B.y+(B.y>A.y?0:H);d=`M${x1} ${y1}L${x2} ${y2+(B.y>A.y?-2:2)}`}
    s+=`<path class="medge" d="${d}" marker-end="url(#arr)"/>`;
    if(l){const lx=(x1+x2)/2,ly=(y1+y2)/2;const w=l.length*6.6+10;s+=`<rect class="medge-bg" x="${lx-w/2}" y="${ly-9}" width="${w}" height="18" rx="4"/><text class="medge-l" x="${lx}" y="${ly+4}" text-anchor="middle">${esc(l)}</text>`}});
  p.nodes.forEach(n=>{const {x,y}=pos[n.k];const title=S.clientView?n.cli:n.t;const sub=S.clientView?(n.k==='dom'||n.k==='d'||n.k==='d2'?n.t:n.cli===n.t?'':n.t):n.sub;const tr=(t,m)=>t.length>m?t.slice(0,m-1)+'…':t;
    s+=`<g class="mnode${S.mapSel===n.k?' sel':''}" tabindex="0" role="button" data-act="mapSel" data-k="${n.k}" aria-label="${esc(title)}${sub?', '+esc(sub):''}, estado ${n.st==='ok'?'operativo':n.st==='warn'?'requiere atención':'con incidencia'}"><title>${esc(n.t)} — ${esc(n.sub)}</title><rect class="box" x="${x}" y="${y}" width="${W}" height="${H}" rx="9"/><g transform="translate(${x+10} ${y+11}) scale(.82)"><g class="ic">${icRaw(n.ic)}</g></g><text class="t" x="${x+38}" y="${y+25}">${esc(tr(title,17))}</text>${sub?`<text class="s" x="${x+38}" y="${y+43}">${esc(tr(sub,20))}</text>`:''}<circle class="mdot ${n.st==='ok'?'ok':n.st==='warn'?'warn':'danger'}" cx="${x+W-11}" cy="${y+11}" r="4.5"/></g>`});
  return s+'</svg>';
}

function rgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))}

function secCheck(p){const c=[[p.length>=SEC.minLen,`Al menos ${SEC.minLen} caracteres`]];if(SEC.upper)c.push([/[A-ZÁÉÍÓÚÑ]/.test(p)&&/[a-záéíóúñ]/.test(p),'Mayúsculas y minúsculas']);if(SEC.num)c.push([/\d/.test(p),'Al menos un número']);if(SEC.sym)c.push([/[^A-Za-z0-9áéíóúñÁÉÍÓÚÑ]/.test(p),'Al menos un símbolo']);c.push([!/(1234|qwerty|password|contraseña|alojamiento)/i.test(p),'No es una contraseña común']);

function kHash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%100003;return h}
function kSeries(k){if(k._s)return k._s;let sd=kHash(k.id);const r=()=>{sd=(sd*9301+49297)%233280;return sd/233280};const o=[];for(let i=0;i<48;i++){let v=k.base*(1+k.trend*(i-47)/47)*(1+k.noise*Math.sin(i/12*2*Math.PI+sd%7))*(1+(r()-.5)*k.noise);if(k.unit==='pct')v=Math.max(0,Math.min(k.id==='uptime'?100:99.5,v));o.push(v)}k._s=o;return o}

function kSpark(k,off){const len=kLen(),step=S.kPer==='año'||S.kPer==='rango'?1:len;const o=[];for(let i=11;i>=0;i--)o.push(kAgg(k,kEnd()-(off||0)-i*step,S.kPer==='rango'?1:len));return o}

function kDelta(k,v,p){const d=p?(v-p)/Math.abs(p)*100:0;const flat=Math.abs(d)<.5;const good=k.dir==='up'?d>0:d<0;return {d,cls:flat?'flat':good?'good':'bad',txt:`${flat?'■':d>0?'▲':'▼'} ${NF2.format(Math.abs(d)).replace(/0$/,'')} %`}}

function kOrdered(g){const ids=KD.filter(k=>k.g===g).map(k=>k.id);const o=(KPREF.order[g]||[]).filter(x=>ids.includes(x));ids.forEach(x=>{if(!o.includes(x))o.push(x)});return o}
/* ---------- Gráficos a escala ---------- */
function niceMax(m){if(m<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(m)));const n=[1,1.2,1.5,2,2.5,3,4,5,6,8,10].find(x=>x*p>=m);return n*p}
const CC=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
function yAx(m,W,H,mx,fmt){let s='';for(let i=0;i<=4;i++){const v=mx*i/4,y=H-m.b-(H-m.t-m.b)*i/4;s+=`<line class="gridl" x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/><text class="ax" x="${m.l-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}return s}
function xLab(labels,x0,bw,H,W){const every=Math.ceil(labels.length/Math.max(2,Math.floor((W-60)/52)));return labels.map((l,i)=>i%every?'':`<text class="ax" x="${x0+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`).join('')}
function drawSpec(el,sp){if(!el)return;const W=Math.max(260,el.clientWidth||300),H=sp.h||220,f=sp.fmt||(v=>compact(v));let s='';const m={l:sp.ml||(W<420?44:56),r:12,t:12,b:28};const iw=W-m.l-m.r,ih=H-m.t-m.b;
  if(sp.type==='line'||sp.type==='bars'||sp.type==='stack'){const n=sp.labels.length,bw=iw/n;const tot=sp.type==='stack'?sp.labels.map((_,i)=>sp.series.reduce((a,se)=>a+se.v[i],0)):[];const mx=niceMax(sp.type==='stack'?Math.max(...tot):Math.max(...sp.series.flatMap(se=>se.v)));const y=v=>m.t+ih-v/mx*ih;s+=yAx(m,W,H,mx,f);
    if(sp.type==='line')sp.series.forEach((se,j)=>{const c=se.c||CC[j];s+=`<polyline fill="none" stroke="${c}" stroke-width="${se.dash?1.8:2.4}" ${se.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" points="${se.v.map((v,i)=>`${m.l+i*bw+bw/2},${y(v)}`).join(' ')}"/>`+se.v.map((v,i)=>`<circle cx="${m.l+i*bw+bw/2}" cy="${y(v)}" r="${se.dash?2:3}" fill="var(--surface)" stroke="${c}" stroke-width="2"><title>${esc(se.n)} · ${esc(sp.labels[i])}: ${f(v)}</title></circle>`).join('')});
    else if(sp.type==='bars'){const k=sp.series.length,gw=bw*.76,w=gw/k;sp.series.forEach((se,j)=>se.v.forEach((v,i)=>{s+=`<rect x="${m.l+i*bw+bw*.12+j*w}" y="${y(v)}" width="${Math.max(1,w-1.5)}" height="${m.t+ih-y(v)}" rx="2" fill="${se.c||CC[j]}"><title>${esc(se.n)} · ${esc(sp.labels[i])}: ${f(v)}</title></rect>`}))}
    else sp.labels.forEach((_,i)=>{let acc=0;sp.series.forEach((se,j)=>{const v=se.v[i];s+=`<rect x="${m.l+i*bw+bw*.18}" y="${y(acc+v)}" width="${bw*.64}" height="${Math.max(0,y(acc)-y(acc+v))}" fill="${se.c||CC[j]}"><title>${esc(se.n)} · ${esc(sp.labels[i])}: ${f(v)}</title></rect>`;acc+=v})});
    s+=xLab(sp.labels,m.l,bw,H,W)}
  else if(sp.type==='waterfall'){const it=sp.items;const bw=iw/it.length;let run=0;const tops=[];it.forEach(x=>{if(x.t==='total'){tops.push([0,x.v]);run=x.v}else if(x.t==='up'){tops.push([run,run+x.v]);run+=x.v}else{tops.push([run-x.v,run]);run-=x.v}});const mx=niceMax(Math.max(...tops.map(t=>t[1])));const mn=Math.max(0,Math.floor(Math.min(...tops.map(t=>t[0]))*0.9/ (mx/20))*(mx/20));const y=v=>m.t+ih-(v-mn)/(mx-mn)*ih;
    for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,yy=y(v);s+=`<line class="gridl" x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}"/><text class="ax" x="${m.l-6}" y="${yy+4}" text-anchor="end">${f(v)}</text>`}
    it.forEach((x,i)=>{const [a,b]=tops[i];const c=x.t==='total'?'var(--c1)':x.t==='up'?'var(--c2)':'var(--danger)';s+=`<rect x="${m.l+i*bw+bw*.18}" y="${y(b)}" width="${bw*.64}" height="${Math.max(1,y(a)-y(b))}" rx="2" fill="${c}"><title>${esc(x.n)}: ${x.t==='down'?'−':x.t==='up'?'+':''}${f(x.v)}</title></rect><text class="ax strong" x="${m.l+i*bw+bw/2}" y="${y(b)-5}" text-anchor="middle">${x.t==='down'?'−':x.t==='up'?'+':''}${f(x.v)}</text>`;if(i<it.length-1){const lv=x.t==='down'?a:b;s+=`<line x1="${m.l+i*bw+bw*.82}" x2="${m.l+(i+1)*bw+bw*.18}" y1="${y(lv)}" y2="${y(lv)}" stroke="var(--border-strong)" stroke-dasharray="3 3"/>`}});
    s+=xLab(it.map(x=>x.n),m.l,bw,H,W)}
  else if(sp.type==='hbar'){const it=sp.items,lw=Math.min(150,W*.34),rh=Math.min(30,(H-16)/it.length),mx=sp.max||niceMax(Math.max(...it.map(x=>x.v)));const bx=lw+8,bwid=W-bx-60;
    it.forEach((x,i)=>{const yy=8+i*rh;s+=`<text class="ax" x="${lw}" y="${yy+rh/2+4}" text-anchor="end">${esc(x.n.length>22?x.n.slice(0,21)+'…':x.n)}</text><rect x="${bx}" y="${yy+rh*.18}" width="${bwid}" height="${rh*.64}" rx="3" fill="var(--surface-3)"/><rect x="${bx}" y="${yy+rh*.18}" width="${Math.max(1,x.v/mx*bwid)}" height="${rh*.64}" rx="3" fill="${x.c||'var(--c1)'}"><title>${esc(x.n)}: ${f(x.v)}</title></rect><text class="ax strong" x="${bx+bwid+6}" y="${yy+rh/2+4}">${f(x.v)}</text>`});
    (sp.marks||[]).forEach(t=>{const xx=bx+t/mx*bwid;s+=`<line x1="${xx}" x2="${xx}" y1="4" y2="${8+it.length*rh}" stroke="var(--border-strong)" stroke-dasharray="3 3"/><text class="ax" x="${xx}" y="${8+it.length*rh+12}" text-anchor="middle">${t} %</text>`})}
  else if(sp.type==='funnel'){const it=sp.items,mx=it[0].v,rh=(H-10)/it.length;it.forEach((x,i)=>{const w=Math.max(30,(W-170)*x.v/mx),xx=150+((W-170)-w)/2,yy=5+i*rh;s+=`<text class="ax" x="140" y="${yy+rh/2+4}" text-anchor="end">${esc(x.n)}</text><rect x="${xx}" y="${yy+3}" width="${w}" height="${rh-6}" rx="4" fill="var(--c1)" fill-opacity="${1-i*.13}"><title>${esc(x.n)}: ${f(x.v)}</title></rect><text class="ax strong on-c" x="${xx+w/2}" y="${yy+rh/2+4}" text-anchor="middle">${f(x.v)}${i?` · ${Math.round(x.v/it[i-1].v*100)} %`:''}</text>`})}
  else if(sp.type==='heat'){const R=sp.rows,C=sp.cols,lw=110,cw=(W-lw-10)/C.length,rh=Math.min(34,(H-26)/R.length);const mx=Math.max(...sp.data.flat());R.forEach((r,i)=>{s+=`<text class="ax" x="${lw-8}" y="${6+i*rh+rh/2+4}" text-anchor="end">${esc(r)}</text>`;C.forEach((c,j)=>{const v=sp.data[i][j];s+=`<rect x="${lw+j*cw+1}" y="${6+i*rh+1}" width="${cw-2}" height="${rh-2}" rx="4" fill="var(--heat)" fill-opacity="${.08+.92*v/mx}"><title>${esc(r)} · ${c}: ${v} tickets</title></rect><text class="ax ${v/mx>.55?'on-c':''}" x="${lw+j*cw+cw/2}" y="${6+i*rh+rh/2+4}" text-anchor="middle">${v}</text>`})});C.forEach((c,j)=>{s+=`<text class="ax" x="${lw+j*cw+cw/2}" y="${6+R.length*rh+14}" text-anchor="middle">${c}</text>`})}
  else if(sp.type==='donut'){const it=sp.items,t=it.reduce((a,x)=>a+x.v,0),cx=Math.min(W/2,110),cy=H/2,R=Math.min(H/2-8,80),r0=R*.62;let a0=-Math.PI/2;it.forEach((x,j)=>{const a1=a0+x.v/t*2*Math.PI,lg=a1-a0>Math.PI?1:0;const p=(a,rr)=>`${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)}`;s+=`<path d="M${p(a0,R)}A${R},${R} 0 ${lg} 1 ${p(a1,R)}L${p(a1,r0)}A${r0},${r0} 0 ${lg} 0 ${p(a0,r0)}Z" fill="${x.c||CC[j]}"><title>${esc(x.n)}: ${Math.round(x.v/t*100)} %</title></path>`;a0=a1});s+=`<text class="ax strong big" x="${cx}" y="${cy+2}" text-anchor="middle">${Math.round(it[0].v/t*100)} %</text><text class="ax" x="${cx}" y="${cy+18}" text-anchor="middle">${esc(it[0].n)}</text>`;it.forEach((x,j)=>{s+=`<rect x="${cx+R+24}" y="${cy-it.length*11+j*22}" width="10" height="10" rx="2" fill="${x.c||CC[j]}"/><text class="ax" x="${cx+R+40}" y="${cy-it.length*11+j*22+9}">${esc(x.n)} · ${Math.round(x.v/t*100)} % (${f(x.v)})</text>`})}
  const leg=sp.series&&sp.series.length>1?`<div class="legend" style="margin-top:6px">${sp.series.map((se,j)=>`<span><i style="background:${se.c||CC[j]}${se.dash?';height:3px;vertical-align:3px':''}"></i>${esc(se.n)}</span>`).join('')}</div>`:'';
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sp.title||'Gráfico')}">${s}</svg>${leg}`}
const KCH={};
const chartBox=(id,title,sub,sp,wide)=>{KCH[id]=sp;return `<section class="card${wide?' kwide':''}"><div class="card-h"><h3 class="sec">${title}</h3>${sub?`<span class="sub">${sub}</span>`:''}</div><div class="card-b"><div class="kchart" id="ch-${id}" data-ch="${id}"></div></div></section>`};

function kLabels(){const len=kLen(),step=S.kPer==='año'||S.kPer==='rango'?1:len;const o=[];for(let i=11;i>=0;i--){const e=kEnd()-i*step;o.push(S.kPer==='trimestre'?`T${Math.floor(kMonth(e).getMonth()/3)+1} ${String(kMonth(e).getFullYear()).slice(2)}`:kMonL(e))}return o}
const money0=v=>{const [x,c]=conv(v,'PEN');return `${SYM[c]} ${compact(x)}`};
const pct0=v=>NF0.format(v)+' %';

    const ch=CHANNELS.map((c,i)=>[c,[31,27,9,22,11][i]]);h+=chartBox('canal','Ventas por canal y marca',`clientes nuevos · ${kPerLabel()}`,{type:'bars',labels:ch.map(c=>c[0]),fmt:v=>NF0.format(v),series:BRANDS.filter(b=>S.brand==='all'||b.id===S.brand).map((b,j)=>({n:b.n,v:ch.map(c=>Math.max(0,Math.round(c[1]*BRAND_SHARE[b.id]*kLen()*CATF[S.kCat]*1.2))),c:CC[BRANDS.indexOf(b)]}))});

    const B=['Por vencer','1–30 d','31–60 d','61–90 d','> 90 d'];const L6=L.slice(6);h+=chartBox('aging','Deuda por antigüedad','últimos 6 periodos',{type:'stack',labels:L6,fmt:money0,series:B.map((b,j)=>({n:b,v:L6.map((_,i)=>[30000,15500,3200,1500,2400][j]*bf*(1+.04*Math.sin(i+j))*(1-.02*i)),c:['var(--c1)','var(--c3)','var(--c4)','var(--danger)','var(--c5)'][j]}))});

function sanitize(html){const t=document.createElement('template');t.innerHTML=String(html||'');

    [...c.attributes].forEach(a=>{const nm=a.name.toLowerCase(),v=a.value.trim();let keep=false;if(tg==='A'&&nm==='href')keep=/^(https?:|mailto:|#|\/)/i.test(v);else if(tg==='IMG'&&nm==='src')keep=/^(https?:|data:image\/(png|jpe?g|gif|webp);)/i.test(v);else if(tg==='IMG'&&nm==='alt')keep=true;else if((tg==='TD'||tg==='TH')&&nm==='colspan')keep=/^\d{1,2}$/.test(v);else if(tg==='MARK'&&nm==='class')keep=v==='var';if(!keep)c.removeAttribute(a.name)});
    if(tg==='A'){c.setAttribute('rel','noopener noreferrer');c.setAttribute('target','_blank')}})};
  walk(t.content);t.content.querySelectorAll('p').forEach(p=>{if(p.querySelector('ul,ol,table,h2,h3,h4,div,blockquote,p'))p.replaceWith(...p.childNodes)});return t.innerHTML}

  const row=(d,t,tl)=>{const tk=whoisTaken(d);return `<div class="wh-row"><b class="mono">${esc(d)}</b>${tk?'<span class="wh-no">✕ No disponible</span>':'<span class="wh-ok">✓ Disponible</span>'}<span class="wh-p">${tl?scMoney(tl.pPEN,v.moneda)+'/año':''}</span>${tk?`<span class="mw-b o sm" data-act="whTr" data-d="${esc(d)}" role="button" tabindex="0">Transferir</span>${v.mostrar_whois?`<span class="mw-link" data-act="whOpen" data-d="${esc(d)}" role="button" tabindex="0">WHOIS</span>`:''}`:`<span class="${mwBtnCls(S.scBrand)} sm" data-act="whReg" data-d="${esc(d)}" role="button" tabindex="0">Registrar</span>`}</div>${S.whOpen===d&&tk&&v.mostrar_whois?`<dl class="wh-who"><dt>Dominio</dt><dd>${esc(d.toUpperCase())}</dd><dt>Registrador</dt><dd>${d.endsWith('.pe')?'Red Científica Peruana (vía PoloDomains)':'NameCheap, Inc.'}</dd><dt>Creado</dt><dd>${fD(addD(TODAY,-(kHash(d)%2000)-200))}</dd><dt>Expira</dt><dd>${fD(addD(TODAY,kHash(d)%300+20))}</dd><dt>Estado</dt><dd>clientTransferProhibited</dd><dt>Servidores DNS</dt><dd>ns1.alojamientoplus.pe · ns2.alojamientoplus.pe</dd><dt>Titular</dt><dd>REDACTED FOR PRIVACY · privacidad de datos activada</dd><dt>Contacto</dt><dd>Formulario del registrador</dd></dl>`:''}`};
  let res='';if(S.whDone){if(!ok)res='<p class="wh-err">Escriba un nombre de 3 a 63 caracteres: letras, números y guiones.</p>';else{const main=ex.map(e=>row(q+e,0,TLDS.find(t=>t.tld===e))).join('');const sug=v.sugerencias?[q+'peru','mi'+q,q+'online',q+'-sac',q+'app'].map(s2=>{const e=ex.find(x=>!whoisTaken(s2+x))||ex[0];return row(s2+e,0,TLDS.find(t=>t.tld===e))}).join(''):'';const alt=TLDS.filter(t=>t.online&&!ex.includes(t.tld)).map(t=>row(q+t.tld,0,t)).join('');
    res=`<div class="wh-res">${main}</div>${sug?`<h4 class="mw-h wh-h">Sugerencias de nombres</h4><div class="wh-res">${sug}</div>`:''}${alt?`<h4 class="mw-h wh-h">Otras extensiones</h4><div class="wh-res">${alt}</div>`:''}`}}
  return `<h3 class="mw-h">Busca tu dominio</h3><div class="mw-search"><input class="input wh-in" id="whQ" value="${esc(S.whQ)}" data-h="whQ" aria-label="Nombre de dominio" placeholder="tuempresa"><span class="${mwBtnCls(S.scBrand)}" data-act="whGo" role="button" tabindex="0">Buscar</span></div><div class="mw-tlds">${ex.map(e=>{const t=TLDS.find(x=>x.tld===e);return t?`<span>${e} <b>${scMoney(t.pPEN,v.moneda)}</b></span>`:''}).join('')}</div>${res}`}
function srvPreview(v){const F=S.srv;let l=srvList(v);const locs=[...new Set(l.map(x=>x.loc))];if(v.filtros)l=l.filter(x=>x.cpu>=F.cpu&&x.ram>=F.ram&&(!F.loc||x.loc===F.loc));const an=v.ciclo==='anual';const base=x=>an?(x.pa||x.pm*12*.9):x.pm;const addP=a=>an?a.p*12:a.p;
  const cfg=v.configurador&&F.cfg&&l.find(x=>x.id===F.cfg);
  return `${v.filtros?`<div class="srv-f"><label>CPU mín.<select class="select" data-h="srvF" data-k="cpu">${[0,2,4,8].map(n=>`<option value="${n}"${F.cpu===n?' selected':''}>${n?n+' vCPU':'Cualquiera'}</option>`).join('')}</select></label><label>RAM mín.<select class="select" data-h="srvF" data-k="ram">${[0,4,8,16,32].map(n=>`<option value="${n}"${F.ram===n?' selected':''}>${n?n+' GB':'Cualquiera'}</option>`).join('')}</select></label><label>Ubicación<select class="select" data-h="srvF" data-k="loc"><option value="">Todas</option>${locs.map(x=>`<option${F.loc===x?' selected':''}>${x}</option>`).join('')}</select></label></div>`:''}
  ${l.length?`<table class="mw-cmp srv-t"><tr><th>Servidor</th><th>CPU</th><th>RAM</th><th>Disco</th><th>Ubicación</th><th>Precio</th><th></th></tr>${l.map(x=>`<tr${cfg&&cfg.id===x.id?' class="on"':''}><td><b>${esc(x.name)}</b></td><td>${x.cpu} vCPU</td><td>${x.ram} GB</td><td>${esc(x.dsk)}</td><td>${esc(x.loc)}</td><td><b>${scMoney(base(x),v.moneda)}</b>${an?'/año':'/mes'}</td><td>${v.configurador?`<span class="mw-b o sm" data-act="srvCfg" data-id="${x.id}" role="button" tabindex="0">Configurar</span>`:`<span class="${mwBtnCls(S.scBrand)} sm" data-act="srvCart" data-id="${x.id}" role="button" tabindex="0">Contratar</span>`}</td></tr>`).join('')}</table>`:'<p class="mw-mut">Ningún servidor cumple los filtros.</p>'}
  ${cfg?`<div class="srv-cfg"><h4 class="mw-h">Configurar ${esc(cfg.name)}</h4><label>Sistema operativo<select class="select" data-h="srvOS">${['Ubuntu 24.04','AlmaLinux 9','Debian 12','Windows Server 2022 (+ licencia)'].map(o=>`<option${F.os===o?' selected':''}>${o}</option>`).join('')}</select></label><div class="srv-adds">${ADDONS.map((a,i)=>`<label class="check"><input type="checkbox" data-h="srvAdd" value="${i}" ${F.add.includes(i)?'checked':''}>${esc(a.n)} <span class="mw-mut">+${scMoney(addP(a),v.moneda)}</span></label>`).join('')}</div>${(()=>{const tot=base(cfg)+F.add.reduce((s,i)=>s+addP(ADDONS[i]),0)+(F.os.startsWith('Windows')?(an?210*12:210):0);return `<div class="srv-tot"><span>Total ${an?'anual':'mensual'}</span><b>${scMoney(tot,v.moneda)}</b></div>`})()}<span class="${mwBtnCls(S.scBrand)}" data-act="srvCart" data-id="${cfg.id}" role="button" tabindex="0">Agregar al carrito</span></div>`:''}`}

  const c=CBY[cid];const pend=c.invoices.filter(v=>(v.status==='Pendiente'||v.status==='Vencida')&&v.type!=='Nota de crédito');
  if(!pend.length){toast('Sin saldo pendiente',`${c.name} no tiene comprobantes por cobrar.`,'info');return}
  const first=invId?IBY[invId]:pend[0];
  formDlg({title:'Registrar pago',sub:esc(c.name),fields:[
   {id:'inv',label:'Comprobante',type:'select',options:pend.map(v=>[v.id,`${v.num} · saldo ${money(saldo(v),v.cur)}`]),value:first.id,full:true},
   {id:'m',label:'Medio de pago',type:'select',options:['Tarjeta (pasarela local)','Transferencia','PayPal'],value:'Transferencia'},
   {id:'amt',label:`Monto (${first.cur==='PEN'?'S/':'US$'})`,type:'number',step:'0.01',min:0,value:saldo(first).toFixed(2),req:true},
   {id:'ref',label:'Referencia / N.º de operación',ph:'Ej. 48211907',full:true}],
   pre:`<div class="note">${ic('info','sm')}<span>Con PayPal, la comisión se agrega al comprobante como línea aparte «Comisión por medio de pago».</span></div>`,
   submit:'Registrar pago',validate:v=>+v.amt>0?null:'El monto debe ser mayor que cero.',
   onSubmit:v=>{const inv=IBY[v.inv];let amt=+v.amt;
     if(v.m==='PayPal'&&!inv.lines.some(l=>l.fee)){const fee=+(inv.sub*0.054+(inv.cur==='USD'?0.3:1.15)).toFixed(2);inv.lines.push({d:'Comisión por medio de pago (PayPal 5.4 % + tarifa fija)',q:1,pu:fee,fee:true});inv.sub=+(inv.sub+fee).toFixed(2);inv.igv=+(inv.sub*inv.igvR).toFixed(2);inv.total=+(inv.sub+inv.igv).toFixed(2);amt=saldo(inv)}

function onField(e){
  const el=e.target;

    const k=el.dataset.on,v=el.type==='checkbox'?el.checked:el.value;
    if(k==='brand'||k==='cur'){S[k]=v;S.cliPage=0;S.domPage=0;S.facPage=0;renderTop();refresh();return}
    if(e.type==='input'&&el.tagName!=='INPUT')return;
    S[k]=v;if(k.startsWith('cli'))S.cliPage=0;if(k==='cobQ')S.cobPage=0;if(k.startsWith('dom'))S.domPage=0;if(k.startsWith('fac'))S.facPage=0;

    const n=$(`#page [data-on="${k}"]`);if(n&&el.type==='search'){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}else if(n)n.focus();
    return;
  }
  if(el.dataset.seq!=null){const s=SEQ[+el.dataset.seq],f=el.dataset.f;
    if(f==='n'||f==='rel'){const row=el.closest('.seq-row');const n=Math.max(0,Math.min(120,+row.querySelector('[data-f="n"]').value||0));const rel=row.querySelector('[data-f="rel"]').value;s.off=rel==='antes'?-n:rel==='dia'?0:n;row.querySelector('[data-f="n"]').disabled=rel==='dia';if(rel!=='dia'&&n===0&&f==='rel'){row.querySelector('[data-f="n"]').value=1;s.off=rel==='antes'?-1:1}}
    else s[f]=el.value;
    $('#simOut').innerHTML=simHtml();return}
  if(el.dataset.sim){S.sim[el.dataset.sim]=el.value;$('#simOut').innerHTML=simHtml();return}
  if(el.dataset.sla){const s=SLA[el.dataset.sla],f=el.dataset.f;s[f]=(f==='fr'||f==='res')?Math.max(1,+el.value||1):el.value;const k=el.dataset.sla;const c=$('#slaN-'+k);if(c)c.innerHTML=`${tickets.filter(t=>t.prio===k&&t.status!=='Resuelto').length} <span class="sub">(${tickets.filter(t=>t.prio===k&&t.status!=='Resuelto'&&slaLeft(t)<0).length} fuera)</span>`;renderNav()}

  if(e.key==='Escape'){
    if($('#modalRoot').classList.contains('open')){closeModal();return}
