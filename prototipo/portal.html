<title>Portal AlojamientoPlus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f8; --surface:#ffffff; --surface-2:#f6f8fc; --surface-3:#e9eef7; --hover:#eef3fd;
  --border:#d9e0ec; --border-strong:#b8c3d6; --text:#0f1b2e; --text-2:#33425c; --muted:#5d6b84; --faint:#8a96ab;
  --brand:#0a3fc4; --brand-hover:#0834a3; --brand-ink:#ffffff; --brand-soft:#e3ebfd; --brand-text:#0a3fc4; --brand-line:#9db6f2;
  --topbar:#0a3fc4; --topbar-2:#0835aa; --topbar-ink:#ffffff; --topbar-muted:#c9d8ff; --topbar-field:#0632a0;
  --ok:#4c8a26; --ok-strong:#5f9a32; --ok-bg:#e8f3df; --ok-text:#3b6e1c;
  --warn:#f2b71a; --warn-bg:#fdf3d6; --warn-text:#7a5500;
  --high:#d9700b; --high-bg:#fdebd9; --high-text:#9a4b00;
  --danger:#c62a2a; --danger-bg:#fbe5e5; --danger-text:#a11d1d;
  --info:#0a3fc4; --info-bg:#e3ebfd; --info-text:#0a3fc4;
  --neutral-bg:#eceff5; --neutral-text:#4b5870;
  --chart-bar:#a9c0f5; --chart-line:#0a3fc4; --chart-grid:#e3e8f1; --chart-axis:#5d6b84;
  --scrim:rgba(10,20,40,.45); --shadow:0 1px 2px rgba(15,27,46,.06),0 1px 1px rgba(15,27,46,.04);
  --shadow-pop:0 12px 32px rgba(15,27,46,.18),0 2px 6px rgba(15,27,46,.08);
  --focus:#f2b71a; --skel:#e4e9f2; --skel-2:#f1f4f9;
  --f-head:"Poppins","Nunito","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --sidew:248px; --toph:56px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a101c; --surface:#111a2a; --surface-2:#152035; --surface-3:#1b2840; --hover:#1a2741;
    --border:#243350; --border-strong:#36486b; --text:#e7edf8; --text-2:#c3cee2; --muted:#93a2bd; --faint:#6d7c97;
    --brand:#4d82ff; --brand-hover:#6a96ff; --brand-ink:#ffffff; --brand-soft:#16264a; --brand-text:#8fb0ff; --brand-line:#3a5ca8;
    --topbar:#08298a; --topbar-2:#0a2f9c; --topbar-ink:#ffffff; --topbar-muted:#b4c7f7; --topbar-field:#061f6b;
    --ok:#7cc04b; --ok-strong:#6fae3e; --ok-bg:#1a2d17; --ok-text:#9bd471;
    --warn:#f2b71a; --warn-bg:#33290d; --warn-text:#f5c94e;
    --high:#ff9a3d; --high-bg:#3a2311; --high-text:#ffb26b;
    --danger:#ff6464; --danger-bg:#3b1618; --danger-text:#ff8f8f;
    --info:#6f9bff; --info-bg:#16264a; --info-text:#9dbaff;
    --neutral-bg:#1d2a42; --neutral-text:#b3bfd4;
    --chart-bar:#2f4f9a; --chart-line:#8fb0ff; --chart-grid:#22314c; --chart-axis:#93a2bd;
    --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
    --shadow-pop:0 16px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
    --skel:#1b2840; --skel-2:#223250;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a101c; --surface:#111a2a; --surface-2:#152035; --surface-3:#1b2840; --hover:#1a2741;
  --border:#243350; --border-strong:#36486b; --text:#e7edf8; --text-2:#c3cee2; --muted:#93a2bd; --faint:#6d7c97;
  --brand:#4d82ff; --brand-hover:#6a96ff; --brand-ink:#ffffff; --brand-soft:#16264a; --brand-text:#8fb0ff; --brand-line:#3a5ca8;
  --topbar:#08298a; --topbar-2:#0a2f9c; --topbar-ink:#ffffff; --topbar-muted:#b4c7f7; --topbar-field:#061f6b;
  --ok:#7cc04b; --ok-strong:#6fae3e; --ok-bg:#1a2d17; --ok-text:#9bd471;
  --warn:#f2b71a; --warn-bg:#33290d; --warn-text:#f5c94e;
  --high:#ff9a3d; --high-bg:#3a2311; --high-text:#ffb26b;
  --danger:#ff6464; --danger-bg:#3b1618; --danger-text:#ff8f8f;
  --info:#6f9bff; --info-bg:#16264a; --info-text:#9dbaff;
  --neutral-bg:#1d2a42; --neutral-text:#b3bfd4;
  --chart-bar:#2f4f9a; --chart-line:#8fb0ff; --chart-grid:#22314c; --chart-axis:#93a2bd;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-pop:0 16px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  --skel:#1b2840; --skel-2:#223250;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-text)}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;letter-spacing:-.01em}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:15px;height:15px}.i.lg{width:22px;height:22px}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--surface);color:var(--text);padding:8px 12px;border-radius:6px}
.skip:focus{top:8px}
h1[tabindex="-1"]:focus{outline:none}

/* ===== Componentes reutilizados del panel interno ===== */
/* ===== Page head ===== */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--brand-text);text-decoration:underline}
.crumbs .i{width:13px;height:13px;opacity:.6}
.crumbs [aria-current]{color:var(--text-2);font-weight:600}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.phead h1{font-size:24px;font-weight:700;line-height:1.2}
.phead p{margin:4px 0 0;color:var(--muted)}
.phead .acts{display:flex;gap:8px;flex-wrap:wrap}
h2.sec{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}

/* ===== Basic components ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;font-size:13.5px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.success{background:var(--ok-strong);border-color:var(--ok-strong);color:#fff}
.btn.success:hover{filter:brightness(.94)}
.btn.danger{color:var(--danger-text);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand-text)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:6px}
.btn.icon{width:34px;padding:0}
.btn.sm.icon{width:30px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn .spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:500}
.card-b{padding:4px 16px 16px}
.card-f{border-top:1px solid var(--border);padding:10px 16px;display:flex;justify-content:flex-end}
.grid{display:grid;gap:16px;min-width:0}
.g-kpi{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1280px){.g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1100px){.g-2{grid-template-columns:minmax(0,1fr)}.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g-kpi,.g-2e,.g-3{grid-template-columns:minmax(0,1fr)}.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.g-kpi,.g-4{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:16px;min-width:0;align-content:start}

.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px;position:relative}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--f-head);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.01em}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:600;font-family:var(--f-body)}
.kpi .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kpi .twin{display:flex;flex-direction:column;gap:2px}
.kpi a.cover{position:absolute;inset:0;border-radius:10px}
.kpi:has(a.cover):hover{border-color:var(--brand-line)}
.delta-up{color:var(--ok-text);font-weight:700}
.delta-dn{color:var(--danger-text);font-weight:700}

.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral-text);line-height:1}
.chip .i{width:12px;height:12px;stroke-width:2.4}
.chip.ok{background:var(--ok-bg);color:var(--ok-text)}
.chip.warn{background:var(--warn-bg);color:var(--warn-text)}
.chip.high{background:var(--high-bg);color:var(--high-text)}
.chip.danger{background:var(--danger-bg);color:var(--danger-text)}
.chip.info{background:var(--info-bg);color:var(--info-text)}
.chip.outline{background:transparent;border:1px solid var(--border-strong);color:var(--text-2)}
.brand-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
.brand-tag i{width:8px;height:8px;border-radius:2px;display:inline-block}

.field{display:grid;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.input,.select,textarea.input{height:36px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:0 10px;min-width:0;width:100%;font-weight:500;font-size:13.5px}
textarea.input{height:auto;padding:8px 10px;resize:vertical}
.input:focus-visible,.select:focus-visible{outline:2px solid var(--brand);outline-offset:0}
.input-ic{position:relative;min-width:0}
.input-ic .i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px}
.input-ic .input{padding-left:34px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.toolbar .input-ic{flex:1 1 220px;max-width:340px}
.toolbar .select{width:auto;flex:0 1 auto;max-width:200px}
.toolbar .count{margin-left:auto;font-size:12.5px;color:var(--muted)}
.check{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);cursor:pointer;user-select:none}
.check input{width:16px;height:16px;accent-color:var(--brand)}

.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2);border:0;background:transparent;padding:4px}
.switch .trk{width:36px;height:20px;border-radius:999px;background:var(--border-strong);position:relative;transition:background .15s}
.switch .trk::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked="true"] .trk{background:var(--brand)}
.switch[aria-checked="true"] .trk::after{transform:translateX(16px)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:thin;min-width:0}
.tab{border:0;background:transparent;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:7px;align-items:center;font-size:13.5px}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--brand-text);border-bottom-color:var(--brand)}
.tab .cnt{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--neutral-bg);color:var(--neutral-text)}
.tab[aria-selected="true"] .cnt{background:var(--brand-soft);color:var(--brand-text)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;padding:2px;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* tables */
.tw{overflow-x:auto;min-width:0;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
.t td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.t tbody tr:hover td{background:var(--hover)}
.t tbody tr:last-child td{border-bottom:0}
.t .r{text-align:right}
.t td.num,.t td.r{font-variant-numeric:tabular-nums;white-space:nowrap}
.t .nw{white-space:nowrap}
.t .strong{font-weight:700;color:var(--text)}
.t .sub{font-size:12px;color:var(--muted)}
.t a.rowlink{color:var(--text);font-weight:700;text-decoration:none}
.t a.rowlink:hover{color:var(--brand-text);text-decoration:underline}
.t tr.done td{opacity:.6}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pager .btns{display:flex;gap:6px}

/* empty / skeleton */
.empty{display:grid;place-items:center;text-align:center;padding:40px 16px;color:var(--muted);gap:8px}
.empty .ring{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--surface-3);color:var(--muted)}
.empty b{color:var(--text);font-size:15px;font-family:var(--f-head)}
.skel{background:linear-gradient(90deg,var(--skel) 0%,var(--skel-2) 50%,var(--skel) 100%);background-size:200% 100%;animation:sh 1.1s linear infinite;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}

/* severity */
.sev{display:inline-grid;place-items:center;width:22px;height:22px;flex:none}
.sev svg{width:20px;height:20px}
.sev.critica{color:var(--danger)}
.sev.alta{color:var(--high)}
.sev.media{color:var(--info)}
.sev.baja{color:var(--faint)}
.att{list-style:none;margin:0;padding:0}
.att li{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-top:1px solid var(--border);position:relative}
.att li::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0}
.att li.critica::before{background:var(--danger)}
.att li.alta::before{background:var(--high)}
.att li.media::before{background:var(--info)}
.att li.baja::before{background:var(--border-strong)}
.att .tx{flex:1;min-width:0}
.att .tx b{display:block;font-weight:700;font-size:13.5px}
.att .tx small{color:var(--muted);font-size:12.5px}
.att .lvl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.att li.critica .lvl{color:var(--danger-text)}.att li.alta .lvl{color:var(--high-text)}.att li.media .lvl{color:var(--info-text)}.att li.baja .lvl{color:var(--muted)}

/* bars */
.cap{display:grid;gap:4px}
.cap-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.cap-top b{font-weight:700}
.bar{height:9px;border-radius:5px;background:var(--surface-3);position:relative;overflow:visible}
.bar > i{display:block;height:100%;border-radius:5px;background:var(--brand)}
.bar > i.l1{background:var(--ok)}
.bar > i.l2{background:var(--warn)}
.bar > i.l3{background:var(--high)}
.bar > i.l4{background:var(--danger)}
.bar .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--surface);border-left:1px solid var(--border-strong)}
.bar.thin{height:6px}
.sla{display:grid;gap:4px;min-width:120px}
.sla small{font-size:12px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* list rows */
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--border);min-width:0}
.rows li .grow{flex:1;min-width:0}
.rows li .grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows li .grow small{color:var(--muted);font-size:12px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* timeline */
.tl{list-style:none;margin:0;padding:0 0 0 4px;position:relative}
.tl li{position:relative;padding:0 0 14px 26px}
.tl li::before{content:"";position:absolute;left:7px;top:18px;bottom:-2px;width:2px;background:var(--border)}
.tl li:last-child::before{display:none}
.tl .nd{position:absolute;left:0;top:2px;width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface);display:grid;place-items:center}
.tl .nd.done{background:var(--ok);border-color:var(--ok);color:#fff}
.tl .nd.done svg{width:10px;height:10px;stroke-width:3.2}
.tl .nd.now{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.tl .nd.bad{border-color:var(--danger);background:var(--danger-bg)}
.tl .w{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tl .w b{font-size:13px}
.tl .w span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl small{color:var(--muted);font-size:12px;display:block}

/* popovers, modal, toast, palette */
.pop{position:absolute;top:calc(100% + 6px);right:0;width:min(380px,calc(100vw - 24px));background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-pop);z-index:70;display:none;overflow:hidden}
.pop.open{display:block}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.pop-h b{font-family:var(--f-head);font-size:14px}
.pop-list{max-height:min(60vh,420px);overflow:auto;list-style:none;margin:0;padding:0}
.pop-list li{border-bottom:1px solid var(--border)}
.pop-list button{display:flex;gap:10px;width:100%;text-align:left;padding:11px 14px;border:0;background:transparent;cursor:pointer;color:var(--text)}
.pop-list button:hover{background:var(--hover)}
.pop-list .unread{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:6px;flex:none}
.pop-list .read{width:8px;flex:none}
.pop-list small{display:block;color:var(--muted);font-size:12px}
.anchor{position:relative;flex:none}
.umenu{padding:6px}

.modal-b{padding:16px 18px;overflow:auto;display:grid;gap:14px}
.modal-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.err{color:var(--danger-text);font-size:12px;font-weight:600}

.toasts{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:120;display:grid;gap:8px;width:min(380px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-left:4px solid var(--ok-strong);box-shadow:var(--shadow-pop);animation:tin .2s ease}

.toast.warn{border-left-color:var(--warn)}
.toast.err{border-left-color:var(--danger)}
.toast .i{margin-top:1px}
.toast.ok .i{color:var(--ok)}
.toast div{flex:1;min-width:0}
.toast b{display:block;font-size:13.5px}
.toast small{color:var(--muted);font-size:12.5px}
.toast button{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px;border-radius:4px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

.pal{width:min(640px,100%);align-self:flex-start;margin-top:8vh}
.pal-in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}

.pal-it .ico{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);flex:none}

/* misc */
.split{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}

.statline{display:flex;gap:18px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}

.statline b{font-family:var(--f-head);font-size:17px;font-variant-numeric:tabular-nums}
.stackbar{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--surface-3);gap:2px}

.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 72px;gap:10px;align-items:center;padding:6px 0;font-size:13px}

.seq-row{display:grid;grid-template-columns:78px minmax(140px,1.2fr) minmax(150px,1.3fr) minmax(130px,1fr) 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}

.chart-box{width:100%;min-width:0}
.chart-box svg{display:block}
.chart-box text{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.ax{fill:var(--chart-axis);font-size:11px}
.gridl{stroke:var(--chart-grid);stroke-width:1}
.tip{position:fixed;pointer-events:none;z-index:130;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow-pop);display:none;font-variant-numeric:tabular-nums}

.provcard{padding:14px 16px;display:grid;gap:8px}

.provcard li span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.note{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border)}
.note.warn{background:var(--warn-bg);color:var(--warn-text);border-color:transparent}
.daychip{min-width:64px;justify-content:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}

.voucher{border:1px dashed var(--border-strong);border-radius:8px;padding:12px;display:grid;gap:4px;background:var(--surface-2);font-size:12.5px}
.page-enter{animation:fadein .18s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* tickets */
.tk-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}

.atts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

.comp-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* seguridad */
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0 4px}

body{font-size:14.5px;line-height:1.5}

.tb-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:8px;border:0;background:transparent;color:var(--topbar-ink);cursor:pointer;position:relative;flex:none}

.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--topbar-ink);flex:none;margin-right:4px}

.demo-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px dashed var(--warn);color:var(--warn);white-space:nowrap;flex:none;background:transparent}

.tb-user{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--topbar-ink);cursor:pointer;padding:3px 8px 3px 3px;border-radius:999px;flex:none}

.tb-user .who{display:flex;flex-direction:column;line-height:1.15;text-align:left;font-size:12px}

.anchor{position:relative;flex:none}

.sidebar{grid-area:side;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;padding:14px 12px calc(16px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:2px}

.main{grid-area:main;overflow:auto;min-width:0;padding:24px max(28px,env(safe-area-inset-right)) 0 28px}

.dhead .tt{flex:1 1 240px;min-width:0}
.dhead h1{font-size:23px}
.dhead p{margin:4px 0 0;color:var(--muted)}
.dhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.soon{display:grid;gap:8px;padding:12px 14px;border:1px dashed var(--border-strong);border-radius:10px;background:var(--surface-2)}
.soon .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.soon .row .btn[disabled]{flex:none}
.soon small{color:var(--muted);font-size:12.5px}
.kv{font-size:13.5px;gap:8px 16px}

.dom-card{padding:16px 18px;display:grid;gap:12px}
.dom-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.dom-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.dom-grid div{display:grid;gap:2px;min-width:0}

.lock{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:var(--info-bg);color:var(--info-text);font-size:13px}

/* Facturas */
.paybar{position:sticky;bottom:0;z-index:2;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 180px 12px 16px;box-shadow:0 -6px 14px rgba(15,27,46,.06);border-top:1px solid var(--border);background:var(--surface);border-radius:0 0 12px 12px}
.paybar .sum{flex:1;min-width:0}
.paybar .sum b{font-family:var(--f-head);font-size:18px;font-variant-numeric:tabular-nums}
.paybar .sum small{display:block;color:var(--muted);font-size:12.5px}
.icards{display:none}
.icard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:14px 16px;border-top:1px solid var(--border)}
.icard .amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.icard .amt small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.icard b{display:block}
.icard small{color:var(--muted);font-size:12.5px}
.icard .ra{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap}

.orig{display:block;font-size:11.5px;color:var(--faint);font-weight:500}

/* Pago */
.pstep{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pstep li{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--muted);min-width:0}
.pstep li span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--border-strong);font-weight:700;font-size:12px;flex:none}
.pstep li em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstep li.cur{border-color:var(--brand);color:var(--brand-text);font-weight:700;box-shadow:0 0 0 3px var(--brand-soft)}
.pstep li.cur span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.pstep li.done{color:var(--ok-text)}
.pstep li.done span{background:var(--ok);border-color:var(--ok);color:#fff}
@media (max-width:520px){.pstep li em{display:none}.pstep li{justify-content:center}}
.pay-l{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.pay-l>*{min-width:0}
@media (max-width:1000px){.pay-l{grid-template-columns:minmax(0,1fr)}}
.methods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.methods{grid-template-columns:minmax(0,1fr)}}
.method{display:flex;gap:10px;align-items:center;padding:14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;text-align:left;color:var(--text);position:relative}
.method:hover{border-color:var(--brand-line)}
.method[aria-checked="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.method .ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2);flex:none}
.method[aria-checked="true"] .ico{background:var(--brand-soft);color:var(--brand-text)}
.method b{display:block;font-size:14px}
.method small{color:var(--muted);font-size:12px}
.sumbox{padding:16px 18px;display:grid;gap:8px;position:sticky;top:0}
.sumbox .ln{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-variant-numeric:tabular-nums}
.sumbox .ln span:first-child{color:var(--text-2);min-width:0;overflow-wrap:anywhere}
.sumbox .ln.fee span{color:var(--high-text)}
.sumbox .ln.tot{border-top:1px solid var(--border);padding-top:10px;font-weight:800;font-family:var(--f-head);font-size:17px}
.sumbox .ln.tot span{color:var(--text)}
.cardf{display:grid;gap:12px}
.cardnum{position:relative}
.cardnum .brand{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--muted)}
.gw{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);padding:10px 12px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border)}
.drop{display:grid;place-items:center;gap:6px;text-align:center;padding:22px 14px;border:2px dashed var(--border-strong);border-radius:12px;background:var(--surface-2);cursor:pointer;color:var(--muted);position:relative}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text)}
.drop:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.prev{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
.prev img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--border);flex:none;background:var(--surface-3)}
.prev .pdf{width:96px;height:96px;border-radius:8px;display:grid;place-items:center;background:var(--danger-bg);color:var(--danger-text);font-weight:800;flex:none}
.prev .tx{flex:1;min-width:0}
.prev .tx b{display:block;overflow-wrap:anywhere}
.bank{display:grid;gap:4px;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2)}
.bank .row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.bank code{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;overflow-wrap:anywhere}
.done-box{display:grid;justify-items:center;text-align:center;gap:10px;padding:28px 18px}
.done-box .big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok-text)}
.done-box .big.warn{background:var(--warn-bg);color:var(--warn-text)}
.done-box .big .i{width:32px;height:32px;stroke-width:2.2}
.done-box h2{font-size:21px}
.done-box p{margin:0;color:var(--muted);max-width:52ch}
.radios{display:grid;gap:8px}
.radio{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer}
.radio:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.radio input{margin-top:3px;accent-color:var(--brand);width:16px;height:16px;flex:none}
.radio b{display:block;font-size:14px}
.radio small{color:var(--muted);font-size:12.5px}

/* Soporte */
.tk-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:14px 18px;border-top:1px solid var(--border);text-decoration:none;color:var(--text);align-items:center}
.tk-row:hover{background:var(--hover)}
.tk-row b{font-size:14.5px;font-weight:600}
.tk-row .m{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-top:4px}
.tk-row .r{display:grid;justify-items:end;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.pri{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700}
.pri i{width:8px;height:8px;border-radius:2px;display:inline-block}
.pri.baja i{background:var(--faint)}.pri.media i{background:var(--info)}.pri.alta i{background:var(--high)}.pri.urgente i{background:var(--danger)}
.files{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.files li{display:flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);font-size:13px;min-width:0}
.files li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files li small{color:var(--muted);font-variant-numeric:tabular-nums}

/* Respaldos */
.bk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 18px;border-top:1px solid var(--border)}
.bk .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok-text)}
.bk .ico.warn{background:var(--warn-bg);color:var(--warn-text)}
.bk b{display:block}
.bk small{color:var(--muted);font-size:12.5px}
@media (max-width:600px){.bk{grid-template-columns:auto minmax(0,1fr)}.bk .btn{grid-column:1/-1;justify-self:start}}
.days{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.days i{width:14px;height:14px;border-radius:3px;background:var(--ok);display:inline-block}
.days i.f{background:var(--danger)}.days i.r{background:var(--warn)}

/* Seguridad */
.reqs{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.reqs li{display:flex;gap:6px;align-items:center}
.reqs li.ok{color:var(--ok-text)}
.reqs .i{width:14px;height:14px}
.pw{position:relative}
.pw .input{padding-right:44px}
.pw button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);width:34px;height:32px;border-radius:6px;cursor:pointer;display:grid;place-items:center}
.pw button:hover{background:var(--hover)}
.qr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:520px){.qr{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}}
.qr svg{width:168px;height:168px;border-radius:10px;background:#fff;padding:8px;border:1px solid var(--border)}
.secret{font-family:var(--f-mono);font-size:14px;letter-spacing:.08em;padding:8px 10px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--border-strong);word-break:break-all}
.otp-in{font-family:var(--f-mono);font-size:24px;letter-spacing:.5em;text-align:center;height:52px;font-variant-numeric:tabular-nums;padding-left:.5em}
.rcodes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;font-family:var(--f-mono);font-size:13.5px}
.rcodes span{padding:6px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);text-align:center}
.sess{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.sess .ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2);flex:none}
.sess .tx{flex:1 1 200px;min-width:0}
.sess .tx b{display:block}
.sess .tx small{color:var(--muted);font-size:12.5px}
.state{display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);flex-wrap:wrap}
.state .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--warn-bg);color:var(--warn-text)}
.state.on .ico{background:var(--ok-bg);color:var(--ok-text)}
.state .tx{flex:1 1 200px;min-width:0}
.state .tx small{display:block;color:var(--muted);font-size:12.5px}

/* Usuarios */
.urow{display:flex;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.urow .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--brand-soft);color:var(--brand-text);flex:none;font-family:var(--f-head)}
.urow .tx{flex:1 1 200px;min-width:0}
.urow .tx b{display:block}
.urow .tx small{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.urow .acts{display:flex;gap:6px;flex-wrap:wrap}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:800px){.roles{grid-template-columns:minmax(0,1fr)}}
.role{padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);display:grid;gap:6px;align-content:start}
.role ul{margin:0;padding-left:18px;font-size:13px;color:var(--text-2);display:grid;gap:2px}

/* Documentos */
.doc{display:flex;gap:12px;align-items:center;padding:14px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.doc .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-2);flex:none}
.doc .tx{flex:1 1 240px;min-width:0}
.doc .tx b{display:block}
.doc .tx small{color:var(--muted);font-size:12.5px}
.doc .acts{display:flex;gap:6px;flex-wrap:wrap}
.legal{max-height:300px;overflow:auto;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);font-size:13px}
.legal h3{font-size:14px;margin:8px 0 4px}
.legal p{margin:0 0 8px}

/* Barra inferior móvil y hoja "Más" */
.bnav{display:none}
@media (min-width:901px){.toasts{bottom:max(88px,env(safe-area-inset-bottom))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main"}
  .sidebar{display:none}
  .main{padding:16px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
  .page::after{height:calc(150px + env(safe-area-inset-bottom))}
  .paybar{bottom:calc(62px + env(safe-area-inset-bottom));padding:10px 76px 10px 14px;gap:8px}
  .paybar .btn.lg{height:40px;font-size:14px;padding:0 14px}
  .paybar .sum b{font-size:16px}
  .bnav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--border);padding:4px max(4px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(4px,env(safe-area-inset-left));box-shadow:0 -4px 16px rgba(15,27,46,.06)}
  .bnav a,.bnav button{display:grid;justify-items:center;gap:2px;padding:7px 2px 6px;border:0;background:transparent;color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:600;cursor:pointer;border-radius:8px;min-width:0;position:relative}
  .bnav a span,.bnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bnav [aria-current="page"]{color:var(--brand-text)}
  .bnav [aria-current="page"]::before{content:"";position:absolute;top:-4px;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
  .bnav .b{position:absolute;top:3px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
  .toasts{bottom:calc(136px + env(safe-area-inset-bottom))}
  .tb-user .who{display:none}
}
@media (max-width:560px){
  .logo b,.logo em{display:none}
  .topbar{gap:4px}
  .demo-badge{font-size:10.5px;padding:2px 7px}
  .tb-user{padding:3px}
}
.sheet-root{position:fixed;inset:0;z-index:85;display:none}
.sheet-root.open{display:block}
.bsheet{position:absolute;left:0;right:0;bottom:0;max-height:85%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;box-shadow:var(--shadow-pop);padding:8px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));animation:sup .2s ease}
@keyframes sup{from{transform:translateY(30px);opacity:0}}
.bsheet .grip{width:40px;height:4px;border-radius:2px;background:var(--border-strong);margin:4px auto 10px}
.bsheet h2{font-size:16px;margin:0 0 8px}
.bsheet .nav-item{padding:12px 10px}

/* Asistente */
.fab{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:50;display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 18px 0 14px;border-radius:999px;border:0;background:var(--brand);color:#fff;font-weight:700;cursor:pointer;box-shadow:var(--shadow-pop)}
.fab:hover{background:var(--brand-hover)}
.fab .i{width:22px;height:22px}
@media (max-width:900px){.fab{bottom:calc(76px + env(safe-area-inset-bottom));right:max(16px,env(safe-area-inset-right));height:50px;width:50px;padding:0;justify-content:center}.fab span{display:none}}
.chat{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:95;width:min(380px,calc(100vw - 32px));height:min(560px,calc(100% - 100px));display:none;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-pop);overflow:hidden}

@media (max-width:900px){.chat{right:16px;left:16px;width:auto;bottom:calc(76px + env(safe-area-inset-bottom));height:min(540px,calc(100% - 150px))}}
.chat-h{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--topbar);color:#fff}
.chat-h .ico{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.chat-h b{display:block;font-size:14px}
.chat-h small{color:var(--topbar-muted);font-size:12px}
.chat-h .x{margin-left:auto;border:0;background:transparent;color:#fff;width:34px;height:34px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.chat-h .x:hover{background:var(--topbar-2)}
.chat-note{font-size:12px;color:var(--warn-text);background:var(--warn-bg);padding:7px 14px;display:flex;gap:6px;align-items:center}
.chat-b{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;padding:9px 12px;border-radius:14px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.bot{background:var(--surface-2);border:1px solid var(--border);border-bottom-left-radius:4px;align-self:flex-start}
.bub.me{background:var(--brand);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.bub.typing{color:var(--muted);font-style:italic}
.sugs{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}

.chat-human .btn{width:100%}

/* Acceso */

.auth.open{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;height:100%;padding:0}

/* ================= Toasts, diálogos, popovers ================= */
function toast(t,s,kind){
  kind=kind||'ok';
  const el=document.createElement('div');el.className='toast '+kind;
  el.innerHTML=`${ic(kind==='ok'?'check':kind==='err'?'oct':kind==='warn'?'tri':'info')}<div><b>${esc(t)}</b>${s?`<small>${esc(s)}</small>`:''}</div><button aria-label="Cerrar aviso">${ic('x','sm')}</button>`;
  el.querySelector('button').onclick=()=>el.remove();
  const box=$('#toasts');box.appendChild(el);while(box.children.length>3)box.firstElementChild.remove();
  setTimeout(()=>el.remove(),4600);
}
let modalReturn=null;
function openModal(html,opt){
  opt=opt||{};
  const m=$('#modal');m.className='modal'+(opt.wide?' wide':'');m.innerHTML=html;
  if(!$('#modalRoot').classList.contains('open'))modalReturn=document.activeElement;
  $('#modalRoot').classList.add('open');$('#modalRoot').setAttribute('aria-hidden','false');
  const f=m.querySelector(opt.focus||'[autofocus],input:not([type=hidden]):not([readonly]),select,textarea,button:not([data-act="closeModal"])')||m.querySelector('button');
  setTimeout(()=>f&&f.focus(),10);
}
function closeModal(){
  if(!$('#modalRoot').classList.contains('open'))return;
  $('#modalRoot').classList.remove('open');$('#modalRoot').setAttribute('aria-hidden','true');$('#modal').innerHTML='';
  if(modalReturn&&document.contains(modalReturn))modalReturn.focus();
}
const mHead=(t,sub)=>`<div class="modal-h"><div><h2 id="modalTitle">${t}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="btn icon sm ghost" data-act="closeModal" aria-label="Cerrar">${ic('x')}</button></div>`;
function confirmDlg(title,body,okLabel,onOk,danger){
  openModal(`${mHead(title)}<div class="modal-b">${body}</div><div class="modal-f"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn ${danger?'danger':'primary'}" id="dlgOk">${okLabel}</button></div>`,{focus:'#dlgOk'});
  $('#dlgOk').onclick=()=>{closeModal();onOk()};
}
function trapFocus(e,root){
  const f=$$('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])',root).filter(x=>x.offsetParent!==null);
  if(!f.length)return;const a=f[0],z=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}
  else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
}
function closePops(){$$('.pop.open').forEach(p=>p.classList.remove('open'));$('#btnNotif').setAttribute('aria-expanded','false');$('#btnUser').setAttribute('aria-expanded','false')}
function togglePop(id,btn){const p=$(id);const was=p.classList.contains('open');closePops();if(!was){p.classList.add('open');$(btn).setAttribute('aria-expanded','true');const f=p.querySelector('button,a');f&&f.focus()}}

const R={name:'resumen',arg:null};
let loadTimer=null;
function parseHash(){const h=(location.hash||'#resumen').slice(1);const [n,...rest]=h.split('/');return {name:TITLES[n]?n:'resumen',arg:rest.join('/')||null}}
function go(r){if(location.hash==='#'+r)onRoute();else location.hash=r}
function crumbs(items){return `<nav class="crumbs" aria-label="Migas de pan"><a href="#resumen">Inicio</a>${items.map((x,i)=>`${ic('cr')}${i===items.length-1?`<span aria-current="page">${esc(x[0])}</span>`:`<a href="#${x[1]}">${esc(x[0])}</a>`}`).join('')}</nav>`}
function skeleton(){return `<div class="skel" style="height:14px;width:180px;margin-bottom:12px"></div><div class="skel" style="height:30px;width:min(360px,80%);margin-bottom:22px"></div><div class="kpis">${'<div class="card" style="padding:16px"><div class="skel" style="height:12px;width:60%"></div><div class="skel" style="height:24px;width:40%;margin-top:12px"></div></div>'.repeat(4)}</div><div class="card" style="padding:18px;display:grid;gap:12px">${'<div class="skel" style="height:16px"></div>'.repeat(5)}</div><span class="sr-only">Cargando…</span>`}
function onRoute(){
  const p=parseHash();const changed=p.name!==R.name||p.arg!==R.arg;R.name=p.name;R.arg=p.arg;
  closePops();closeSheet();closeModal();
  if(R.name==='acceso'){$('#app').hidden=true;$('#bnav').style.display='none';$('#fab').style.display='none';closeChat();renderAuth();document.title='Acceso · Portal AlojamientoPlus';return}
  $('#auth').classList.remove('open');$('#app').hidden=false;$('#bnav').style.display='';$('#fab').style.display='';
  renderNav();
  document.title=`${TITLES[R.name]} · Portal AlojamientoPlus`;
  clearTimeout(loadTimer);
  if(changed){
    $('#page').setAttribute('aria-busy','true');$('#page').innerHTML=skeleton();$('#main').scrollTop=0;
    loadTimer=setTimeout(()=>{render(true);$('#page').setAttribute('aria-busy','false');const h=$('#page h1');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}},220);
  } else render();
}
let afterRender=null;
function render(anim){
  afterRender=null;
  const v=VIEWS[R.name]||VIEWS.resumen;
  $('#page').innerHTML=`<div class="${anim?'page-enter':''}">${v(R.arg)}</div>`;

}

const stChip=st=>st==='ok'?`<span class="chip ok">${ic('check')}Operativo</span>`:st==='warn'?`<span class="chip warn">${ic('tri')}Requiere atención</span>`:`<span class="chip danger">${ic('oct')}Con incidencia</span>`;
const invChip=i=>({vencida:`<span class="chip danger">Vencida</span>`,pendiente:`<span class="chip warn">Pendiente</span>`,pagada:`<span class="chip ok">${ic('check')}Pagada</span>`,validacion:`<span class="chip info">${ic('clock')}En validación por finanzas</span>`})[i.st];
const tkChip=st=>st==='Esperando tu respuesta'?`<span class="chip warn">${st}</span>`:st==='En atención'?`<span class="chip info">${st}</span>`:st==='Nuevo'?`<span class="chip info">${st}</span>`:st==='Resuelto'?`<span class="chip ok">${st}</span>`:`<span class="chip">${st}</span>`;

const priTag=p=>`<span class="pri ${p}"><i aria-hidden="true"></i>${PRI[p]}</span>`;
function lvl(p){return p>=90?'l4':p>=75?'l2':'l1'}
function usageBar(u){
  const [l,a,b,unit]=u;const pct=b?Math.min(100,a/b*100):a;
  const fmt=x=>x>=1000&&!unit?NF0.format(x):NF1.format(x);
  const txt=b?`${fmt(a)} de ${fmt(b)}${unit?` ${unit}`:''}`:`${NF1.format(a)} %`;
  return `<div class="cap"><div class="cap-top"><span>${esc(l)}</span><b>${txt}</b></div><div class="bar" role="meter" aria-label="${esc(l)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i class="${lvl(pct)}" style="width:${pct.toFixed(1)}%"></i></div></div>`;
}
function emptyBox(icon,t,s,btn){return `<div class="empty"><div class="ring">${ic(icon)}</div><b>${t}</b><span>${s}</span>${btn||''}</div>`}
function priceTxt(s){const [v,c,per]=s.price;if(!v)return 'Incluido en tu plan';return `${money(v,c)} / ${per}`}

     <a class="btn sm ghost" href="#servicios/dns">${ic('net','sm')}Ver DNS</a>
     ${!d.auto?`<button class="btn sm success" data-act="domRenew" data-d="${esc(d.name)}">Renovar ahora</button>`:''}</div></article>`}).join('')}</div>`;
};

/* ---- Facturas ---- */
function invList(){const t=S.invTab;return INV.filter(i=>t==='pend'?(payable(i)||i.st==='validacion'):t==='paid'?i.st==='pagada':true).sort((a,b)=>(payable(b)-payable(a))||(b.date-a.date))}
VIEWS.facturas=()=>{
  const L=invList();const cnt={pend:INV.filter(i=>payable(i)||i.st==='validacion').length,paid:INV.filter(i=>i.st==='pagada').length,all:INV.length};
  [...S.sel].forEach(id=>{const i=INV.find(x=>x.id===id);if(!i||!payable(i))S.sel.delete(id)});
  const selInv=INV.filter(i=>S.sel.has(i.id));const tot=selInv.reduce((a,i)=>a+conv(i.amt,i.c),0);
  const pay=L.filter(payable);const allSel=pay.length&&pay.every(i=>S.sel.has(i.id));
  const acts=i=>`<button class="btn sm ghost icon" data-act="invView" data-id="${i.id}" aria-label="Ver detalle de ${i.id}" title="Ver detalle">${ic('eye','sm')}</button><button class="btn sm ghost icon" data-act="invDl" data-id="${i.id}" aria-label="Descargar ${i.id} en PDF" title="Descargar PDF">${ic('download','sm')}</button>${payable(i)?`<button class="btn sm success" data-act="payOne" data-id="${i.id}">Pagar</button>`:''}`;
  const box=i=>payable(i)?`<input type="checkbox" data-act="selInv" data-id="${i.id}" ${S.sel.has(i.id)?'checked':''} aria-label="Seleccionar ${i.id}">`:'';
  return `${crumbs([['Facturas y pagos']])}<div class="phead"><h1>Facturas y pagos</h1><p class="lead">Paga una o varias facturas a la vez con tarjeta, PayPal o transferencia. Importes mostrados en ${S.cur==='PEN'?'soles':'dólares'} (tipo de cambio referencial S/ ${NF2.format(TC)}).</p></div>
  <section class="card"><div class="toolbar"><div class="seg" role="group" aria-label="Filtrar facturas">${[['pend','Por pagar'],['paid','Pagadas'],['all','Todas']].map(([k,l])=>`<button aria-pressed="${S.invTab===k}" data-act="invTab" data-k="${k}">${l} <span class="num">(${cnt[k]})</span></button>`).join('')}</div>${pay.length?`<label class="check" style="margin-left:auto"><input type="checkbox" data-act="selAll" ${allSel?'checked':''}>Seleccionar todas las pendientes</label>`:''}</div>
  ${L.length?`<div class="tw itable"><table class="t"><thead><tr><th style="width:40px"><span class="sr-only">Seleccionar</span></th><th>Comprobante</th><th>Concepto</th><th>Emisión</th><th>Vence</th><th class="r">Importe</th><th>Estado</th><th class="r">Acciones</th></tr></thead><tbody>
   ${L.map(i=>`<tr><td>${box(i)}</td><td class="nw mono">${i.id}</td><td>${esc(i.desc)}</td><td class="num">${fD(i.date)}</td><td class="num">${fD(i.due)}</td><td class="r">${moneyO(i.amt,i.c)}</td><td>${invChip(i)}</td><td class="r nw">${acts(i)}</td></tr>`).join('')}</tbody></table></div>
   <div class="icards">${L.map(i=>`<div class="icard"><span style="padding-top:2px">${box(i)}</span><div style="min-width:0"><b class="mono">${i.id}</b><small>${esc(i.desc)}</small><div style="margin-top:6px">${invChip(i)} <small class="num">Vence ${fD(i.due)}</small></div></div><div class="amt">${moneyO(i.amt,i.c)}</div><div class="ra">${acts(i)}</div></div>`).join('')}</div>`
   :emptyBox(S.invTab==='paid'?'receipt':'check',S.invTab==='paid'?'Aún no hay pagos':'¡Estás al día!',S.invTab==='paid'?'Tus facturas pagadas aparecerán aquí.':'No tienes facturas pendientes de pago.')}
  ${pay.length?`<div class="paybar"><div class="sum"><small>${selInv.length?plural(selInv.length,'factura seleccionada','facturas seleccionadas'):'Marca las facturas a pagar'}</small><b>${moneyRaw(tot,S.cur)}</b></div><button class="btn success lg" data-act="paySel" ${selInv.length?'':'disabled'}>${ic('card')}Pagar seleccionadas</button></div>`:''}
  </section>`;
};

/* ---- Pago (3 pasos) ---- */
function payInv(){return INV.filter(i=>S.payIds.includes(i.id))}
function payCalc(){
  const L=payInv();const m=S.pay.method;const cur=m==='paypal'?'USD':S.cur;
  const sub=r2(L.reduce((a,i)=>a+conv(i.amt,i.c,cur),0));const fee=m==='paypal'?r2(sub*PP_PCT+PP_FIX):0;
  return {L,cur,sub,fee,total:r2(sub+fee)};
}
VIEWS.pagar=()=>{
  afterRender=bindPay;const st=S.pay.step;
  if(st<3){S.payIds=S.payIds.filter(id=>{const i=INV.find(x=>x.id===id);return i&&payable(i)});if(!S.payIds.length&&st===1&&!S.pay.touched)S.payIds=pendInv().map(i=>i.id)}
  const steps=['Revisar facturas','Método de pago','Confirmación'];
  const head=`${crumbs([['Facturas y pagos','facturas'],['Pagar']])}<div class="phead"><h1>Pagar facturas</h1><p class="lead">Pago seguro en tres pasos. No guardamos los datos de tu tarjeta.</p></div>
   <ol class="pstep" aria-label="Pasos del pago">${steps.map((l,k)=>`<li class="${k+1<st?'done':k+1===st?'cur':''}"${k+1===st?' aria-current="step"':''}><span>${k+1<st?ic('check','sm'):k+1}</span><em>${l}</em></li>`).join('')}</ol>`;
  if(st===3)return head+payResult();
  const pend=pendInv();
  if(!pend.length&&st===1)return head+`<section class="card">${emptyBox('check','No tienes facturas pendientes','Todo está pagado. ¡Gracias!',`<a class="btn" href="#facturas">Ver facturas</a>`)}</section>`;
  const c=payCalc();
  const sum=`<aside class="card sumbox" aria-label="Resumen del pago"><h2 class="sec">Resumen</h2>${c.L.map(i=>`<div class="ln"><span>${i.id}</span><span>${moneyRaw(conv(i.amt,i.c,c.cur),c.cur)}</span></div>`).join('')||'<small style="color:var(--muted)">Sin facturas seleccionadas</small>'}
   ${c.fee?`<div class="ln"><span>Subtotal</span><span>${moneyRaw(c.sub,c.cur)}</span></div><div class="ln fee"><span>Comisión PayPal (5.4 % + US$ 0.30)</span><span>${moneyRaw(c.fee,c.cur)}</span></div>`:''}
   <div class="ln tot"><span>Total a pagar</span><span>${moneyRaw(c.total,c.cur)}</span></div>
   ${c.cur!==S.cur||c.L.some(i=>i.c!==c.cur)?`<small style="color:var(--muted)">Conversión referencial con tipo de cambio S/ ${NF2.format(TC)} por US$ 1.</small>`:''}</aside>`;
  if(st===1)return head+`<div class="pay-l"><section class="card"><div class="card-h"><h2>Elige qué facturas pagar</h2></div><ul class="rows">${pend.map(i=>`<li><label class="check grow" style="gap:12px"><input type="checkbox" data-act="paySel1" data-id="${i.id}" ${S.payIds.includes(i.id)?'checked':''}><span style="min-width:0"><b class="mono" style="display:block">${i.id}</b><small>${esc(i.desc)} · vence ${fD(i.due)}</small></span></label><span style="text-align:right">${moneyO(i.amt,i.c)}</span>${i.st==='vencida'?'<span class="chip danger">Vencida</span>':''}</li>`).join('')}</ul>
   <div class="card-f" style="justify-content:space-between;gap:8px;flex-wrap:wrap"><a class="btn" href="#facturas">Cancelar</a><button class="btn primary" data-act="payNext" ${S.payIds.length?'':'disabled'}>Continuar ${ic('arrow','sm')}</button></div></section>${sum}</div>`;
  /* paso 2 */
  const m=S.pay.method;
  const methods=[['card','Tarjeta','Visa, Mastercard, Amex','card'],['paypal','PayPal','Incluye comisión','paypal'],['transfer','Transferencia','Sube tu voucher','bank']];
  let form='';
  if(m==='card')form=`<form class="cardf" id="cardForm" novalidate autocomplete="off">
    <div class="gw">${ic('lock','sm')}<span>Pasarela de pago simulada. Los datos no se envían ni se guardan.</span></div>
    <label class="field" for="ccName">Nombre como figura en la tarjeta<input class="input" id="ccName" autocomplete="off" placeholder="LUCIA QUISPE"></label>
    <label class="field" for="ccNum">Número de tarjeta<span class="cardnum"><input class="input num" id="ccNum" inputmode="numeric" autocomplete="off" placeholder="0000 0000 0000 0000" maxlength="19"><span class="brand" id="ccBrand"></span></span></label>
    <div class="form-grid"><label class="field" for="ccExp">Vencimiento (MM/AA)<input class="input num" id="ccExp" inputmode="numeric" placeholder="MM/AA" maxlength="5" autocomplete="off"></label><label class="field" for="ccCvv">Código de seguridad<input class="input num" id="ccCvv" inputmode="numeric" placeholder="123" maxlength="4" autocomplete="off"></label></div>
    <div class="err" id="ccErr" role="alert"></div>
    <div class="row-b"><button type="button" class="linkbtn" data-act="ccDemo">Usar tarjeta de prueba</button><span></span></div>
    <div class="row-b"><button type="button" class="btn" data-act="payBack">${ic('cl','sm')}Atrás</button><button class="btn success lg" type="submit" id="ccPay">${ic('lock','sm')}Pagar ${moneyRaw(c.total,c.cur)}</button></div></form>`;
  else if(m==='paypal')form=`<div style="display:grid;gap:12px"><div class="note">${ic('info','sm')}<span>PayPal cobra en dólares. La <b>comisión de PayPal</b> (5.4 % + US$ 0.30) se suma como línea aparte y la verás en el resumen antes de pagar.</span></div>
    <div class="bank"><div class="row"><span>Facturas</span><b class="num">${moneyRaw(c.sub,'USD')}</b></div><div class="row" style="color:var(--high-text)"><span>Comisión PayPal</span><b class="num">${moneyRaw(c.fee,'USD')}</b></div><div class="row" style="border-top:1px solid var(--border);padding-top:6px"><span>Total en PayPal</span><b class="num">${moneyRaw(c.total,'USD')}</b></div></div>
    <div class="row-b"><button type="button" class="btn" data-act="payBack">${ic('cl','sm')}Atrás</button><button class="btn primary lg" data-act="ppPay" id="ppPay">${ic('paypal','sm')}Continuar a PayPal · ${moneyRaw(c.total,'USD')}</button></div></div>`;
  else {const b=BANKS[S.pay.bank];form=`<form id="trForm" style="display:grid;gap:12px" novalidate>
    <fieldset class="fset"><legend>1. Transfiere a una de nuestras cuentas (${S.cur==='PEN'?'soles':'dólares'})</legend>
     <div class="seg" role="group" aria-label="Banco">${Object.entries(BANKS).map(([k,v])=>`<button type="button" aria-pressed="${S.pay.bank===k}" data-act="bank" data-k="${k}">${v.n}</button>`).join('')}</div>
     <div class="bank"><div class="row"><span>Titular</span><b>AlojamientoPlus S.A.C.</b></div><div class="row"><span>Cuenta ${b.n} ${S.cur==='PEN'?'S/':'US$'}</span><span><code>${b[S.cur]}</code> <button type="button" class="btn sm ghost icon" data-act="copy" data-v="${b[S.cur]}" aria-label="Copiar número de cuenta">${ic('copy','sm')}</button></span></div><div class="row"><span>CCI</span><span><code>${b['cci'+S.cur]}</code> <button type="button" class="btn sm ghost icon" data-act="copy" data-v="${b['cci'+S.cur]}" aria-label="Copiar CCI">${ic('copy','sm')}</button></span></div><div class="row"><span>Monto exacto</span><b class="num">${moneyRaw(c.total,c.cur)}</b></div></div></fieldset>
    <fieldset class="fset"><legend>2. Sube el voucher o constancia</legend>
     ${S.pay.voucher?`<div class="prev">${S.pay.voucher.img?`<img src="${S.pay.voucher.url}" alt="Vista previa del voucher">`:`<span class="pdf">PDF</span>`}<div class="tx"><b>${esc(S.pay.voucher.name)}</b><small class="num" style="color:var(--muted)">${fmtSize(S.pay.voucher.size)}</small></div><button type="button" class="btn sm" data-act="vRemove">Cambiar</button></div>`
      :`<label class="drop" id="drop">${ic('upload','lg')}<b style="color:var(--text)">Arrastra tu voucher aquí o elige un archivo</b><small>JPG, PNG o PDF · máximo 5 MB</small><input type="file" id="vFile" accept="image/*,application/pdf" aria-label="Subir voucher"></label>`}
     <div class="form-grid"><label class="field" for="trOp">Número de operación<input class="input num" id="trOp" inputmode="numeric" placeholder="Ej.: 08451237"></label><label class="field" for="trDate">Fecha de la transferencia<input class="input" type="date" id="trDate" value="${iso(TODAY)}" max="${iso(TODAY)}"></label></div></fieldset>
    <div class="err" id="trErr" role="alert"></div>
    <div class="row-b"><button type="button" class="btn" data-act="payBack">${ic('cl','sm')}Atrás</button><button class="btn primary lg" type="submit" id="trSend">${ic('send','sm')}Enviar voucher</button></div></form>`}
  return head+`<div class="pay-l"><section class="card"><div class="card-h"><h2>¿Cómo quieres pagar?</h2></div><div class="card-b" style="display:grid;gap:16px">
   <div class="methods" role="radiogroup" aria-label="Método de pago">${methods.map(([k,l,s,i])=>`<button class="method" role="radio" aria-checked="${m===k}" data-act="method" data-k="${k}"><span class="ico">${ic(i)}</span><span><b>${l}</b><small>${s}</small></span></button>`).join('')}</div>${form}</div></section>${sum}</div>`;
};
function payResult(){
  const r=S.pay.result;if(!r)return `<section class="card">${emptyBox('receipt','No hay un pago en curso','Elige las facturas que quieres pagar.',`<a class="btn" href="#facturas">Ir a facturas</a>`)}</section>`;
  if(r.kind==='transfer')return `<section class="card done-box" aria-live="polite"><span class="big warn">${ic('clock')}</span><h2>Recibimos tu voucher</h2><p>${plural(r.ids.length,'factura quedó','facturas quedaron')} <b>en validación por finanzas</b>. Te confirmaremos por correo a ${esc(CLIENT.billMail)} en un máximo de 24 horas hábiles.</p>
   <dl class="kv" style="text-align:left"><dt>Facturas</dt><dd class="mono">${r.ids.join(', ')}</dd><dt>Monto declarado</dt><dd class="num">${moneyRaw(r.total,r.cur)}</dd><dt>Operación</dt><dd class="num">${esc(r.op)}</dd><dt>Voucher</dt><dd>${esc(r.file)}</dd></dl>
   <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><a class="btn" href="#facturas">Ver mis facturas</a><a class="btn primary" href="#resumen">Volver al inicio</a></div></section>`;
  return `<section class="card done-box" aria-live="polite"><span class="big">${ic('check')}</span><h2>¡Pago realizado!</h2><p>Gracias. Enviamos la constancia a ${esc(CLIENT.billMail)}. Tus servicios siguen activos sin interrupciones.</p>
   <dl class="kv" style="text-align:left"><dt>Constancia</dt><dd class="mono">${r.ref}</dd><dt>Facturas</dt><dd class="mono">${r.ids.join(', ')}</dd><dt>Medio</dt><dd>${esc(r.via)}</dd>${r.fee?`<dt>Comisión PayPal</dt><dd class="num">${moneyRaw(r.fee,r.cur)}</dd>`:''}<dt>Total cobrado</dt><dd class="num">${moneyRaw(r.total,r.cur)}</dd><dt>Fecha</dt><dd class="num">${fD(TODAY)} 10:31</dd></dl>
   <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn" data-act="receiptDl">${ic('download','sm')}Descargar constancia</button><a class="btn primary" href="#resumen">Volver al inicio</a></div></section>`;
}

/* ---- Soporte ---- */
VIEWS.soporte=()=>{
  const f=S.tkTab;const L=TK.filter(t=>f==='abiertos'?isOpenTk(t):f==='cerrados'?!isOpenTk(t):true).sort((a,b)=>b.upd-a.upd);
  const n={abiertos:TK.filter(isOpenTk).length,cerrados:TK.filter(t=>!isOpenTk(t)).length,todos:TK.length};
  return `${crumbs([['Soporte']])}<div class="phead" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end"><div><h1>Soporte</h1><p class="lead">Escríbenos por ticket y te respondemos en horas hábiles. Las urgencias se atienden las 24 horas.</p></div><button class="btn primary" data-act="newTicket">${ic('plus')}Crear ticket</button></div>
  <section class="card"><div class="toolbar"><div class="seg" role="group" aria-label="Filtrar tickets">${[['abiertos','Abiertos'],['cerrados','Resueltos y cerrados'],['todos','Todos']].map(([k,l])=>`<button aria-pressed="${f===k}" data-act="tkTab" data-k="${k}">${l} <span class="num">(${n[k]})</span></button>`).join('')}</div></div>
  ${L.length?L.map(t=>{const s=srvById(t.srv);return `<a class="tk-row" href="#ticket/${t.id}"><div style="min-width:0"><b>${esc(t.subj)}</b><div class="m"><span class="mono">${t.id}</span><span>·</span><span>${s?esc(s.name):'General'}</span><span>·</span>${priTag(t.pri)}</div></div><div class="r">${tkChip(t.st)}<span>Actualizado ${fD(t.upd)}</span></div></a>`}).join('')
   :emptyBox('msg',f==='abiertos'?'No tienes tickets abiertos':'No hay tickets aquí',f==='abiertos'?'Si algo no funciona, crea un ticket y te ayudamos.':'Cuando se resuelvan tus tickets aparecerán aquí.',f==='abiertos'?`<button class="btn" data-act="newTicket">${ic('plus','sm')}Crear ticket</button>`:'')}</section>
  <div class="note" style="margin-top:16px">${ic('bot','sm')}<span>¿Una duda rápida? Prueba el <button class="linkbtn" data-act="chat">asistente automático</button>; si no resuelve tu consulta, te pasa con una persona.</span></div>`;
};
VIEWS.ticket=id=>{
  const t=TK.find(x=>x.id===id);
  if(!t)return `${crumbs([['Soporte','soporte'],['Ticket']])}<section class="card">${emptyBox('msg','No encontramos ese ticket','Puede que el enlace esté incompleto.',`<a class="btn" href="#soporte">Ir a soporte</a>`)}</section>`;
  const s=srvById(t.srv);const open=isOpenTk(t);afterRender=()=>bindReply(t);
  return `${crumbs([['Soporte','soporte'],[t.id]])}<div class="phead"><h1>${esc(t.subj)}</h1><p class="lead"><span class="mono">${t.id}</span> · ${s?esc(s.name):'General'} · abierto el ${fDT(t.created)}</p></div>
  <div class="tk-detail"><section class="card"><div class="card-h"><h2>Conversación</h2>${tkChip(t.st)}</div><div class="card-b"><ol class="thread">${t.msgs.map(m=>`<li class="msg ${m.w==='a'?'agente':'cliente'}"><div class="mh"><span class="av">${ic(m.w==='a'?'shield':'user','sm')}</span><b>${esc(m.n)}</b><time>${fDT(m.t)}</time></div><p>${esc(m.x)}</p>${m.files&&m.files.length?`<div class="atts">${m.files.map(f=>`<span class="chip outline">${ic('paperclip')}${esc(f)}</span>`).join('')}</div>`:''}</li>`).join('')}</ol></div>
   ${open?`<form class="composer" id="replyForm"><label class="field" for="replyTx">Tu respuesta<textarea class="input" id="replyTx" rows="3" placeholder="Escribe tu mensaje…"></textarea></label><div class="atts" id="replyAtts"></div><div class="comp-tools"><label class="btn sm">${ic('paperclip','sm')}Adjuntar<input type="file" multiple id="replyFile" class="sr-only"></label><span style="flex:1"></span><button class="btn primary" type="submit">${ic('send','sm')}Enviar respuesta</button></div><div class="err" id="replyErr" role="alert"></div></form>`
    :`<div class="composer"><div class="note">${ic('check','sm')}<span>Este ticket está ${t.st.toLowerCase()}. Si el problema vuelve, puedes reabrirlo.</span></div></div>`}</section>
   <aside class="stack"><section class="card"><div class="card-h"><h2>Detalles</h2></div><div class="card-b"><dl class="kv"><dt>Estado</dt><dd>${tkChip(t.st)}</dd><dt>Prioridad</dt><dd>${priTag(t.pri)}</dd><dt>Servicio</dt><dd>${s?`<a href="#servicios/${s.id}">${esc(s.name)}</a>`:'General'}</dd><dt>Creado</dt><dd class="num">${fDT(t.created)}</dd><dt>Última actividad</dt><dd class="num">${fDT(t.upd)}</dd></dl></div>
    <div class="card-f">${open?`<button class="btn" data-act="tkResolve" data-id="${t.id}">${ic('check','sm')}Marcar como resuelto</button>`:`<button class="btn" data-act="tkReopen" data-id="${t.id}">${ic('refresh','sm')}Reabrir ticket</button>`}</div></section>
   <div class="note">${ic('info','sm')}<span>Nunca te pediremos contraseñas por ticket. Si necesitamos acceso, te enviaremos un enlace temporal.</span></div></aside></div>`;
};

const PREFS=[['Facturas nuevas y vencimientos',true],['Respuestas de soporte',true],['Mantenimientos programados',true],['Novedades y promociones',false]];
let tkSeq=10483;
function srvOptions(sel){return `<option value="">General / Facturación</option>${PROJ.map(p=>`<optgroup label="${esc(p.name)}">${SRV.filter(s=>s.proj===p.id).map(s=>`<option value="${s.id}"${s.id===sel?' selected':''}>${esc(s.name)} · ${esc(s.host)}</option>`).join('')}</optgroup>`).join('')}`}
function createTicket(o){
  const id='TK-'+(tkSeq++);const t={id,subj:o.subj,srv:o.srv||null,pri:o.pri||'media',st:'Nuevo',created:new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate(),10,32),upd:new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate(),10,32),msgs:[{w:'c',n:ME.name.split(' ').slice(0,2).join(' '),t:new Date(2026,9,8,10,32),x:o.body,files:o.files||[]}]};
  TK.unshift(t);
  setTimeout(()=>{t.msgs.push({w:'a',n:'Asistente de soporte',t:new Date(2026,9,8,10,33),x:`Recibimos tu ticket ${id}. Una persona del equipo lo revisará ${t.pri==='urgente'?'en los próximos 30 minutos':'hoy mismo'}. Te avisaremos por correo cuando respondamos.`});t.st='Nuevo';if(R.name==='ticket'&&R.arg===id)refresh()},900);
  return t;
}
function ticketDlg(pre){
  pre=pre||{};let files=[];
  openModal(`${mHead('Crear ticket','Cuéntanos qué pasa y te ayudamos. Responderemos por aquí y por correo.')}<form id="tkForm" novalidate><div class="modal-b">
   <div class="form-grid"><label class="field full" for="tkSrv">Servicio relacionado<select class="select" id="tkSrv">${srvOptions(pre.srv)}</select></label>
   <label class="field full" for="tkSubj">Asunto<input class="input" id="tkSubj" value="${esc(pre.subj||'')}" placeholder="Ej.: No puedo entrar a mi correo" maxlength="120"></label></div>
   <fieldset class="fset"><legend>Prioridad</legend><div class="seg" role="radiogroup" aria-label="Prioridad">${Object.entries(PRI).map(([k,l])=>`<button type="button" role="radio" aria-checked="${(pre.pri||'media')===k}" aria-pressed="${(pre.pri||'media')===k}" data-pri="${k}">${l}</button>`).join('')}</div><small class="hint" id="priHelp"></small></fieldset>
   <label class="field" for="tkBody">Descripción<textarea class="input" id="tkBody" rows="5" placeholder="¿Qué intentabas hacer? ¿Qué mensaje aparece? ¿Desde cuándo?">${esc(pre.body||'')}</textarea></label>
   <div class="field">Adjuntos (opcional)<label class="drop" style="padding:14px">${ic('paperclip')}<span>Capturas o archivos · se adjuntan de forma simulada</span><input type="file" id="tkFile" multiple aria-label="Adjuntar archivos"></label><ul class="files" id="tkFiles"></ul></div>
   <div class="err" id="tkErr" role="alert"></div></div>
   <div class="modal-f"><button type="button" class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" type="submit">${ic('send','sm')}Enviar ticket</button></div></form>`,{wide:true,focus:pre.subj?'#tkBody':'#tkSubj'});
  let pri=pre.pri||'media';
  const help={baja:'Consulta o cambio sin apuro. Respuesta en 1 día hábil.',media:'Algo no funciona bien pero puedes seguir trabajando. Respuesta en 4 horas hábiles.',alta:'Afecta a tus clientes o ventas. Respuesta en 1 hora.',urgente:'Tu web o correo están caídos. Atención 24/7 en 30 minutos.'};
  const setPri=k=>{pri=k;$$('#tkForm [data-pri]').forEach(b=>{b.setAttribute('aria-checked',b.dataset.pri===k);b.setAttribute('aria-pressed',b.dataset.pri===k)});$('#priHelp').textContent=help[k]};setPri(pri);
  $$('#tkForm [data-pri]').forEach(b=>b.onclick=()=>setPri(b.dataset.pri));
  const drawFiles=()=>{$('#tkFiles').innerHTML=files.map((f,k)=>`<li>${ic('paperclip','sm')}<span>${esc(f.name)}</span><small>${fmtSize(f.size)}</small><button type="button" class="btn sm ghost icon" data-rm="${k}" aria-label="Quitar ${esc(f.name)}">${ic('x','sm')}</button></li>`).join('');$$('#tkFiles [data-rm]').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.rm,1);drawFiles()})};
  $('#tkFile').onchange=e=>{const ok=[...e.target.files].filter(f=>f.size<=10485760);if(ok.length<e.target.files.length)toast('Un archivo supera 10 MB','No se adjuntó.','warn');files=files.concat(ok.map(f=>({name:f.name,size:f.size})));e.target.value='';drawFiles()};
  $('#tkForm').onsubmit=e=>{e.preventDefault();const subj=$('#tkSubj').value.trim(),body=$('#tkBody').value.trim();
    if(subj.length<5){$('#tkErr').textContent='Escribe un asunto de al menos 5 caracteres.';$('#tkSubj').focus();return}
    if(body.length<10){$('#tkErr').textContent='Cuéntanos un poco más en la descripción (mínimo 10 caracteres).';$('#tkBody').focus();return}
    const t=createTicket({subj,body,srv:$('#tkSrv').value,pri,files:files.map(f=>f.name)});closeModal();toast(`Ticket ${t.id} creado`,'Te avisaremos por correo cuando respondamos.');go('ticket/'+t.id)};
}

   <label class="field" for="rsNote">Comentario (opcional)<textarea class="input" id="rsNote" rows="2" placeholder="Ej.: se borró la página de paquetes a Machu Picchu"></textarea></label>

   <div class="modal-f"><button type="button" class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" type="submit">${ic('restore','sm')}Solicitar restauración</button></div></form>`,{wide:true,focus:'input[name=rsKind]:checked'});
  const fill=()=>{kind=$('input[name=rsKind]:checked').value;$('#rsItem').innerHTML=items[kind].map((x,i)=>`<option${src==='wpdb'&&i===1?' selected':''}>${esc(x)}</option>`).join('');$('#rsDate').innerHTML=pts(kind).map((x,i)=>`<option>${x}${i===0?' (más reciente)':''}</option>`).join('')};fill();
  $$('input[name=rsKind]').forEach(r=>r.onchange=()=>{src=null;fill()});
  $('#rsForm').onsubmit=e=>{e.preventDefault();const dest=$('input[name=rsDest]:checked').value;const it=$('#rsItem').value,dt=$('#rsDate').value.replace(' (más reciente)','');
   const go2=()=>{const L={sitio:'sitio web',bd:'base de datos',buzon:'buzón de correo'}[kind];const t=createTicket({subj:`Restauración de ${L}: ${it}`,srv:kind==='buzon'?'mailcorp':kind==='bd'?(it.includes('reservas')?'reservas':'sitio'):'sitio',pri:'alta',body:`Solicitud de restauración desde el portal.\n• Tipo: ${L}\n• Elemento: ${it}\n• Respaldo: ${dt}\n• Destino: ${dest==='copia'?'copia aparte para revisión':'reemplazar lo actual'}${$('#rsNote').value.trim()?`\n• Comentario: ${$('#rsNote').value.trim()}`:''}`});closeModal();toast(`Solicitud enviada · ${t.id}`,'Te avisaremos cuando la restauración esté lista.');go('ticket/'+t.id)};
   if(dest==='reemplazar'){$('#rsErr').innerHTML='';const b=$('#rsForm .modal-f .btn.primary');if(b.dataset.c){go2();return}b.dataset.c='1';b.className='btn danger';b.innerHTML='Sí, reemplazar lo actual';$('#rsErr').textContent='Atención: se perderán los cambios posteriores al '+dt+'. Pulsa de nuevo para confirmar.';return}

/* Contraseña */
function pwScore(p){const r={len:p.length>=10,mix:/[a-z]/.test(p)&&/[A-Z]/.test(p),num:/\d/.test(p),sym:/[^A-Za-z0-9]/.test(p)};let s=0;if(p){s=1;if(r.len)s++;if(r.len&&r.mix&&r.num)s++;if(r.len&&r.mix&&r.num&&(r.sym||p.length>=14))s++}return {r,s}}
function bindPw(){
  const n=$('#pwNew');if(!n)return;
  n.oninput=()=>{const {r,s}=pwScore(n.value);$('#pwMeter').className='meter m'+s;$('#pwLbl').textContent=n.value?['','Muy débil','Débil','Aceptable','Fuerte'][s]:'Escribe una contraseña';
    $$('#pwReqs li').forEach(li=>{const ok=r[li.dataset.r];li.classList.toggle('ok',ok);li.querySelector('svg').outerHTML=ic(ok?'check':'circ')})};
  $('#pwForm').onsubmit=e=>{e.preventDefault();const err=$('#pwErr');const {r}=pwScore(n.value);
    if(!$('#pwCur').value){err.textContent='Escribe tu contraseña actual.';$('#pwCur').focus();return}
    if(!r.len){err.textContent='La nueva contraseña debe tener al menos 10 caracteres.';n.focus();return}
    if(!r.mix||!r.num){err.textContent='Combina mayúsculas, minúsculas y al menos un número.';n.focus();return}
    if(n.value===$('#pwCur').value){err.textContent='La nueva contraseña debe ser distinta a la actual.';n.focus();return}
    if(n.value!==$('#pwRep').value){err.textContent='Las contraseñas no coinciden.';$('#pwRep').focus();return}
    err.textContent='';$('#pwForm').reset();n.oninput();toast('Contraseña actualizada','Cerramos las demás sesiones por seguridad.');SESS.splice(0,SESS.length,...SESS.filter(s=>s.cur));refresh()};
}

/* Segundo factor */
function qrSvg(seedStr){
  let h=2166136261;for(const ch of seedStr){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}
  const rnd=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return ((h>>>0)%1000)/1000};
  const N=25;let cells='';
  const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#0f1b2e"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#0f1b2e"/>`;
  const inF=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(inF(x,y))continue;if((x===6||y===6)&&((x+y)%2===0)){cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;continue}if(rnd()>.52)cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
  return `<svg viewBox="-1 -1 ${N+2} ${N+2}" role="img" aria-label="Código QR de ejemplo para la app de autenticación" shape-rendering="crispEdges"><rect x="-1" y="-1" width="${N+2}" height="${N+2}" fill="#fff"/><g fill="#0f1b2e">${cells}</g>${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}</svg>`;
}

  const ub=e.target.closest('#btnUser');if(ub){togglePop('#popUser','#btnUser');return}
  const a=e.target.closest('[data-act]');
  if(a&&!a.disabled){const f=ACT[a.dataset.act];if(f){if(a.tagName==='A'&&a.dataset.act==='closePops'){closePops();return}if(a.tagName!=='A')e.preventDefault();f(a);return}}
  if(!e.target.closest('.pop')&&!e.target.closest('.anchor'))closePops();
  const link=e.target.closest('a[href^="#"]');if(link&&$('#sheetRoot').classList.contains('open'))closeSheet();
});
document.addEventListener('change',e=>{const a=e.target.closest('input[type=checkbox][data-act]');if(a&&ACT[a.dataset.act]){ACT[a.dataset.act](a)}});
document.addEventListener('click',e=>{const a=e.target.closest('input[type=checkbox][data-act]');if(a)e.stopPropagation()},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('#modalRoot').classList.contains('open')){closeModal();return}
    if($('#sheetRoot').classList.contains('open')){closeSheet();return}
    if($('.pop.open')){const o=$('.pop.open');closePops();(o.id==='popNotif'?$('#btnNotif'):$('#btnUser')).focus();return}
    if(S.chatOpen){closeChat();$('#fab').focus();return}
  }
  if(e.key==='Tab'){if($('#modalRoot').classList.contains('open'))trapFocus(e,$('#modal'));else if($('#sheetRoot').classList.contains('open'))trapFocus(e,$('#sheet'))}
  if((e.key===' '||e.key==='Enter')&&e.target.matches('[role=switch]')){/* botón nativo */}
});
$('#selCur').addEventListener('change',e=>{S.cur=e.target.value;lsSet('ap.portal.cur',S.cur);refresh();toast(`Mostrando importes en ${S.cur==='PEN'?'soles (S/)':'dólares (US$)'}`,`Tipo de cambio referencial: S/ ${NF2.format(TC)}`,'info')});
$('#fab').innerHTML=`${ic('bot')}<span>¿Te ayudo?</span>`;
$('#fab').addEventListener('click',()=>S.chatOpen?closeChat():openChat());
window.addEventListener('hashchange',onRoute);

/* Arranque */
const th=lsGet('ap.portal.theme');if(th==='dark'||th==='light')document.documentElement.setAttribute('data-theme',th);
const cu=lsGet('ap.portal.cur');if(cu==='PEN'||cu==='USD')S.cur=cu;
R.name='';renderTop();onRoute();
})();
</script>
