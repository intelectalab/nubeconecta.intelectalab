    post:
      tags:
        - "Portal"
      operationId: "portalConfirmCardPayment"
      summary: "Retorno desde Mercado Pago: el backend consulta el pago a la API de MP"
      description: "Recibe `payment_id` (o `collection_id`) de la URL de retorno y consulta GET /v1/payments/{id}; nunca confía en los demás parámetros. Aprobado con external_reference, importe y moneda coincidentes → pago validado (medio card_gateway) aplicado al comprobante. Rechazado o pendiente → solo el intento. Idempotente: el mismo pago de MP nunca se registra dos veces. Sin payment_id devuelve el estado actual. external_reference de otro intento o id inexistente en MP → 404 not_found (misma respuesta en ambos casos). Límite 10/min por usuario."
      x-permission: "portal.payment.view"
      x-throttle: "30 por minuto"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                payment_id:
                  type: "string"
                  pattern: "^[0-9]{1,20}$"
                collection_id:
                  type: "string"
                  pattern: "^[0-9]{1,20}$"
      responses:
        "200":
          description: "Estado del intento tras consultar a Mercado Pago."
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "data"
                properties:
                  data:
                    $ref: "#/components/schemas/CardCheckout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          description: "Mercado Pago no respondió o rechazó la solicitud (`gateway_error`, `gateway_unavailable`, `gateway_misconfigured`)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /webhooks/mercadopago:
    post:
      tags:
        - "Billing"
      operationId: "webhookMercadoPago"
      summary: "Webhook de Mercado Pago (pagos)"
      description: "Público, sin sesión. Valida `x-signature` (ts, v1): HMAC-SHA256 hex con MP_WEBHOOK_SECRET sobre `id:{data.id};request-id:{x-request-id};ts:{ts};` y ventana de MP_WEBHOOK_TOLERANCE_SECONDS (300 s). Firma inválida o vieja → 401 invalid_signature. Guarda el evento en webhook_events (único por id) y consulta el pago a la API de MP: mismo efecto que el retorno del portal, idempotente. Tópicos distintos de `payment` o referencia ajena → 200 ignored. Error de la API de MP → 502 (MP reintenta). Sin llaves → 503."
      security: []
      x-throttle: "120 por minuto por IP"
      parameters:
        - name: "data.id"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "type"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "x-signature"
          in: "header"
          required: true
          schema:
            type: "string"
            example: "ts=1704908010,v1=618c85345248dd820d5fd456117c2ab2ef8eda45a0282ff693eac24131a5e839"
        - name: "x-request-id"
          in: "header"
          required: false
          schema:
            type: "string"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                id:
                  type: "integer"
                type:
                  type: "string"
                action:
                  type: "string"
                live_mode:
                  type: "boolean"
                data:
                  type: "object"
                  properties:
                    id:
                      type: "string"
      responses:
        "200":
          description: "Recibido."
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  status:
                    type: "string"
                    enum:
                      - "processed"
                      - "ignored"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          description: "Mercado Pago no respondió o rechazó la solicitud (`gateway_error`, `gateway_unavailable`, `gateway_misconfigured`)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "Pago con tarjeta no configurado (`card_gateway_disabled`)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: "Sanctum modo SPA: `GET /sanctum/csrf-cookie` (fuera de `/api/v1`), luego `POST /auth/login`. Cookie de sesión HttpOnly más cabecera `X-XSRF-TOKEN` (valor de la cookie `XSRF-TOKEN`) en toda petición que modifica datos."
    bearerAuth:
      type: http
      scheme: bearer
      description: Token personal de Sanctum.
    wpSiteToken:
      type: http
      scheme: bearer
      description: "Token de solo lectura del sitio (`wp_site_tokens`, solo hash). Solo en `/public/wp/*`; con `X-Hub-Plugin-Version`. Revocado, vencido o desconocido: 401."
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Opcional. Una repetición con la misma clave devuelve la respuesta original (middleware `idempotency:optional`).
      schema:
        type: string
        maxLength: 255
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Obligatoria (middleware `idempotency`); falta → 400. Una repetición con la misma clave y cuerpo devuelve la respuesta original.
      schema:
        type: string
        maxLength: 255
    WpSiteId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HubPluginVersion:
      name: X-Hub-Plugin-Version
      in: header
      required: true
      description: "Versión semántica del plugin; menor que `web_connector.min_plugin_version` (o ausente): 426."
      schema:
        type: string
        example: 1.2.0
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    WpCurrency:
      name: currency
      in: query
      schema:
        type: string
        enum:
          - PEN
          - USD
        default: PEN
    WpLang:
      name: lang
      in: query
      schema:
        type: string
        default: es
  headers:
    ETag:
      schema:
        type: string
    WpCacheControl:
      description: "`private, max-age=<web_connector.cache_ttl_seconds>`"
      schema:
        type: string
  responses:
    WpUnauthorized:
      description: 401 Token del sitio inválido, vencido o revocado (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    WpUpgradeRequired:
      description: 426 Plugin desactualizado (`plugin_upgrade_required`, con `min_plugin_version`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: 400 Petición inválida (p. ej. `page[cursor]` o `sort` no admitidos).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: 401 Sin sesión válida (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: 403 Sin permiso, tipo de usuario no permitido o MFA reciente requerido (`mfa_required`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: 404 Recurso no encontrado (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "409 Conflicto: `version_conflict`, `conflict` (unicidad o recurso en uso), `system_role_protected`, `admin_role_protected` (el rol admin no pierde sus permisos mínimos ni se queda sin usuarios activos), `series_in_use`, `duplicate_customer`, `possible_duplicate`, `already_merged`, `customer_has_obligations`, `system_category_protected`, `product_in_use`, `plan_in_use`, `price_overlap`, `price_in_effect`, `invalid_transition`, `tax_rate_missing`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: 422 Validación fallida (`validation_failed`) con `errors` por campo.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: 429 Límite de peticiones excedido (`rate_limited`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos de espera.
  schemas:
    Problem:
      type: object
      description: Error `application/problem+json` (RFC 9457) con extensiones `code`, `errors` y `request_id`.
      required:
        - type
        - title
        - status
        - code
        - request_id
      properties:
        type:
          type: string
          format: uri
          description: "`<HUB_PROBLEM_BASE_URI>/<code con guiones>`."
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: "Código estable: bad_request, unauthenticated, forbidden, not_found, conflict, version_conflict, system_role_protected, series_in_use, validation_failed, rate_limited, csrf_token_mismatch (419), server_error, mfa_required…"
        detail:
          type: string
        errors:
          type: object
          description: "Solo en 422: campo => lista de mensajes."
          additionalProperties:
            type: array
            items:
              type: string
        request_id:
          type: string
          description: ULID de la petición.
      additionalProperties: true
    CursorMeta:
      type: object
      required:
        - next_cursor
        - prev_cursor
        - has_more
        - page_size
      properties:
        next_cursor:
          type:
            - string
            - "null"
        prev_cursor:
          type:
            - string
            - "null"
        has_more:
          type: boolean
        page_size:
          type: integer
    CursorLinks:
      type: object
      required:
        - next
        - prev
      properties:
        next:
          type:
            - string
            - "null"
          format: uri
        prev:
          type:
            - string
            - "null"
          format: uri
    Health:
      type: object
      required:
        - status
        - app
        - checks
        - time
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        app:
          type: object
          properties:
            status:
              type: string
              enum:
                - up
            name:
              type: string
            env:
              type: string
            laravel:
              type: string
        checks:
          type: object
          properties:
            database:
              $ref: "#/components/schemas/HealthCheck"
            redis:
              $ref: "#/components/schemas/HealthCheck"
        time:
          type: string
          format: date-time
    HealthCheck:
      type: object
      required:
        - status
        - latency_ms
      properties:
        status:
          type: string
          enum:
            - up
            - down
        latency_ms:
          type: integer
        driver:
          type: string
        client:
          type: string
        error:
          type: string
          description: Solo con APP_DEBUG=true.
    LoginResult:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: object
              required:
                - mfa_required
                - methods
              properties:
                mfa_required:
                  const: true
                methods:
                  type: array
                  items:
                    type: string
                    description: "`mfa_method` del usuario y `recovery`."
            - type: object
              required:
                - mfa_required
                - user
              properties:
                mfa_required:
                  const: false
                user:
                  $ref: "#/components/schemas/Me"
    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required:
            - permissions
            - mfa
            - password
          properties:
            permissions:
              type: array
              items:
                type: string
            mfa:
              type: object
              properties:
                enabled:
                  type: boolean
                method:
                  type:
                    - string
                    - "null"
                required:
                  type: boolean
                enrollment_required:
                  type: boolean
            password:
              type: object
              properties:
                change_required:
                  type: boolean
    PasswordPolicy:
      type: object
      properties:
        min_length:
          type: integer
        complexity:
