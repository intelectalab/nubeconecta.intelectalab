        timezone:
          type: string
        mfa_enabled:
          type: boolean
        mfa_method:
          type:
            - string
            - "null"
        must_change_password:
          type: boolean
        locked_until:
          type:
            - string
            - "null"
          format: date-time
        last_login_at:
          type:
            - string
            - "null"
          format: date-time
        disabled_at:
