        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Settings
      operationId: adminSettingsPut
      summary: Fijar el valor de un ajuste en un nivel
      description: "Escritura: `settings.setting.update` o `settings.dunning.update` según la clave (validado en el servicio, no en la ruta)."
      x-permission-note: "Escritura: `settings.setting.update` o `settings.dunning.update` según la clave (validado en el servicio, no en la ruta)."
      parameters:
        - name: key
          in: path
          required: true
          description: Clave con puntos, p. ej. `billing.tax.igv_rate`.
          schema:
            type: string
            pattern: ^[a-z0-9_]+(\.[a-z0-9_]+)+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - scope_type
                - value
              properties:
                scope_type:
                  $ref: "#/components/schemas/SettingScope"
                scope_id:
                  type: string
                  description: Id del ámbito; null para `global`.
                value:
                  description: Valor JSON; debe cumplir el tipo del ajuste.
                version:
                  type: integer
                  description: Versión vigente de la sobrescritura, para control de concurrencia.
                reason:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: Valor resuelto y id del cambio.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/SettingResolved"
                      - type: object
                        properties:
                          change_id:
                            type: string
                            format: uuid
