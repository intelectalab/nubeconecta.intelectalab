                  format: "uuid"
                original_name:
                  type: "string"
                mime_type:
                  type: "string"
                size_bytes:
                  type: "integer"
                scan_status:
                  type: "string"
    PaymentInput:
      type: "object"
      required:
        - "customer_id"
        - "payment_method_id"
        - "amount_minor"
        - "currency"
      properties:
        customer_id:
          type: "string"
          format: "uuid"
        payment_method_id:
          type: "string"
          format: "uuid"
        amount_minor:
          type: "integer"
          minimum: 1
        currency:
          type: "string"
          enum:
            - "PEN"
            - "USD"
        received_at:
          type: "string"
          format: "date"
        external_id:
          type: "string"
          maxLength: 120
          description: "Referencia / número de operación."
        notes:
          type: "string"
          maxLength: 1000
        validate:
          type: "boolean"
          default: false
          description: "Guardar y validar (billing.payment.validate)."
        allocations:
          type: "array"
          maxItems: 50
          items:
            type: "object"
            required:
              - "invoice_id"
              - "amount_minor"
            properties:
              invoice_id:
                type: "string"
                format: "uuid"
              amount_minor:
                type: "integer"
                minimum: 1
    PaymentValidateInput:
      type: "object"
      properties:
        allocations:
          type: "array"
          maxItems: 50
          items:
            type: "object"
            required:
              - "invoice_id"
              - "amount_minor"
            properties:
              invoice_id:
                type: "string"
                format: "uuid"
              amount_minor:
                type: "integer"
                minimum: 1
        version:
