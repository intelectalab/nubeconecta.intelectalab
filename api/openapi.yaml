# Generado a partir del código implementado el 2026-10-21 porque el paquete api original
# (api/openapi.yaml del kit) no estaba disponible. Cubre solo los módulos implementados:
# Health, Auth, Identity, Settings y Brands. Contrato y convenciones: docs/06-api.md.

openapi: 3.1.0
info:
  title: Hub API
  version: 0.1.0
  description: |-
    API REST de la plataforma (nombre de trabajo `hub`). Cubre solo los módulos implementados: Health, Auth, Identity, Settings y Brands. Contrato completo y convenciones en `docs/06-api.md`.

    Respuestas `{data, meta, links}`; listados con paginación por cursor; errores `application/problem+json` (RFC 9457); `PATCH` exige `version` (409 `version_conflict`).
servers:
  - url: /api/v1
    description: Base relativa de la API
tags:
  - name: Health
    description: Estado del servicio.
  - name: Auth
    description: Inicio de sesión, MFA y contraseña (compartido por panel y portal).
  - name: Identity
    description: Usuarios, roles y permisos (M-IDN).
  - name: Settings
    description: Ajustes, historial, feriados y horario laboral (M-CFG).
  - name: Brands
    description: Marcas, entidades emisoras, cuentas bancarias, series de comprobantes y temas (M-BRD).
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /health:
    get:
      tags:
        - Health
      operationId: health
      summary: Estado de la aplicación y de sus dependencias
      description: "Comprueba base de datos y Redis. Nunca lanza excepción: responde 200 (`ok`) o 503 (`degraded`). El detalle del error solo aparece con APP_DEBUG=true."
      security: []
      responses:
        "200":
          description: Todas las dependencias responden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Alguna dependencia no responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/login:
    post:
      tags:
        - Auth
      operationId: authLogin
      summary: "Iniciar sesión (paso 1: credenciales)"
      description: "Sanctum modo SPA: antes pedir `GET /sanctum/csrf-cookie` (fuera de `/api/v1`) y enviar `X-XSRF-TOKEN`. Si el usuario tiene MFA responde `mfa_required=true` y se completa con `POST /auth/mfa/verify`."
      x-throttle: identity-login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                password:
                  type: string
                  maxLength: 1024
                  format: password
      responses:
        "200":
          description: Sesión iniciada o MFA pendiente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/mfa/verify:
    post:
      tags:
        - Auth
      operationId: authMfaVerify
      summary: "Iniciar sesión (paso 2: verificar MFA)"
      description: Requiere el login previo en la misma sesión; el paso pendiente vence según `hub.auth.mfa_pending_minutes`. Un código inválido responde 422 con error en `code`.
      x-throttle: identity-login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - method
                - code
              properties:
                method:
                  type: string
                  enum:
                    - totp
                    - recovery
                code:
                  type: string
                  maxLength: 64
      responses:
        "200":
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      tags:
        - Auth
      operationId: authLogout
      summary: Cerrar la sesión actual
      responses:
        "204":
          description: Sin contenido.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me:
    get:
      tags:
        - Auth
      operationId: authMe
      summary: Usuario autenticado con permisos, MFA y política de contraseña
      responses:
        "200":
          description: Usuario actual.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/password-policy:
    get:
      tags:
        - Auth
      operationId: authPasswordPolicy
      summary: Reglas vigentes de contraseña
      responses:
        "200":
          description: Política.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/PasswordPolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/password/change:
    post:
      tags:
        - Auth
      operationId: authPasswordChange
      summary: Cambiar la contraseña propia
      x-throttle: identity-mfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - password
                - password_confirmation
              properties:
                current_password:
                  type: string
                  maxLength: 1024
                  format: password
                password:
                  type: string
                  maxLength: 1024
                  format: password
                  description: Debe cumplir `GET /auth/password-policy`.
                password_confirmation:
                  type: string
                  format: password
                  description: Debe coincidir con `password` (regla `confirmed`).
      responses:
        "204":
          description: Sin contenido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/mfa/totp:
    post:
      tags:
        - Auth
      operationId: authMfaTotpStart
      summary: Iniciar el alta de TOTP
      description: Genera el secreto y la URI `otpauth`; se confirma con `POST /auth/mfa/totp/confirm`. 403 si el TOTP está desactivado por política; 409 si el usuario ya tiene MFA.
      responses:
        "200":
          description: Secreto de enrolamiento.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - secret
                      - otpauth_uri
                    properties:
                      secret:
                        type: string
                      otpauth_uri:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags:
        - Auth
      operationId: authMfaTotpDisable
      summary: Desactivar el TOTP
      description: Exige MFA reciente (middleware `mfa.recent`). 403 si la política exige segundo factor; 409 si no está activo.
      x-requires-recent-mfa: true
      responses:
        "204":
          description: Sin contenido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/mfa/totp/confirm:
    post:
      tags:
        - Auth
      operationId: authMfaTotpConfirm
      summary: Confirmar el alta de TOTP
      x-throttle: identity-mfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  maxLength: 16
      responses:
        "201":
          description: TOTP activado; se devuelven los códigos de recuperación (única vez).
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - mfa_method
                      - recovery_codes
                    properties:
                      mfa_method:
                        type: string
                        enum:
                          - totp
                      recovery_codes:
                        type: array
                        items:
                          type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/mfa/step-up:
    post:
      tags:
        - Auth
      operationId: authMfaStepUp
      summary: Renovar la verificación MFA reciente (step-up)
      x-throttle: identity-login, identity-mfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  maxLength: 16
      responses:
        "200":
          description: MFA verificado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - mfa_verified_at
                    properties:
                      mfa_verified_at:
                        type: string
                        format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/users:
    get:
      tags:
        - Identity
      operationId: adminUsersIndex
      summary: Listar usuarios
      description: "Ordenable por: created_at, name, email, last_login_at."
      x-permission: identity.user.view
      parameters:
        - name: sort
          in: query
          description: "Campos separados por coma; `-` delante es descendente. Por defecto: `-created_at`."
          schema:
            type: string
          example: -created_at
        - name: page[size]
          in: query
          description: Tamaño de página (25 por defecto, 100 máximo).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: page[cursor]
          in: query
          description: Cursor opaco devuelto en `meta.next_cursor` / `meta.prev_cursor`.
          schema:
            type: string
        - name: filter
          in: query
          description: Filtros `filter[campo]=valor` (deepObject).
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              type:
                type: string
                enum:
                  - staff
                  - customer
              status:
                type: string
              q:
                type: string
                description: Búsqueda parcial por nombre o correo.
      responses:
        "200":
          description: Página de usuarios.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                  - links
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  meta:
                    $ref: "#/components/schemas/CursorMeta"
                  links:
                    $ref: "#/components/schemas/CursorLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Identity
      operationId: adminUsersStore
      summary: Crear usuario
      x-permission: identity.user.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Usuario creado (queda con `must_change_password=true`).
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /admin/users/{user}:
    get:
      tags:
        - Identity
      operationId: adminUsersShow
      summary: Detalle de usuario
      x-permission: identity.user.view
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Id del usuario.
      responses:
        "200":
          description: Usuario.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Identity
      operationId: adminUsersUpdate
      summary: Actualizar usuario
      x-permission: identity.user.update
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Id del usuario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags:
        - Identity
      operationId: adminUsersDestroy
      summary: Eliminar usuario
      description: Revoca sus sesiones. 409 si es el propio usuario.
      x-permission: identity.user.delete
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Id del usuario.
      responses:
        "204":
          description: Sin contenido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/users/{user}/disable:
    post:
      tags:
        - Identity
      operationId: adminUsersDisable
      summary: Deshabilitar usuario
      description: Revoca todas sus sesiones. 409 si es el propio usuario.
      x-permission: identity.user.update
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Id del usuario.
      responses:
        "200":
          description: Usuario deshabilitado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/users/{user}/enable:
    post:
      tags:
        - Identity
      operationId: adminUsersEnable
      summary: Habilitar usuario
      description: Limpia bloqueo e intentos fallidos.
      x-permission: identity.user.update
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Id del usuario.
      responses:
        "200":
          description: Usuario habilitado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/users/{user}/roles:
    put:
      tags:
        - Identity
      operationId: adminUsersRoles
      summary: Reemplazar los roles de un usuario
      description: Los roles deben ser de la misma audiencia que el usuario; protegido contra escalada de privilegios.
      x-permission: identity.user.update
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Id del usuario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roles
              properties:
                roles:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                    properties:
                      id:
                        type: string
                        format: uuid
                      expires_at:
                        type: string
                        format: date-time
                        description: Posterior a ahora; null = sin vencimiento.
      responses:
        "200":
          description: Usuario con roles.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /admin/roles:
    get:
      tags:
        - Identity
      operationId: adminRolesIndex
      summary: Listar roles
      description: "Ordenable por: code, name, created_at."
      x-permission: identity.role.view
      parameters:
        - name: sort
          in: query
          description: "Campos separados por coma; `-` delante es descendente. Por defecto: `code`."
          schema:
            type: string
          example: code
        - name: page[size]
          in: query
          description: Tamaño de página (25 por defecto, 100 máximo).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: page[cursor]
          in: query
          description: Cursor opaco devuelto en `meta.next_cursor` / `meta.prev_cursor`.
          schema:
            type: string
        - name: filter
          in: query
          description: Filtros `filter[campo]=valor` (deepObject).
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              audience:
                type: string
                enum:
                  - staff
                  - customer
      responses:
        "200":
          description: Página de roles.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                  - links
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
                  meta:
                    $ref: "#/components/schemas/CursorMeta"
                  links:
                    $ref: "#/components/schemas/CursorLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Identity
      operationId: adminRolesStore
      summary: Crear rol
      x-permission: identity.role.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Rol creado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /admin/roles/{role}:
    get:
      tags:
        - Identity
      operationId: adminRolesShow
      summary: Detalle de rol con permisos
      x-permission: identity.role.view
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Id del rol.
      responses:
        "200":
          description: Rol.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Identity
      operationId: adminRolesUpdate
      summary: Actualizar rol
      description: Cambiar el `code` de un rol del sistema responde 409 `system_role_protected`.
      x-permission: identity.role.update
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Id del rol.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
              properties:
                version:
                  type: integer
                code:
                  type: string
                  pattern: ^[a-z][a-z0-9_]{1,62}$
                name:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: Rol actualizado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags:
        - Identity
      operationId: adminRolesDestroy
      summary: Eliminar rol
      description: 409 si es rol del sistema (`system_role_protected`) o tiene usuarios asignados.
      x-permission: identity.role.delete
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Id del rol.
      responses:
        "204":
          description: Sin contenido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admin/roles/{role}/copy:
    post:
      tags:
        - Identity
      operationId: adminRolesCopy
      summary: Copiar un rol con sus permisos
      x-permission: identity.role.create
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Id del rol.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - name
              properties:
                code:
                  type: string
                  pattern: ^[a-z][a-z0-9_]{1,62}$
                name:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 2000
      responses:
        "201":
          description: Rol copiado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /admin/roles/{role}/permissions:
    put:
      tags:
        - Identity
