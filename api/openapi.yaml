      x-permission: settings.setting.view
      parameters:
        - name: key
          in: path
          required: true
          description: Clave con puntos, p. ej. `billing.tax.igv_rate`.
          schema:
            type: string
            pattern: ^[a-z0-9_]+(\.[a-z0-9_]+)+$
