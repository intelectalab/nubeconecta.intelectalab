  /public/wp/forms/{code}/submissions:
    post:
      tags:
        - WebConnector
      operationId: wpSubmitWebForm
      summary: Enviar un formulario de contacto o cotización (modo reenvío del plugin)
      description: "El plugin reenvía desde el servidor de WordPress lo que escribió el visitante, sin guardarlo (docs/13 §9, modo `relay`). Límite por IP del visitante (`X-Hub-Visitor-Ip`, se guarda solo su HMAC) según `web_connector.forms.submissions_per_ip_per_hour`; misma `Idempotency-Key` devuelve el mismo envío. Con el campo trampa `website` lleno se guarda como `spam` y responde igual. Emite `WebFormSubmitted` (no en spam). Captcha: gancho sin proveedor (D-24)."
      x-throttle: 120 por minuto y token; web_connector.forms.submissions_per_ip_per_hour por IP del visitante
      security:
        - wpSiteToken: []
      parameters:
        - $ref: "#/components/parameters/HubPluginVersion"
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        - name: Idempotency-Key
          in: header
          description: Generada en el navegador por intento de envío; sin ella el sistema genera una.
          schema:
            type: string
            pattern: "^[A-Za-z0-9_.:-]{8,200}$"
        - name: X-Hub-Visitor-Ip
          in: header
          description: IP del visitante; si falta o no es válida se usa la del servidor de WordPress.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WpWebFormSubmissionInput"
      responses:
        "202":
          description: Envío recibido.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [received]
                      message:
                        type: [string, 'null']
                      redirect_url:
                        type: [string, 'null']
        "401":
          $ref: "#/components/responses/WpUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "426":
          $ref: "#/components/responses/WpUpgradeRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /admin/customers:
