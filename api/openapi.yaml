        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/web-connector/sites/{id}/webhook-secret:
    parameters:
      - $ref: "#/components/parameters/WpSiteId"
    post:
      tags:
        - WebConnector
      operationId: rotateWpSiteWebhookSecret
      summary: Generar o rotar el secreto de firma del webhook
      description: "El secreto se muestra una sola vez (`Cache-Control: no-store`) y se guarda cifrado en la bóveda (`secrets`, owner_type wp_site). El anterior vence a los `web_connector.webhook.secret_overlap_minutes`. Exige MFA reciente."
      x-permission: web_connector.site.update
      responses:
        "201":
          description: Secreto nuevo.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - webhook_secret
                    properties:
                      webhook_secret:
                        type: string
                        pattern: ^[a-f0-9]{64}$
                      previous_secret_valid_until:
                        type:
                          - string
                          - "null"
                        format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/web-connector/sites/{id}/test-webhook:
    parameters:
      - $ref: "#/components/parameters/WpSiteId"
    post:
      tags:
        - WebConnector
      operationId: testWpSiteWebhook
      summary: Probar el webhook (aviso `all` firmado, un intento)
      description: Responde 200 con el aviso registrado; `status` es `delivered` o `failed` con `response_status` y `last_error`.
      x-permission: web_connector.site.update
      responses:
        "200":
          description: Resultado de la prueba.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WpCacheInvalidationEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /admin/web-connector/sites/{id}/activate:
    parameters:
      - $ref: "#/components/parameters/WpSiteId"
    post:
      tags:
        - WebConnector
      operationId: activateWpSite
      summary: Activar un sitio
      description: "Exige ruta del plugin, secreto, token vigente y una prueba entregada con el secreto vigente (si no, 422)."
      x-permission: web_connector.site.update
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
              properties:
                version:
                  type: integer
      responses:
        "200":
          description: Activo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WpSiteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /admin/web-connector/sites/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/WpSiteId"
    post:
      tags:
        - WebConnector
      operationId: disableWpSite
      summary: Desactivar un sitio (con motivo)
      x-permission: web_connector.site.update
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - version
