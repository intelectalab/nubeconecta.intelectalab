        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
        - WebConnector
      operationId: revokeWpSiteToken
      summary: Revocar un token (con motivo, sin vuelta atrás)
      x-permission: web_connector.site_token.delete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        "204":
          description: Revocado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
