  /admin/web-connector/sites:
    get:
      tags:
        - WebConnector
      operationId: listWpSites
      summary: Listar sitios WordPress conectados
      description: "Ordenable por: name, created_at, last_seen_at. Filtros `filter[brand_id]`, `filter[status]`."
      x-permission: web_connector.site.view
      parameters:
        - name: sort
          in: query
          schema:
            type: string
        - name: page[size]
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: page[cursor]
          in: query
          schema:
            type: string
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              brand_id:
                type: string
                format: uuid
              status:
                type: string
                enum:
                  - pending
                  - active
                  - disabled
      responses:
        "200":
          description: Página.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                  - links
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WpSite"
                  meta:
                    $ref: "#/components/schemas/CursorMeta"
                  links:
                    $ref: "#/components/schemas/CursorLinks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - WebConnector
      operationId: createWpSite
      summary: Registrar un sitio WordPress (queda pending)
      x-permission: web_connector.site.create
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WpSiteInput"
      responses:
        "201":
          description: Creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WpSiteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /admin/web-connector/sites/{id}:
    parameters:
      - $ref: "#/components/parameters/WpSiteId"
    get:
      tags:
        - WebConnector
      operationId: getWpSite
      summary: Detalle de un sitio
      x-permission: web_connector.site.view
      responses:
        "200":
          description: Sitio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WpSiteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - WebConnector
      operationId: updateWpSite
      summary: Editar un sitio
      description: "El estado no se edita aquí: usa activate/disable. Un sitio activo no puede quedar sin `webhook_url`."
      x-permission: web_connector.site.update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WpSiteUpdate"
      responses:
        "200":
          description: Actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WpSiteEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags:
        - WebConnector
      operationId: deleteWpSite
      summary: Dar de baja un sitio (revoca sus tokens y cancela avisos pendientes)
      x-permission: web_connector.site.delete
      responses:
        "204":
