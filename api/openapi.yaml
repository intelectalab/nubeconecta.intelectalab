        issued_at:
          type:
            - string
            - "null"
          format: date-time
        voided_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
    Invoice:
      allOf:
        - $ref: "#/components/schemas/PortalInvoice"
        - type: object
          properties:
            customer:
              type:
                - object
                - "null"
            origin:
              type: object
              description: "type = order | renewal."
              properties:
                type:
                  type:
                    - string
                    - "null"
                order_id:
                  type:
                    - string
                    - "null"
                  format: uuid
                subscription_id:
                  type:
                    - string
                    - "null"
                  format: uuid
            void_reason:
              type:
                - string
                - "null"
            notes:
              type:
                - string
                - "null"
    InvoiceIssueInput:
      type: object
      properties:
        version:
          type: integer
    InvoiceVoidInput:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
        version:
          type: integer
    PaymentMethodOption:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        code:
          type: "string"
        name:
          type: "string"
        kind:
          type: "string"
          enum:
            - "bank_transfer"
            - "paypal"
            - "global66"
            - "card_gateway"
            - "other"
        requires_proof:
          type: "boolean"
        available_in_portal:
          type: "boolean"
        instructions:
          type: "object"
    CardCheckout:
      type: object
      description: "Intento de pago con tarjeta (payment_checkouts). `status` pending = Mercado Pago lo tiene en proceso."
      required:
        - id
        - status
        - amount_minor
        - currency
      properties:
        id:
          type: string
          format: uuid
        invoice_id:
          type:
            - string
            - "null"
          format: uuid
        status:
          type: string
          enum:
            - created
            - pending
            - approved
            - declined
            - expired
            - cancelled
        provider:
          type: string
          enum:
            - mercadopago
        amount_minor:
          type: integer
        surcharge_minor:
          type: integer
        currency:
          type: string
          enum:
            - PEN
            - USD
        payment_id:
          type:
            - string
            - "null"
          format: uuid
        message:
          type:
            - string
            - "null"
          description: Motivo de rechazo en español.
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        redirect_url:
          type: string
          format: uri
          description: Solo al crear.
    PortalPayment:
      type: "object"
      description: "Pago o voucher en el portal: sin notas internas ni usuarios."
      properties:
        id:
          type: "string"
          format: "uuid"
        customer_id:
          type: "string"
          format: "uuid"
        status:
          type: "string"
          enum:
            - "reported"
            - "validated"
            - "rejected"
            - "refunded"
            - "charged_back"
        voided:
          type: "boolean"
          description: "Validado y luego anulado."
        payment_method:
          type:
            - "object"
            - "null"
          properties:
            id:
              type: "string"
              format: "uuid"
            code:
              type: "string"
            name:
              type: "string"
            kind:
              type: "string"
        amount_minor:
          type: "integer"
        currency:
          type: "string"
          enum:
            - "PEN"
            - "USD"
        allocated_minor:
          type: "integer"
        external_id:
          type:
            - "string"
            - "null"
        reported_via:
          type: "string"
        received_at:
          type:
            - "string"
            - "null"
          format: "date-time"
        validated_at:
          type:
            - "string"
            - "null"
          format: "date-time"
        rejection_reason:
          type:
            - "string"
            - "null"
        has_proof:
          type: "boolean"
        allocations:
          type: "array"
          items:
            type: "object"
            properties:
              invoice_id:
                type: "string"
                format: "uuid"
              invoice_number:
                type:
                  - "string"
                  - "null"
              amount_minor:
                type: "integer"
              invoice_balance_minor:
                type:
                  - "integer"
                  - "null"
              invoice_status:
                type:
                  - "string"
                  - "null"
        created_at:
          type:
            - "string"
            - "null"
          format: "date-time"
        updated_at:
          type:
            - "string"
            - "null"
          format: "date-time"
        version:
          type: "integer"
    Payment:
      allOf:
        - $ref: "#/components/schemas/PortalPayment"
        - type: "object"
          properties:
            customer:
              type:
                - "object"
                - "null"
            reported_by:
              type:
                - "string"
                - "null"
              format: "uuid"
            validated_by:
              type:
                - "string"
                - "null"
              format: "uuid"
            notes:
              type:
                - "string"
                - "null"
            proof:
              type:
                - "object"
                - "null"
              properties:
                id:
