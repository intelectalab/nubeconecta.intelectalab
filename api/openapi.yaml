        - Brands
      operationId: publicBrandThemesShow
      summary: Tema publicado de una marca
      description: "Para el portal y el carrito. `Cache-Control: public, max-age=60`."
      x-throttle: 60 por minuto
      security: []
      parameters:
        - name: brand
