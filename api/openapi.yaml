    parameters:
      - $ref: "#/components/parameters/WpSiteId"
    get:
      tags:
        - WebConnector
      operationId: listWpSiteTokens
      summary: Tokens del sitio (sin valor ni hash)
      x-permission: web_connector.site_token.view
      responses:
        "200":
          description: Página.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                  - links
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/WpSiteToken"
                  meta:
                    $ref: "#/components/schemas/CursorMeta"
                  links:
                    $ref: "#/components/schemas/CursorLinks"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags:
        - WebConnector
      operationId: createWpSiteToken
      summary: Crear un token de solo lectura (se muestra una vez)
      description: "Vence a los `web_connector.token_expiry_days`. Permiso sensible: exige MFA reciente."
      x-permission: web_connector.site_token.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 120
      responses:
        "201":
          description: Token creado; `token` solo aparece aquí.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/WpSiteToken"
                      - type: object
                        required:
                          - token
                        properties:
                          token:
                            type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
