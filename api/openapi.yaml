        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags:
        - Settings
      operationId: adminSettingsDestroy
      summary: Quitar la sobrescritura de un ajuste en un nivel
      description: "Escritura: `settings.setting.update` o `settings.dunning.update` según la clave (validado en el servicio, no en la ruta). Los parámetros van en el cuerpo JSON."
      x-permission-note: "Escritura: `settings.setting.update` o `settings.dunning.update` según la clave (validado en el servicio, no en la ruta)."
      parameters:
        - name: key
          in: path
          required: true
          description: Clave con puntos, p. ej. `billing.tax.igv_rate`.
          schema:
            type: string
            pattern: ^[a-z0-9_]+(\.[a-z0-9_]+)+$
      requestBody:
        required: true
