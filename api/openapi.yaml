                  data:
                    $ref: "#/components/schemas/PublicBrandThemePreview"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: "Sanctum modo SPA: `GET /sanctum/csrf-cookie` (fuera de `/api/v1`), luego `POST /auth/login`. Cookie de sesión HttpOnly más cabecera `X-XSRF-TOKEN` (valor de la cookie `XSRF-TOKEN`) en toda petición que modifica datos."
    bearerAuth:
      type: http
      scheme: bearer
      description: Token personal de Sanctum.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Opcional. Una repetición con la misma clave devuelve la respuesta original (middleware `idempotency:optional`).
      schema:
        type: string
        maxLength: 255
  responses:
    BadRequest:
      description: 400 Petición inválida (p. ej. `page[cursor]` o `sort` no admitidos).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: 401 Sin sesión válida (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: 403 Sin permiso, tipo de usuario no permitido o MFA reciente requerido (`mfa_required`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: 404 Recurso no encontrado (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "409 Conflicto: `version_conflict`, `conflict` (unicidad o recurso en uso), `system_role_protected`, `series_in_use`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: 422 Validación fallida (`validation_failed`) con `errors` por campo.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: 429 Límite de peticiones excedido (`rate_limited`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      headers:
        Retry-After:
          schema:
            type: integer
          description: Segundos de espera.
  schemas:
    Problem:
      type: object
      description: Error `application/problem+json` (RFC 9457) con extensiones `code`, `errors` y `request_id`.
      required:
        - type
        - title
        - status
        - code
        - request_id
      properties:
        type:
          type: string
          format: uri
          description: "`<HUB_PROBLEM_BASE_URI>/<code con guiones>`."
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: "Código estable: bad_request, unauthenticated, forbidden, not_found, conflict, version_conflict, system_role_protected, series_in_use, validation_failed, rate_limited, csrf_token_mismatch (419), server_error, mfa_required…"
        detail:
          type: string
        errors:
          type: object
          description: "Solo en 422: campo => lista de mensajes."
          additionalProperties:
            type: array
            items:
              type: string
        request_id:
          type: string
          description: ULID de la petición.
      additionalProperties: true
    CursorMeta:
      type: object
      required:
        - next_cursor
        - prev_cursor
        - has_more
        - page_size
      properties:
        next_cursor:
          type:
            - string
            - "null"
        prev_cursor:
          type:
            - string
            - "null"
        has_more:
          type: boolean
        page_size:
          type: integer
    CursorLinks:
      type: object
      required:
        - next
        - prev
      properties:
        next:
          type:
            - string
            - "null"
          format: uri
        prev:
          type:
            - string
            - "null"
          format: uri
    Health:
      type: object
      required:
        - status
        - app
        - checks
        - time
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        app:
          type: object
          properties:
            status:
              type: string
              enum:
                - up
            name:
              type: string
            env:
              type: string
            laravel:
              type: string
        checks:
          type: object
          properties:
            database:
              $ref: "#/components/schemas/HealthCheck"
            redis:
              $ref: "#/components/schemas/HealthCheck"
        time:
          type: string
          format: date-time
    HealthCheck:
      type: object
      required:
        - status
        - latency_ms
      properties:
        status:
          type: string
          enum:
            - up
            - down
        latency_ms:
          type: integer
        driver:
          type: string
        client:
          type: string
        error:
          type: string
          description: Solo con APP_DEBUG=true.
    LoginResult:
      type: object
      required:
        - data
      properties:
        data:
          oneOf:
            - type: object
              required:
                - mfa_required
                - methods
              properties:
                mfa_required:
                  const: true
                methods:
                  type: array
                  items:
                    type: string
                    description: "`mfa_method` del usuario y `recovery`."
            - type: object
              required:
                - mfa_required
                - user
              properties:
                mfa_required:
                  const: false
                user:
                  $ref: "#/components/schemas/Me"
    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required:
            - permissions
            - mfa
            - password
          properties:
            permissions:
              type: array
              items:
                type: string
            mfa:
              type: object
              properties:
                enabled:
                  type: boolean
                method:
                  type:
                    - string
                    - "null"
                required:
                  type: boolean
                enrollment_required:
                  type: boolean
            password:
              type: object
              properties:
                change_required:
                  type: boolean
    PasswordPolicy:
      type: object
      properties:
        min_length:
          type: integer
        complexity:
          description: Forma definida por SecurityPolicy (no inferida).
        expiry_days:
          type: integer
        history_count:
          type: integer
    User:
      type: object
      required:
        - id
        - type
        - name
        - email
        - status
        - version
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - staff
            - customer
        name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
