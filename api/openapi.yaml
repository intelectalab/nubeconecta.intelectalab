  /public/brand-theme-previews/{token}:
    get:
      tags:
        - Brands
      operationId: publicBrandThemePreviewsShow
      summary: Vista previa de un tema por enlace con token
      description: "404 si el token venció. Responde `X-Robots-Tag: noindex, nofollow` y `Cache-Control: no-store`."
      x-throttle: 60 por minuto
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9]{48}$
      responses:
        "200":
          description: Vista previa.
          content:
            application/json:
              schema:
